/* PickLabs NFL (Chris 2026-11-17): the play-by-play sims priced against every book. Same look as the PickLabs NBA page
   (DFS Terminal light + dark). One screen; long lists scroll inside their panel; name columns stay frozen on wide tables. */
:root {
  --text: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --t0: #2a6fd6; --t1: #d4561f;
}
:root, :root[data-theme="light"] {
  --ground: #e5f0f7; --surface: #f3f9fd; --ink: #0c2138; --muted: #58778f; --faint: #829bae; --rule: #ccdfed; --rule-strong: #a5c2d7;
  --panel2: #dbe9f3; --accent: #22496f; --accent-soft: #dbe9f3; --accent-ink: #ffffff;
  --good: #2f7d32; --good-soft: #dff2db; --bad: #c0392b; --bad-soft: #f8e1de;
  --board: linear-gradient(180deg, #1d3a60, #142c4c); --board-ink: #ffffff; --board-muted: #c9dbe7;
  --hdr: #142c4c; --hdr-ink: #ffffff; --sel: #142c4c; --sel-ink: #ffffff; --bar: #142c4c; --bar-ink: #ffffff; --bar-sub: #c9dbe7;
  --bet: #1d3a60; --bet-ink: #ffffff; --ctl-bg: #ffffff; --ctl-ink: #0c2138; --ctl-rule: #ffffff;
  --turf: #2f7a3d; --turf2: #2a6f37; --turf-line: rgba(255, 255, 255, .78); --turf-num: rgba(255, 255, 255, .55);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --ground: #0b1f36; --surface: #142c4c; --ink: #e8f0f6; --muted: #8fa2b6; --faint: #6c8299; --rule: #264765; --rule-strong: #31567a;
  --panel2: #183353; --accent: #9ccae1; --accent-soft: rgba(156, 202, 225, .14); --accent-ink: #0b1f36;
  --good: #aeef9c; --good-soft: #26481b; --bad: #ff8a7a; --bad-soft: rgba(255, 111, 94, .16);
  --board: linear-gradient(180deg, #183353, #142c4c); --board-ink: #ffffff; --board-muted: #9ccae1;
  --hdr: #142c4c; --hdr-ink: #ffffff; --sel: #c9dbe7; --sel-ink: #0b1f36; --bar: #c9dbe7; --bar-ink: #0b1f36; --bar-sub: #31567a;
  --bet: #c9dbe7; --bet-ink: #0b1f36; --ctl-bg: #183353; --ctl-ink: #e8f0f6; --ctl-rule: #31567a;
  --turf: #1f5a2b; --turf2: #1b5026; --turf-line: rgba(255, 255, 255, .6); --turf-num: rgba(255, 255, 255, .4);
  color-scheme: dark;
}
* { box-sizing: border-box }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ground); color: var(--ink) }
body { font: 400 14px/1.4 var(--text); font-variant-numeric: tabular-nums }
button, select, input { font: inherit; color: inherit }
button { cursor: pointer }
a { color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
[hidden] { display: none !important }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }
.app { height: 100%; height: 100dvh; display: flex; flex-direction: column; gap: 8px; max-width: 1440px; margin: 0 auto;
  padding: max(10px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(10px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)) }
/* header: one navy bar, edge to edge */
.top { position: relative; z-index: 60; display: flex; align-items: center; gap: 10px; min-width: 0; color: var(--hdr-ink);
  margin-top: calc(-1 * max(10px, env(safe-area-inset-top, 0px))); padding: max(10px, env(safe-area-inset-top, 0px)) 0 10px }
.top::before { content: ""; position: absolute; top: 0; bottom: 0; left: -100vmax; right: -100vmax; z-index: -1; background: var(--hdr); border-bottom: 1px solid var(--rule) }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 18px; white-space: nowrap }
.brand .an { display: block; height: 26px }
.brand span { color: var(--hdr-ink) }
.top .grow { flex: 1; min-width: 0 }
.top select, .thm { background: var(--ctl-bg); color: var(--ctl-ink); border: 1px solid var(--ctl-rule); border-radius: 6px; padding: 5px 8px; min-height: 32px }
.top #gamePick { width: 100%; max-width: 100% }
.upd { color: #c9dbe7; font-size: 12px; white-space: nowrap }
.thm { flex: 0 0 auto; min-width: 34px; font-size: 15px; line-height: 1 }
@media (max-width: 760px) { .upd { display: none } .brand { font-size: 16px } }
@media (max-width: 520px) { .brand .an { height: 18px } .brand span { display: none } #bookPick { max-width: 110px } }
/* scoreboard */
.board { background: var(--board); color: var(--board-ink); border: 1px solid var(--rule); border-radius: 10px; padding: 8px 16px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px }
.side { display: flex; align-items: center; gap: 12px; min-width: 0 }
.side.r { justify-content: flex-end; text-align: right }
.tn { font-weight: 800; font-size: 20px; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.tn i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 7px; vertical-align: 1px }
.side.r .tn i { margin: 0 0 0 7px }
.tmeta { color: var(--board-muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.sc { font-weight: 800; font-size: 38px; line-height: 1; min-width: 2.1ch; text-align: center }
.clk { text-align: center; line-height: 1.15 }
.clk b { display: block; font-weight: 700; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--board-muted) }
.clk strong { font-weight: 700; font-size: 22px }
.clk small { display: block; color: var(--board-muted); font-size: 11px }
@media (max-width: 760px) { .board { padding: 6px 10px; gap: 6px } .tn { font-size: 15px } .sc { font-size: 28px } .clk strong { font-size: 17px } .tmeta { display: none } }
/* tabs */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--rule-strong); overflow-x: auto; scrollbar-width: none; flex: 0 0 auto }
.tabs::-webkit-scrollbar { display: none }
.tabs button { flex: 0 0 auto; background: none; border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px; padding: 6px 12px; font-weight: 700; color: var(--muted); border-radius: 6px 6px 0 0 }
.tabs button[aria-selected="true"] { background: var(--sel); color: var(--sel-ink); border-bottom-color: var(--sel) }
/* views */
.views { flex: 1; min-height: 0; position: relative }
.view { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 8px; min-height: 0 }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 6px }
.scroll { flex: 1; min-height: 0; overflow: auto }
.lbl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted) }
.row { display: flex; align-items: center; gap: 8px; min-width: 0 }
.row.wrap { flex-wrap: wrap }
.spacer { flex: 1 }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--sel); border-radius: 6px; overflow: hidden; flex: 0 0 auto }
.seg button { border: 0; background: none; padding: 4px 10px; font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap }
.seg button[aria-pressed="true"] { background: var(--sel); color: var(--sel-ink) }
.note { color: var(--muted); font-size: 12px }
.empty { color: var(--muted); font-size: 13px; padding: 12px 0 }
.tag { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; vertical-align: 1px }
.tag.ok { background: var(--good-soft); color: var(--good) }
.tag.un { background: var(--panel2); color: var(--muted) }
.ev { font-weight: 700 }
.ev.pos { color: var(--good) } .ev.neg { color: var(--bad) }
a.px { display: inline-flex; flex-direction: column; align-items: center; min-width: 58px; padding: 2px 8px; border-radius: 6px; background: var(--bet); color: var(--bet-ink); text-decoration: none; font-weight: 700; line-height: 1.15 }
a.px small, span.px small { font-weight: 500; font-size: 10px; opacity: .85 }
span.px { display: inline-flex; flex-direction: column; align-items: center; min-width: 58px; padding: 2px 8px; font-weight: 700; line-height: 1.15 }
/* tables: name column frozen on horizontal scroll (every table) */
.tbl { overflow: auto; flex: 1; min-height: 0 }
table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px }
th, td { padding: 5px 8px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--rule) }
th { position: sticky; top: 0; z-index: 2; background: var(--surface); color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em }
th:first-child, td:first-child { position: sticky; left: 0; z-index: 1; background: var(--surface); text-align: left; box-shadow: 1px 0 0 var(--rule) }
th:first-child { z-index: 3 }
td.l, th.l { text-align: left }
td small { color: var(--muted) }
/* replay */
.rp { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 8px; height: 100% }
.rp-left { display: flex; flex-direction: column; gap: 6px; min-height: 0 }
.fieldbox { flex: 0 1 auto; position: relative }
#field { width: 100%; height: auto; max-height: 38vh; display: block }
#field .ez0 { fill: var(--t0) } #field .ez1 { fill: var(--t1) }
#field .grass { fill: var(--turf) } #field .stripe { fill: var(--turf2) }
#field .yl { stroke: var(--turf-line); stroke-width: .25 } #field .hash { stroke: var(--turf-line); stroke-width: .18 }
#field .num { fill: var(--turf-num); font: 700 3.2px var(--text); text-anchor: middle }
#field .eztxt { fill: rgba(255, 255, 255, .85); font: 800 4.2px var(--text); text-anchor: middle; letter-spacing: .3px }
#field .los { stroke: #6fb7ff; stroke-width: .45 } #field .fd { stroke: #ffd84a; stroke-width: .45 }
#field .ball { fill: #7a4318; stroke: #fff; stroke-width: .25 }
#field .trail { fill: none; stroke: #fff; stroke-width: .35; stroke-dasharray: .9 .6; opacity: .9 }
.ctl { display: flex; align-items: center; gap: 6px; flex-wrap: wrap }
.btn { border: 1px solid var(--rule-strong); background: var(--surface); border-radius: 6px; padding: 4px 10px; font-weight: 600; min-height: 30px }
.btn.primary { background: var(--sel); border-color: var(--sel); color: var(--sel-ink) }
.ctl select { background: var(--surface); border: 1px solid var(--rule-strong); border-radius: 6px; padding: 4px 6px; min-height: 30px }
.ctl input[type=range] { flex: 1; min-width: 120px; accent-color: var(--accent) }
.playnow { font-weight: 600; min-height: 40px }
.playnow small { display: block; color: var(--muted); font-weight: 400 }
.feed { list-style: none; margin: 0; padding: 0; font-size: 13px }
.feed li { padding: 4px 6px; border-bottom: 1px solid var(--rule); display: grid; grid-template-columns: 70px 1fr auto; gap: 6px }
.feed li.cur { background: var(--accent-soft) }
.feed li.td { font-weight: 700 }
.feed .t { color: var(--muted); font-size: 11px }
.bets { list-style: none; margin: 0; padding: 0 }
.bets li { padding: 7px 0; border-bottom: 1px solid var(--rule); display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center }
.bets .st { font-size: 12px; color: var(--muted) }
.bets .hit { color: var(--good); font-weight: 700 } .bets .miss { color: var(--bad); font-weight: 700 }
.bar { height: 5px; border-radius: 3px; background: var(--panel2); grid-column: 1 / -1; overflow: hidden }
.bar i { display: block; height: 100%; background: var(--accent) }
.bar i.ok { background: var(--good) }
@media (max-width: 900px) { .rp { grid-template-columns: 1fr; grid-template-rows: auto auto; overflow: auto; align-content: start }
  .rp > .panel { min-height: auto } .rp-left .scroll { flex: 0 0 auto; max-height: 24vh } .rp-right .scroll { flex: 0 0 auto; max-height: 46vh } #field { max-height: 30vh } }
/* cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; align-content: start }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column }
.card h3 { margin: 0; padding: 8px 12px; background: var(--bar); color: var(--bar-ink); font-size: 13px; font-weight: 800; display: flex; justify-content: space-between; gap: 8px }
.card h3 small { color: var(--bar-sub); font-weight: 600 }
.card .bd { padding: 8px 12px; display: flex; flex-direction: column; gap: 8px }
.pick { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; padding-bottom: 8px; border-bottom: 1px solid var(--rule) }
.pick:last-child { border-bottom: 0; padding-bottom: 0 }
.pick .g { color: var(--muted); font-size: 12px; grid-column: 1 }
.cdown { display: flex; gap: 10px; align-items: baseline; padding: 10px 12px; background: var(--board); color: var(--board-ink); border-radius: 10px }
.cdown .t { font-weight: 800; font-size: 20px } .cdown .w { color: var(--board-muted); font-size: 12px }
.kpis { display: flex; gap: 8px; flex-wrap: wrap }

<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (x, d = 0) => x === null || x === undefined ? "–" : (100 * x).toFixed(d) + "%";
const odds = a => a === null || a === undefined ? "–" : (a > 0 ? "+" + a : String(a));
const dec1 = a => a > 0 ? 1 + a / 100 : 1 + 100 / Math.abs(a);
const DATA = "https://raw.githubusercontent.com/chrisgimino/jabroni/nfl-data/";
const DLURL = id => `https://switchboard.actionnetwork.com/v2/deeplink?deeplinkId[0]=${encodeURIComponent(id)}&context=fantasylabs-picklabs`;
const DLMULTI = ids => `https://switchboard.actionnetwork.com/v2/deeplink?${ids.map((d, i) => `deeplinkId[${i}]=${encodeURIComponent(d)}`).join("&")}&context=fantasylabs-picklabs`;
const isTest = id => !id || String(id).startsWith("TEST-");
const S = { slate: null, prices: null, gid: null, i: 0, playing: false, timer: null, view: "replay", book: null, scope: "game", tested: true, per: "game", tdKind: "anytime_td" };
try { S.book = localStorage.getItem("plNflBook") || null; } catch (e) {}

// ---------------------------------------------------------------- data (nfl-data branch; prices re-read every 5 minutes)
async function getJSON(u) { const r = await fetch(u, { cache: "no-store" }); if (!r.ok) throw new Error(r.status); return r.json(); }
async function load(first) {
  const p = await getJSON(DATA + "nfl_picklabs_prices.json");
  if (!first && S.prices && p.created_utc === S.prices.created_utc) return false;
  if (first || !S.slate || p.slate !== S.slate.id) S.slate = await getJSON(DATA + "nfl_picklabs_replay_data.json");
  S.prices = p; return true;
}
const stamp = s => { const d = new Date(s); return isNaN(d) ? "" : d.toLocaleString("en-US", { timeZone: "America/New_York", weekday: "short", hour: "numeric", minute: "2-digit" }) + " ET"; };
const games = () => S.slate?.index?.games || [];
const G = gid => S.slate?.games?.[gid];
const INS = gid => S.prices?.games?.[gid]?.std;
function fillPicker() {
  $("gamePick").innerHTML = games().map(g => `<option value="${g.schedule_id}">${esc(g.away)} at ${esc(g.home)}${g.kick ? " · " + esc(stamp(g.kick)) : ""}</option>`).join("");
  $("gamePick").value = S.gid;
}
function fillBooks() {
  const set = new Set();
  for (const g of Object.values(S.prices?.games || {})) (g?.std?.books || []).forEach(b => set.add(b));
  const bs = [...set].sort();
  $("bookPick").innerHTML = `<option value="">Best price</option>` + bs.map(b => `<option${b === S.book ? " selected" : ""}>${esc(b)}</option>`).join("");
  if (S.book && !set.has(S.book)) S.book = null;
}
// a price at the chosen book (our chance stays; EV moves with the price); null when that book doesn't hang it
function atBook(price, book, dl, bp, p) {
  if (!S.book || book === S.book) return { price, book, dl, ev: p === null || p === undefined ? null : p * dec1(price) - 1 };
  const q = bp?.[S.book]; if (!q) return null;
  return { price: q[0], book: S.book, dl: q[1], ev: p === null || p === undefined ? null : p * dec1(q[0]) - 1 };
}
function px(price, book, dl) {
  const t = `${odds(price)}${book ? `<small>${esc(book)}</small>` : ""}`;
  return !isTest(dl) && price !== null && price !== undefined ? `<a class="px" href="${DLURL(dl)}" target="_blank" rel="noopener">${t}</a>` : `<span class="px">${t}</span>`;
}
const evh = ev => ev === null || ev === undefined ? "–" : `<span class="ev ${ev >= 0 ? "pos" : "neg"}">${ev >= 0 ? "+" : ""}${(100 * ev).toFixed(1)}%</span>`;
const tag = ok => ok ? `<span class="tag ok" title="${esc(S.prices?.tested?.props || "")}">Tested</span>` : `<span class="tag un" title="${esc(S.prices?.tested?.untested || "")}">Untested</span>`;

// ---------------------------------------------------------------- field + replay
const SPEED = () => +$("speed").value;
function teams() { const m = G(S.gid)?.matchup; return m ? [m.home, m.away] : ["", ""]; }
function playerName(id) { const r = G(S.gid)?.replay; return r?.players?.[id]?.name || ""; }
// the home team defends the left end zone (x 0-10) and attacks right; yards_to_goal is to the end zone being attacked
function xAt(off, ytg) { const [h] = teams(); return off === h ? 110 - ytg : 10 + ytg; }
function drawField() {
  const [h, a] = teams(); let s = `<rect class="grass" x="0" y="0" width="120" height="53.3"/>`;
  for (let x = 10; x < 110; x += 10) s += `<rect class="stripe" x="${x}" y="0" width="5" height="53.3"/>`;
  s += `<rect class="ez0" x="0" y="0" width="10" height="53.3"/><rect class="ez1" x="110" y="0" width="10" height="53.3"/>`;
  s += `<text class="eztxt" transform="translate(5.6 26.65) rotate(-90)">${esc(h)}</text><text class="eztxt" transform="translate(114.4 26.65) rotate(90)">${esc(a)}</text>`;
  for (let x = 10; x <= 110; x += 5) s += `<line class="yl" x1="${x}" y1="0" x2="${x}" y2="53.3"/>`;
  for (let x = 11; x < 110; x++) if (x % 5) s += `<line class="hash" x1="${x}" y1="22.2" x2="${x}" y2="23.2"/><line class="hash" x1="${x}" y1="30.1" x2="${x}" y2="31.1"/>`;
  for (let x = 20; x <= 100; x += 10) { const n = x <= 60 ? x - 10 : 110 - x; s += `<text class="num" x="${x}" y="9">${n}</text><text class="num" x="${x}" y="47">${n}</text>`; }
  s += `<line class="los" id="los" x1="0" y1="0" x2="0" y2="53.3"/><line class="fd" id="fdl" x1="0" y1="0" x2="0" y2="53.3"/><path class="trail" id="trail"/><circle class="ball" id="ball" cx="60" cy="26.65" r="1"/>`;
  $("field").innerHTML = s;
}
const QN = q => ({ 1: "1st", 2: "2nd", 3: "3rd", 4: "4th", 5: "OT" }[q] || "");
const DN = d => ({ 1: "1st", 2: "2nd", 3: "3rd", 4: "4th" }[d] || "");
function playText(p) {
  const n = id => esc(playerName(id) || "?");
  switch (p.type) {
    case "kickoff": return p.result === "return_touchdown" ? "Kickoff returned for a TOUCHDOWN" : p.result === "kicking_team_recovers" ? "Onside kick recovered" : "Kickoff";
    case "pass": return p.complete ? `${n(p.passer)} to ${p.target ? n(p.target) : "?"} for ${p.yards} yds${p.result === "touchdown" ? ", TOUCHDOWN" : ""}`
                                   : p.result === "turnover" ? `${n(p.passer)} INTERCEPTED${p.target ? " (for " + n(p.target) + ")" : ""}` : `${n(p.passer)} incomplete${p.target ? " to " + n(p.target) : ""}`;
    case "run": return `${n(p.carrier)} runs for ${p.yards} yds${p.result === "touchdown" ? ", TOUCHDOWN" : p.result === "turnover" ? ", FUMBLE lost" : ""}`;
    case "scramble": return `${n(p.passer || p.carrier)} scrambles for ${p.yards} yds${p.result === "touchdown" ? ", TOUCHDOWN" : ""}`;
    case "sack": return `${n(p.passer)} sacked for ${p.yards} yds${p.result === "turnover" ? ", FUMBLE lost" : ""}`;
    case "punt": return "Punt";
    case "field_goal": return p.result === "field_goal_good" ? `Field goal GOOD from ${(p.yards_to_goal || 0) + 17} yds` : `Field goal MISSED from ${(p.yards_to_goal || 0) + 17} yds`;

  h += `</div>`;
  if (A.length) h += `<div class="panel" style="margin-top:8px"><div class="lbl">Alt lines and milestones</div><div class="tbl"><table><thead><tr><th>Player</th><th class="l">Bet</th><th>Sim</th><th>Books</th><th>Best price</th><th>EV</th></tr></thead><tbody>${A.map(r => {
    const at = atBook(r.price, r.book, r.dl, r.bp, r.sim); return at ? `<tr><td>${esc(r.name)} <small>${esc(r.team || "")}</small></td><td class="l">${r.k}+ ${esc(r.stat)}</td><td>${pct(r.sim, 1)}</td><td>${pct(r.market, 1)}</td><td>${px(at.price, at.book, at.dl)}</td><td>${evh(at.ev)}</td></tr>` : ""; }).join("")}</tbody></table></div></div>`;
  $("ladBoard").innerHTML = L.length || A.length ? h : `<div class="empty">No alt lines or milestones up for this game</div>`;
}
// ---------------------------------------------------------------- results
function renderResults() {
  const R = S.prices?.bet_results || {}, k = (x, lab) => x ? `<div class="kpi"><b>${x.units >= 0 ? "+" : ""}${x.units}u</b><span>${lab}: ${x.won}-${x.lost}${x.push ? "-" + x.push : ""} (${x.bets} graded)</span></div>` : "";
  const last = (R.last || []).slice().reverse();
  $("resBoard").innerHTML = `<div class="kpis">${k(R.pick, "Best bets")}${k(R.parlay, "Parlays")}</div><p class="note">1 unit a bet at the price we posted. Graded from the official stats once the games are final.</p>
    <div class="panel"><div class="tbl"><table><thead><tr><th>Bet</th><th class="l">Game</th><th>Price</th><th>Result</th><th>Units</th></tr></thead><tbody>${last.map(r =>
      `<tr><td>${esc(r.text)}</td><td class="l">${esc(r.game || "")}</td><td>${odds(+r.price)} <small>${esc(r.book)}</small></td><td class="${r.grade === "win" ? "ev pos" : r.grade === "loss" ? "ev neg" : ""}">${esc(r.grade)}</td><td>${esc(r.units)}</td></tr>`).join("") || `<tr><td>No graded bets yet</td><td></td><td></td><td></td><td></td></tr>`}</tbody></table></div></div>`;
}
// ---------------------------------------------------------------- players (sim means)
function renderPlayers() {
  const g = G(S.gid); const P = g?.matchup?.markets?.players || {};
  const rows = Object.entries(P).filter(([, p]) => p.pos !== "K").sort((a, b) => (a[1].team + a[1].pos).localeCompare(b[1].team + b[1].pos));
  const m = (p, k) => p.mean?.[k] ?? "–";
  $("plT").innerHTML = `<table><thead><tr><th>Player</th><th class="l">Pos</th><th class="l">Team</th><th>Pass yds</th><th>Pass TD</th><th>Rush att</th><th>Rush yds</th><th>Targets</th><th>Rec</th><th>Rec yds</th><th>TDs</th><th>Anytime TD</th><th>First TD</th></tr></thead><tbody>${rows.map(([id, p]) =>
    `<tr><td>${esc(p.name)}</td><td class="l">${esc(p.pos)}</td><td class="l">${esc(p.team)}</td><td>${m(p, "pass_yds")}</td><td>${m(p, "pass_td")}</td><td>${m(p, "rush_att")}</td><td>${m(p, "rush_yds")}</td><td>${m(p, "tgt")}</td><td>${m(p, "rec")}</td><td>${m(p, "rec_yds")}</td><td>${m(p, "td")}</td><td>${pct(p.ladder?.td?.[0], 1)}</td><td>${pct(p.first_td, 1)}</td></tr>`).join("")}</tbody></table>
    <p class="note" style="padding:6px 8px">Means over ${esc(g?.matchup?.sims || "")} play-by-play sims.</p>`;
}
// ---------------------------------------------------------------- views
const VIEWS = { replay: () => renderReplay(false), best: renderBest, parlay: renderParlay, bet: renderBet, props: renderProps, td: renderTD, ladders: renderLadders, results: renderResults, players: renderPlayers };
function showView(v) {
  S.view = v; document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.view === v));
  document.querySelectorAll(".view").forEach(s => s.hidden = s.dataset.v !== v); VIEWS[v]();
}
$("tabs").addEventListener("click", e => { const b = e.target.closest("button[data-view]"); if (b) { if (S.view === "replay") stop(); showView(b.dataset.view); } });
function pick(gid) {
  stop(); S.gid = gid; S.i = 0; const m = G(gid)?.matchup; if (!m) return;
  $("n0").innerHTML = `<i style="background:var(--t0)"></i>${esc(m.home)}`; $("n1").innerHTML = `${esc(m.away)}<i style="background:var(--t1)"></i>`;
  $("l0").textContent = "Home"; $("l1").textContent = "Away";
  renderReplay(true); if (S.view !== "replay") VIEWS[S.view]();
}
$("gamePick").addEventListener("change", e => pick(e.target.value));
$("bookPick").addEventListener("change", e => { S.book = e.target.value || null; try { S.book ? localStorage.setItem("plNflBook", S.book) : localStorage.removeItem("plNflBook"); } catch (x) {} VIEWS[S.view](); });
(function () { const b = $("themeBtn"), root = document.documentElement;
  function paint() { const d = root.getAttribute("data-theme") === "dark"; b.textContent = d ? "☀" : "☾"; b.setAttribute("aria-label", d ? "Light theme" : "Dark theme"); }
  b.addEventListener("click", () => { const t = root.getAttribute("data-theme") === "dark" ? "light" : "dark"; root.setAttribute("data-theme", t); try { localStorage.setItem("plTheme", t); } catch (e) {} paint(); }); paint(); })();
async function boot() {
  try { await load(true); } catch (e) { $("views").innerHTML = `<div class="empty" style="padding:16px">No sims published yet.</div>`; return; }
  $("upd").textContent = `Updated ${stamp(S.prices.created_utc)}`; S.gid = games()[0]?.schedule_id; fillPicker(); fillBooks(); pick(S.gid);
}
let lastRefresh = Date.now();
async function refresh() { lastRefresh = Date.now(); try { if (await load(false)) { $("upd").textContent = `Updated ${stamp(S.prices.created_utc)}`; fillBooks(); if (S.view !== "replay") VIEWS[S.view](); else renderLiveBets(); } } catch (e) {} }
setInterval(refresh, 5 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - lastRefresh > 60000) refresh(); });
boot();
</script>
</body>
