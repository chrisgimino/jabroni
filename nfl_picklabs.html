<style>
/* PickLabs NFL (Chris 2026-11-17): the play-by-play sims priced against every book. Same look as the PickLabs NBA page
   (DFS Terminal light + dark). One screen; long lists scroll inside their panel; name columns stay frozen on wide tables. */
:root {
  --text: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --t0: #2a6fd6; --t1: #d4561f;
}
:root, :root[data-theme="light"] {
  --ground: #e5f0f7; --surface: #f3f9fd; --ink: #0c2138; --muted: #58778f; --faint: #829bae; --rule: #ccdfed; --rule-strong: #a5c2d7;
  --panel2: #dbe9f3; --accent: #22496f; --accent-soft: #dbe9f3; --accent-ink: #ffffff;
  --good: #2f7d32; --good-soft: #dff2db; --bad: #c0392b; --bad-soft: #f8e1de;
  --board: linear-gradient(180deg, #1d3a60, #142c4c); --board-ink: #ffffff; --board-muted: #c9dbe7;
  --hdr: #142c4c; --hdr-ink: #ffffff; --sel: #142c4c; --sel-ink: #ffffff; --bar: #142c4c; --bar-ink: #ffffff; --bar-sub: #c9dbe7;
  --bet: #1d3a60; --bet-ink: #ffffff; --ctl-bg: #ffffff; --ctl-ink: #0c2138; --ctl-rule: #ffffff;
  --turf: #2f7a3d; --turf2: #2a6f37; --turf-line: rgba(255, 255, 255, .78); --turf-num: rgba(255, 255, 255, .55);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --ground: #0b1f36; --surface: #142c4c; --ink: #e8f0f6; --muted: #8fa2b6; --faint: #6c8299; --rule: #264765; --rule-strong: #31567a;
  --panel2: #183353; --accent: #9ccae1; --accent-soft: rgba(156, 202, 225, .14); --accent-ink: #0b1f36;
  --good: #aeef9c; --good-soft: #26481b; --bad: #ff8a7a; --bad-soft: rgba(255, 111, 94, .16);
  --board: linear-gradient(180deg, #183353, #142c4c); --board-ink: #ffffff; --board-muted: #9ccae1;
  --hdr: #142c4c; --hdr-ink: #ffffff; --sel: #c9dbe7; --sel-ink: #0b1f36; --bar: #c9dbe7; --bar-ink: #0b1f36; --bar-sub: #31567a;
  --bet: #c9dbe7; --bet-ink: #0b1f36; --ctl-bg: #183353; --ctl-ink: #e8f0f6; --ctl-rule: #31567a;
  --turf: #1f5a2b; --turf2: #1b5026; --turf-line: rgba(255, 255, 255, .6); --turf-num: rgba(255, 255, 255, .4);
  color-scheme: dark;
}
* { box-sizing: border-box }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ground); color: var(--ink) }
body { font: 400 14px/1.4 var(--text); font-variant-numeric: tabular-nums }
button, select, input { font: inherit; color: inherit }
button { cursor: pointer }
a { color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
[hidden] { display: none !important }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }
.app { height: 100%; height: 100dvh; display: flex; flex-direction: column; gap: 8px; max-width: 1440px; margin: 0 auto;
  padding: max(10px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(10px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)) }
/* header: one navy bar, edge to edge */
.top { position: relative; z-index: 60; display: flex; align-items: center; gap: 10px; min-width: 0; color: var(--hdr-ink);
  margin-top: calc(-1 * max(10px, env(safe-area-inset-top, 0px))); padding: max(10px, env(safe-area-inset-top, 0px)) 0 10px }
.top::before { content: ""; position: absolute; top: 0; bottom: 0; left: -100vmax; right: -100vmax; z-index: -1; background: var(--hdr); border-bottom: 1px solid var(--rule) }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 18px; white-space: nowrap }
.brand .an { display: block; height: 26px }
.brand span { color: var(--hdr-ink) }
.top .grow { flex: 1; min-width: 0 }
.top select, .thm { background: var(--ctl-bg); color: var(--ctl-ink); border: 1px solid var(--ctl-rule); border-radius: 6px; padding: 5px 8px; min-height: 32px }
.top #gamePick { width: 100%; max-width: 100% }
.upd { color: #c9dbe7; font-size: 12px; white-space: nowrap }
.thm { flex: 0 0 auto; min-width: 34px; font-size: 15px; line-height: 1 }
@media (max-width: 760px) { .upd { display: none } .brand { font-size: 16px } }
@media (max-width: 520px) { .brand .an { height: 18px } .brand span { display: none } #bookPick { max-width: 110px } }
/* scoreboard */
.board { background: var(--board); color: var(--board-ink); border: 1px solid var(--rule); border-radius: 10px; padding: 8px 16px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px }
.side { display: flex; align-items: center; gap: 12px; min-width: 0 }
.side.r { justify-content: flex-end; text-align: right }
.tn { font-weight: 800; font-size: 20px; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.tn i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 7px; vertical-align: 1px }
.side.r .tn i { margin: 0 0 0 7px }
.tmeta { color: var(--board-muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.sc { font-weight: 800; font-size: 38px; line-height: 1; min-width: 2.1ch; text-align: center }
.clk { text-align: center; line-height: 1.15 }
.clk b { display: block; font-weight: 700; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--board-muted) }
.clk strong { font-weight: 700; font-size: 22px }
.clk small { display: block; color: var(--board-muted); font-size: 11px }
@media (max-width: 760px) { .board { padding: 6px 10px; gap: 6px } .tn { font-size: 15px } .sc { font-size: 28px } .clk strong { font-size: 17px } .tmeta { display: none } }
/* tabs */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--rule-strong); overflow-x: auto; scrollbar-width: none; flex: 0 0 auto }
.tabs::-webkit-scrollbar { display: none }
.tabs button { flex: 0 0 auto; background: none; border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px; padding: 6px 12px; font-weight: 700; color: var(--muted); border-radius: 6px 6px 0 0 }
.tabs button[aria-selected="true"] { background: var(--sel); color: var(--sel-ink); border-bottom-color: var(--sel) }
/* views */
.views { flex: 1; min-height: 0; position: relative }
.view { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 8px; min-height: 0 }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 6px }
.scroll { flex: 1; min-height: 0; overflow: auto }
.lbl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted) }
.row { display: flex; align-items: center; gap: 8px; min-width: 0 }
.row.wrap { flex-wrap: wrap }
.spacer { flex: 1 }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--sel); border-radius: 6px; overflow: hidden; flex: 0 0 auto }
.seg button { border: 0; background: none; padding: 4px 10px; font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap }
.seg button[aria-pressed="true"] { background: var(--sel); color: var(--sel-ink) }
.note { color: var(--muted); font-size: 12px }
.empty { color: var(--muted); font-size: 13px; padding: 12px 0 }
.tag { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; vertical-align: 1px }
.tag.ok { background: var(--good-soft); color: var(--good) }
.tag.un { background: var(--panel2); color: var(--muted) }
.ev { font-weight: 700 }
.ev.pos { color: var(--good) } .ev.neg { color: var(--bad) }
a.px { display: inline-flex; flex-direction: column; align-items: center; min-width: 58px; padding: 2px 8px; border-radius: 6px; background: var(--bet); color: var(--bet-ink); text-decoration: none; font-weight: 700; line-height: 1.15 }
a.px small, span.px small { font-weight: 500; font-size: 10px; opacity: .85 }
span.px { display: inline-flex; flex-direction: column; align-items: center; min-width: 58px; padding: 2px 8px; font-weight: 700; line-height: 1.15 }
/* tables: name column frozen on horizontal scroll (every table) */
.tbl { overflow: auto; flex: 1; min-height: 0 }
table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px }
th, td { padding: 5px 8px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--rule) }
th { position: sticky; top: 0; z-index: 2; background: var(--surface); color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em }
th:first-child, td:first-child { position: sticky; left: 0; z-index: 1; background: var(--surface); text-align: left; box-shadow: 1px 0 0 var(--rule) }
th:first-child { z-index: 3 }
td.l, th.l { text-align: left }
td small { color: var(--muted) }
/* replay (2026-11-18): the field fills the panel; 22 dots; results pop up by the ball, big moments as a banner */
.rp { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 8px; height: 100% }
.rp-left { display: flex; flex-direction: column; gap: 6px; min-height: 0; padding: 6px }
.fieldbox { position: relative; flex: 1; min-height: 200px; border-radius: 8px; overflow: hidden; background: var(--turf2); cursor: pointer }
#field { position: absolute; inset: 0; width: 100%; height: 100%; display: block }
#field .surround { fill: var(--turf2); filter: brightness(.82) }
#field .grass { fill: var(--turf) } #field .stripe { fill: var(--turf2) }
#field .yl { stroke: var(--turf-line); stroke-width: .2 } #field .hash { stroke: var(--turf-line); stroke-width: .16 }
#field .sideline { fill: none; stroke: #fff; stroke-width: .35 }
#field .num { fill: var(--turf-num); font: 700 3px var(--text); text-anchor: middle }
#field .eztxt { fill: rgba(255, 255, 255, .88); font: 800 4.2px var(--text); text-anchor: middle; letter-spacing: .3px }
#field .post { stroke: #ffd84a; stroke-width: .45; stroke-linecap: round }
#field .los { stroke: #5aa9ff; stroke-width: .35 } #field .fd { stroke: #ffd84a; stroke-width: .35 }
#field .flag { fill: #ffd400; stroke: #6b5a00; stroke-width: .08 }
#field .dot circle { stroke-width: .2 }
#field .dot text { font: 800 1.05px var(--text); text-anchor: middle; dominant-baseline: central; pointer-events: none }
#field .ball { fill: #8a4a1c; stroke: #fff; stroke-width: .12 }
#field .bsh { fill: #000 }
#field .tag { font: 700 1.3px var(--text); text-anchor: middle; fill: #fff; stroke: rgba(0, 0, 0, .7); stroke-width: .3; paint-order: stroke; pointer-events: none }
.call { position: absolute; z-index: 3; min-width: 150px; max-width: min(340px, 86%); background: rgba(9, 13, 20, .93); color: #fff; border-radius: 8px;
  padding: 6px 10px 6px 13px; box-shadow: 0 6px 18px rgba(0, 0, 0, .35); pointer-events: none; animation: callIn .22s ease-out }
.call::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; border-radius: 8px 0 0 8px; background: var(--cc) }
.call .h { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 14px; line-height: 1.2 }
.call .b { margin-left: auto; padding: 1px 7px; border-radius: 5px; font-size: 13px; font-weight: 800; white-space: nowrap }
.call .b.pos { background: #2fbf71; color: #052313 } .call .b.neg, .call .b.to { background: #e5484d; color: #fff }
.call .b.td { background: #f5c518; color: #1a1400 } .call .b.neu { background: #4a5563; color: #fff } .call .b.flag { background: #ffd400; color: #1a1400 }
.call .s { font-size: 12px; color: #c9d3df; margin-top: 2px }
.banner { position: absolute; left: 50%; top: 9%; z-index: 4; padding: 6px 20px 8px; border-radius: 9px; text-align: center; color: #fff; background: var(--bc);
  font-weight: 900; font-size: clamp(18px, 3vw, 32px); letter-spacing: .07em; box-shadow: 0 8px 26px rgba(0, 0, 0, .4); border: 2px solid rgba(255, 255, 255, .85);
  transform: translateX(-50%); animation: banIn .32s ease-out; pointer-events: none; white-space: nowrap }
.banner small { display: block; font-size: 12px; letter-spacing: .1em; font-weight: 700; opacity: .9 }
.sit { position: absolute; left: 8px; bottom: 8px; z-index: 2; background: rgba(9, 13, 20, .72); color: #fff; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 6px; pointer-events: none; max-width: calc(100% - 16px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
@keyframes callIn { from { opacity: 0; transform: translateY(6px) scale(.92) } to { opacity: 1; transform: none } }
@keyframes banIn { from { opacity: 0; transform: translateX(-50%) scale(.75) } to { opacity: 1; transform: translateX(-50%) scale(1) } }
.ctl { display: flex; align-items: center; gap: 6px; flex-wrap: wrap }
.btn { border: 1px solid var(--rule-strong); background: var(--surface); border-radius: 6px; padding: 4px 10px; font-weight: 600; min-height: 30px }

.cdown .cd-w { font: 600 13px/1.2 var(--text); color: var(--board-muted) }

#parBoard { flex: 1; min-height: 0; display: flex; flex-direction: column }

<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (x, d = 0) => x === null || x === undefined ? "–" : (100 * x).toFixed(d) + "%";
const odds = a => a === null || a === undefined ? "–" : (a > 0 ? "+" + a : String(a));
const dec1 = a => a > 0 ? 1 + a / 100 : 1 + 100 / Math.abs(a);
const DATA = "https://raw.githubusercontent.com/chrisgimino/jabroni/nfl-data/";
const DLURL = id => `https://switchboard.actionnetwork.com/v2/deeplink?deeplinkId[0]=${encodeURIComponent(id)}&context=fantasylabs-picklabs`;
const DLMULTI = ids => `https://switchboard.actionnetwork.com/v2/deeplink?${ids.map((d, i) => `deeplinkId[${i}]=${encodeURIComponent(d)}`).join("&")}&context=fantasylabs-picklabs`;
const isTest = id => !id || String(id).startsWith("TEST-");
const S = { slate: null, prices: null, gid: null, i: 0, playing: false, timer: null, view: "replay", book: null, scope: "game", tested: true, per: "game", tdKind: "anytime_td" };
try { S.book = localStorage.getItem("plNflBook") || null; } catch (e) {}

// ---------------------------------------------------------------- data (nfl-data branch; prices re-read every 5 minutes)
async function getJSON(u) { const r = await fetch(u, { cache: "no-store" }); if (!r.ok) throw new Error(r.status); return r.json(); }
async function load(first) {
  const p = await getJSON(DATA + "nfl_picklabs_prices.json");
  if (!first && S.prices && p.created_utc === S.prices.created_utc) return false;
  if (first || !S.slate || p.slate !== S.slate.id) S.slate = await getJSON(DATA + "nfl_picklabs_replay_data.json");
  S.prices = p; return true;
}
const stamp = s => { const d = new Date(s); return isNaN(d) ? "" : d.toLocaleString("en-US", { timeZone: "America/New_York", weekday: "short", hour: "numeric", minute: "2-digit" }) + " ET"; };
const games = () => S.slate?.index?.games || [];
const G = gid => S.slate?.games?.[gid];
const INS = gid => S.prices?.games?.[gid]?.std;
function fillPicker() {
  $("gamePick").innerHTML = games().map(g => `<option value="${g.schedule_id}">${esc(g.away)} at ${esc(g.home)}${g.kick ? " · " + esc(stamp(g.kick)) : ""}</option>`).join("");
  $("gamePick").value = S.gid;
}
function fillBooks() {
  const set = new Set();
  for (const g of Object.values(S.prices?.games || {})) (g?.std?.books || []).forEach(b => set.add(b));
  const bs = [...set].sort();
  $("bookPick").innerHTML = `<option value="">Best price</option>` + bs.map(b => `<option${b === S.book ? " selected" : ""}>${esc(b)}</option>`).join("");
  if (S.book && !set.has(S.book)) S.book = null;
}
// a price at the chosen book (our chance stays; EV moves with the price); null when that book doesn't hang it
function atBook(price, book, dl, bp, p) {
  if (!S.book || book === S.book) return { price, book, dl, ev: p === null || p === undefined ? null : p * dec1(price) - 1 };
  const q = bp?.[S.book]; if (!q) return null;
  return { price: q[0], book: S.book, dl: q[1], ev: p === null || p === undefined ? null : p * dec1(q[0]) - 1 };
}
function px(price, book, dl) {
  const t = `${odds(price)}${book ? `<small>${esc(book)}</small>` : ""}`;
  return !isTest(dl) && price !== null && price !== undefined ? `<a class="px" href="${DLURL(dl)}" target="_blank" rel="noopener">${t}</a>` : `<span class="px">${t}</span>`;
}
const evh = ev => ev === null || ev === undefined ? "–" : `<span class="ev ${ev >= 0 ? "pos" : "neg"}">${ev >= 0 ? "+" : ""}${(100 * ev).toFixed(1)}%</span>`;
// bet size (Chris 2026-11-17, as the NBA boards): quarter-Kelly on a 40-unit bankroll, 0.05-1 unit, at the price shown
const stakeU = (ev, price) => { if (price === null || price === undefined) return 0; const d = dec1(price); if (!(ev > 0) || !(d > 1)) return 0;
  return Math.min(1, Math.max(.05, Math.floor(10 * ev / (d - 1) / .05 + .5) * .05)); };
const uTxt = u => (Math.round(u * 100) / 100).toFixed(2).replace(/0$/, "") + "u";
const evs = (ev, price) => { const u = stakeU(ev, price); return evh(ev) + (u ? ` <small class="stk" title="bet size: quarter-Kelly on a 40-unit bankroll, 1 unit max">${uTxt(u)}</small>` : ""); };
const tag = ok => ok ? `<span class="tag ok" title="${esc(S.prices?.tested?.props || "")}">Tested</span>` : `<span class="tag un" title="${esc(S.prices?.tested?.untested || "")}">Untested</span>`;

// ---------------------------------------------------------------- replay (Chris 2026-11-18): all 22 players, every play animated from its data
// The sim logs each play: down, distance, spot, formation, personnel, the defense's front (DL-LB-DB), the offensive skill players
// on the field, passer / target / carrier, air yards, yards and the result. The dots line up in that formation and that front
// and run that play: the target's route ends at the logged air yards, the carrier is tackled at the logged yards, kicks land on
// the next spot. Where the log is silent (which gap, the other routes, who the defenders are) the page makes one fixed choice per
// play (the same every time) and never states it as a fact.
const FW = 53.3, HL = 23.58, HR = 29.72, MID = 26.65;
const TC = { ARI: "#97233F", ATL: "#A71930", BAL: "#241773", BUF: "#00338D", CAR: "#0085CA", CHI: "#0B162A", CIN: "#FB4F14", CLE: "#311D00",
  DAL: "#003594", DEN: "#FB4F14", DET: "#0076B6", GBP: "#203731", HOU: "#03202F", IND: "#002C5F", JAC: "#006778", KCC: "#E31837",
  LVR: "#000000", LAC: "#0080C6", LAR: "#003594", MIA: "#008E97", MIN: "#4F2683", NEP: "#002244", NOS: "#9F8958", NYG: "#0B2265",
  NYJ: "#125740", PHI: "#004C54", PIT: "#101820", SFO: "#AA0000", SEA: "#002244", TBB: "#D50A0A", TEN: "#0C2340", WAS: "#5A1414" };
const TC2 = { ARI: "#000000", ATL: "#000000", BAL: "#9E7C0C", BUF: "#C60C30", CAR: "#101820", CHI: "#C83803", CIN: "#000000", CLE: "#FF3C00",
  DAL: "#869397", DEN: "#002244", DET: "#B0B7BC", GBP: "#FFB612", HOU: "#A71930", IND: "#A2AAAD", JAC: "#D7A22A", KCC: "#FFB81C",
  LVR: "#A5ACAF", LAC: "#FFC20E", LAR: "#FFA300", MIA: "#FC4C02", MIN: "#FFC62F", NEP: "#C60C30", NOS: "#101820", NYG: "#A71930",
  NYJ: "#000000", PHI: "#000000", PIT: "#FFB612", SFO: "#B3995D", SEA: "#69BE28", TBB: "#34302B", TEN: "#4B92DB", WAS: "#FFB612" };
// the home team's dots: its main color, or its second color when the main one sinks into the turf (green, teal)
function homeFill(t) { const c = tcol(t), h = x => parseInt(c.slice(x, x + 2), 16), d = Math.hypot(h(1) - 42, h(3) - 111, h(5) - 55); return d < 80 && TC2[t] ? TC2[t] : c; }
const SP = { WR: 8, TE: 7, RB: 7.5, QB: 6, OL: 3.2, DL: 5, LB: 6.5, DB: 7.5, ST: 7.5, K: 6, P: 5, H: 3 };
// football speeds (yd/s, average over a leg; a leg that starts and ends at rest peaks near 1.5x): no dot runs faster
const VMAX = { WR: 7.5, TE: 6.5, RB: 7, QB: 5.5, OL: 3.5, DL: 5, LB: 6, DB: 7, ST: 7.5, K: 6, P: 5, H: 3, KR: 7.5 };
function limit(o) {   // a leg too fast for its player is stretched (he gets there later); players tied to the ball keep their timing
  if (o.sync) return; const v = VMAX[o.r] || 7, K = o.K;
  for (let j = 1; j < K.length; j++) { const need = Math.hypot(K[j][1] - K[j - 1][1], K[j][2] - K[j - 1][2]) / v, have = K[j][0] - K[j - 1][0];

        <text class="v" x="${x + w / 2}" y="${r.v >= 0 ? yy - 4 : yy + hh + 12}" text-anchor="middle">${r.v >= 0 ? "+" : ""}${r.v.toFixed(1)}%</text>
        <text x="${x + w / 2}" y="${H - 18}" text-anchor="middle">${esc(r.label)}</text><text x="${x + w / 2}" y="${H - 5}" text-anchor="middle">${mobile() ? r.n.toLocaleString() : r.n.toLocaleString() + " bets"}</text>`; }).join("") + `</svg>`;
}
function svgLine(series, o = {}) {   // series: [{name, color, pts: [[label, y]]}] -> cumulative units
  const all = series.flatMap(s => s.pts.map(p => p[1])), n = Math.max(...series.map(s => s.pts.length));
  if (!n) return "";
  const W = 460, H = 190, pl = 38, pr = 10, pt = 24, pb = 22, lo = Math.min(0, ...all), hi = Math.max(0, ...all), sp = (hi - lo) || 1;
  const x = i => pl + (W - pl - pr) * (n > 1 ? i / (n - 1) : 0), y = v => pt + (H - pt - pb) * (hi - v) / sp;
  const lab = series[0].pts;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria || "")}"><line x1="${pl}" x2="${W - pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--rule-strong)"/>
    ${y(0) - y(hi) >= 12 ? `<text x="${pl - 4}" y="${y(hi) + 4}" text-anchor="end">${hi >= 0 ? "+" : ""}${hi.toFixed(Math.abs(hi) < 10 ? 1 : 0)}</text>` : ""}<text x="${pl - 4}" y="${y(0) + 4}" text-anchor="end">0</text>
    ${lo < 0 && y(lo) - y(0) >= 12 ? `<text x="${pl - 4}" y="${y(lo) + 4}" text-anchor="end">${lo.toFixed(Math.abs(lo) < 10 ? 1 : 0)}</text>` : ""}
    <text x="${pl}" y="${H - 6}">${esc(lab[0]?.[0] || "")}</text><text x="${W - pr}" y="${H - 6}" text-anchor="end">${esc(lab[lab.length - 1]?.[0] || "")}</text>` +
    series.map(s => `<polyline fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round" points="${s.pts.map((p, i) => `${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join(" ")}"/>
      <text class="v" x="${W - pr}" y="${(v => v - 6 < 12 ? v + 16 : v - 6)(y(s.pts[s.pts.length - 1][1]))}" text-anchor="end" style="fill:${s.color}">${s.pts[s.pts.length - 1][1] >= 0 ? "+" : ""}${s.pts[s.pts.length - 1][1].toFixed(1)} u${s.est ? " est." : ""}</text>`).join("") + `</svg>`;
}
const STATN = { rec: "Receptions", rec_yds: "Receiving yards", rush_att: "Rush attempts", rush_yds: "Rush yards" };
function renderResults() {
  const el = $("resBoard"), R = S.prices?.bet_results || {}, rv = S.resView || "straight", b = BT;
  let h = `<div class="charts">`;
  if (b && b.bands) {
    h += `<div class="chart"><h4>2026 weeks 1–10 check: the bigger our edge, the more it won</h4><div class="cs">${esc(b.bands_note)}${BT_NOTE}</div>${svgBars(b.bands, { aria: "Return by edge band" })}</div>`;
    h += `<div class="chart"><h4>2026 weeks 1–10, the board's rules each week</h4><div class="cs">${esc(b.cum_note)}${BT_NOTE}</div>

  } else h += `<div class="chart"><h4>2026 backtest</h4><div class="cs">Not loaded.</div></div>`;

  const T = tot.filter(Boolean).reduce((t, x) => ({ won: t.won + (x.won || 0), lost: t.lost + (x.lost || 0), push: t.push + (x.push || 0), units: t.units + (x.units || 0), staked: t.staked + (x.staked ?? x.bets ?? 0) }), { won: 0, lost: 0, push: 0, units: 0, staked: 0 });
  const sg = v => v >= 0 ? "+" : "", roi = T.staked ? 100 * T.units / T.staked : 0, est = rv !== "straight" && sel.some(r => r.kind === "parlay" && r.grade === "win");

  const NOTE = `${RES_WHO}Every pick sized 0.05–1 unit by edge and price (quarter-Kelly on a 40-unit bankroll, at the posted price), graded from the official stats once the games are final. Return = units won ÷ units bet.${rv === "straight" ? "" : " Parlay wins are estimated: the legs' prices multiplied, which can differ from the book's own parlay price."}`;
  let c = 0; const byDay = {};

  const grp = {}; if (rv === "straight") for (const r of sel) { const k = STATN[r.stat] || null; if (!k) continue; const x = grp[k] || (grp[k] = [0, 0]); x[0] += r.grade === "win"; x[1] += r.grade === "loss"; }
  h += `<div class="chart"><h4>2026 live: our best bets</h4>${seg}<div class="cs">${NOTE}</div>
    <div class="kpis"><span><b>${T.won}-${T.lost}${T.push ? "-" + T.push : ""}</b>record</span><span><b>${sg(T.units)}${T.units.toFixed(1)} u</b>${est ? "units (est.)" : "units"}</span><span><b>${sg(roi)}${roi.toFixed(1)}%</b>return</span>${Object.entries(grp).map(([g, x]) => `<span><b>${x[0]}-${x[1]}</b>${esc(g)}</span>`).join("")}</div>
    ${ser[0].pts.length ? svgLine(ser, { aria: "Cumulative units, 2026 live" }) : `<div class="cs">No graded ${rv === "parlays" ? "parlays" : "bets"} yet.</div>`}
    ${Object.keys(rel).length ? `<div class="cs" style="margin-top:8px"><b>By release</b>: the picks made at each release</div><div class="kpis">${["Wed", "Thu", "Fri", "Sat"].filter(k => rel[k]).map(k => { const x = rel[k];
      return `<span><b>${x.won}-${x.lost} · ${sg(x.units)}${x.units.toFixed(1)}u · ${sg(x.units)}${(x.staked ? 100 * x.units / x.staked : 0).toFixed(1)}%</b>${k} 5 PM ET</span>`; }).join("")}</div>` : ""}</div>`;
  h += `</div>`;
  const rec = sel.slice().reverse().slice(0, 20);
  if (rec.length) h += `<div class="bb-h">Latest graded</div><div class="chart"><table class="rtab">${rec.map(r =>
    `<tr><td>${esc(String(r.slot).slice(5, 10))} ${esc(SLOT_DAY(String(r.slot)))}</td><td class="t">${esc(r.text)}<br><span style="color:var(--muted)">${esc(r.game || "")}</span></td><td>${odds(+r.price)} <small>${esc(r.book || "")}</small></td>
     <td class="${r.grade}">${esc(r.grade)}</td><td>${(+r.units) >= 0 ? "+" : ""}${(+r.units).toFixed(2)}${r.kind === "parlay" && r.grade === "win" ? " est." : ""}<br><span style="color:var(--muted)">bet ${uTxt(+(r.stake || 1))}</span></td></tr>`).join("")}</table></div>`;
  el.innerHTML = h;
}
