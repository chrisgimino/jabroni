<style>
/* PickLabs NHL (Chris 2026-11-19): the play-by-play hockey sims priced against every book (the NFL page's layout). Same look as the PickLabs NBA page
   (DFS Terminal light + dark). One screen; long lists scroll inside their panel; name columns stay frozen on wide tables. */
:root {
  --text: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --t0: #2a6fd6; --t1: #d4561f;
}
:root, :root[data-theme="light"] {
  --ground: #e5f0f7; --surface: #f3f9fd; --ink: #0c2138; --muted: #58778f; --faint: #829bae; --rule: #ccdfed; --rule-strong: #a5c2d7;
  --panel2: #dbe9f3; --accent: #22496f; --accent-soft: #dbe9f3; --accent-ink: #ffffff;
  --good: #2f7d32; --good-soft: #dff2db; --bad: #c0392b; --bad-soft: #f8e1de;
  --board: linear-gradient(180deg, #1d3a60, #142c4c); --board-ink: #ffffff; --board-muted: #c9dbe7;
  --hdr: #142c4c; --hdr-ink: #ffffff; --sel: #142c4c; --sel-ink: #ffffff; --bar: #142c4c; --bar-ink: #ffffff; --bar-sub: #c9dbe7;
  --bet: #1d3a60; --bet-ink: #ffffff; --ctl-bg: #ffffff; --ctl-ink: #0c2138; --ctl-rule: #ffffff;
  --turf: #2f7a3d; --turf2: #2a6f37; --turf-line: rgba(255, 255, 255, .78); --turf-num: rgba(255, 255, 255, .55);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --ground: #03080f; --surface: #10233d; --ink: #e8f0f6; --muted: #8fa2b6; --faint: #6c8299; --rule: #2c5584; --rule-strong: #3d6c9e;
  --panel2: #1f4069; --accent: #9ccae1; --accent-soft: rgba(156, 202, 225, .14); --accent-ink: #0b1f36;
  --good: #aeef9c; --good-soft: #26481b; --bad: #ff8a7a; --bad-soft: rgba(255, 111, 94, .16);
  --board: linear-gradient(180deg, #1d3a60, #11243f); --board-ink: #ffffff; --board-muted: #9ccae1;
  --hdr: #071426; --hdr-ink: #ffffff; --sel: #c9dbe7; --sel-ink: #0b1f36; --bar: #c9dbe7; --bar-ink: #0b1f36; --bar-sub: #31567a;
  --bet: #c9dbe7; --bet-ink: #0b1f36; --ctl-bg: #0e2038; --ctl-ink: #e8f0f6; --ctl-rule: #3d6c9e;
  --turf: #1f5a2b; --turf2: #1b5026; --turf-line: rgba(255, 255, 255, .6); --turf-num: rgba(255, 255, 255, .4);
  color-scheme: dark;
}
* { box-sizing: border-box }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ground); color: var(--ink) }
body { font: 400 14px/1.4 var(--text); font-variant-numeric: tabular-nums }
button, select, input { font: inherit; color: inherit }
button { cursor: pointer }
a { color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
[hidden] { display: none !important }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }
.app { height: 100%; height: 100dvh; display: flex; flex-direction: column; gap: 8px; max-width: 1440px; margin: 0 auto;
  padding: max(10px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(10px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)) }
/* header: one navy bar, edge to edge */
.top { position: relative; z-index: 60; display: flex; align-items: center; gap: 10px; min-width: 0; color: var(--hdr-ink);
  margin-top: calc(-1 * max(10px, env(safe-area-inset-top, 0px))); padding: max(10px, env(safe-area-inset-top, 0px)) 0 10px }
.top::before { content: ""; position: absolute; top: 0; bottom: 0; left: -100vmax; right: -100vmax; z-index: -1; background: var(--hdr); border-bottom: 1px solid var(--rule) }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 18px; white-space: nowrap }
.brand .an { display: block; height: 26px }
.brand span { color: var(--hdr-ink) }
.top .grow { flex: 1; min-width: 0 }
.top select, .thm { background: var(--ctl-bg); color: var(--ctl-ink); border: 1px solid var(--ctl-rule); border-radius: 6px; padding: 5px 8px; min-height: 32px }
.top #gamePick { width: 100%; max-width: 100% }
.upd { color: #c9dbe7; font-size: 12px; white-space: nowrap }
.thm { flex: 0 0 auto; min-width: 34px; font-size: 15px; line-height: 1 }
@media (max-width: 760px) { .upd { display: none } .brand { font-size: 16px } }
@media (max-width: 520px) { .brand .an { height: 18px } .brand span { display: none } #bookPick { max-width: 110px } }
/* scoreboard */
.board { background: var(--board); color: var(--board-ink); border: 1px solid var(--rule); border-radius: 10px; padding: 8px 16px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px }
.side { display: flex; align-items: center; gap: 12px; min-width: 0 }
.side.r { justify-content: flex-end; text-align: right }
.tn { font-weight: 800; font-size: 20px; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.tn i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 7px; vertical-align: 1px }
.side.r .tn i { margin: 0 0 0 7px }
.tmeta { color: var(--board-muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.sc { font-weight: 800; font-size: 38px; line-height: 1; min-width: 2.1ch; text-align: center }
.clk { text-align: center; line-height: 1.15 }
.clk b { display: block; font-weight: 700; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--board-muted) }
.clk strong { font-weight: 700; font-size: 22px }
.clk small { display: block; color: var(--board-muted); font-size: 11px }
@media (max-width: 760px) { .board { padding: 6px 10px; gap: 6px } .tn { font-size: 15px } .sc { font-size: 28px } .clk strong { font-size: 17px } .tmeta { display: none } }
/* tabs */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--rule-strong); overflow-x: auto; scrollbar-width: none; flex: 0 0 auto }
.tabs::-webkit-scrollbar { display: none }
.tabs button { flex: 0 0 auto; background: none; border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px; padding: 6px 12px; font-weight: 700; color: var(--muted); border-radius: 6px 6px 0 0 }
.tabs button[aria-selected="true"] { background: var(--sel); color: var(--sel-ink); border-bottom-color: var(--sel) }
/* views */
.views { flex: 1; min-height: 0; position: relative }
.view { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 8px; min-height: 0 }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 6px }
.scroll { flex: 1; min-height: 0; overflow: auto }
.lbl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted) }
.row { display: flex; align-items: center; gap: 8px; min-width: 0 }
.row.wrap { flex-wrap: wrap }
.spacer { flex: 1 }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--sel); border-radius: 6px; overflow: hidden; flex: 0 0 auto }
.seg button { border: 0; background: none; padding: 4px 10px; font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap }
.seg button[aria-pressed="true"] { background: var(--sel); color: var(--sel-ink) }
.note { color: var(--muted); font-size: 12px }
.empty { color: var(--muted); font-size: 13px; padding: 12px 0 }
.tag { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; vertical-align: 1px }
.tag.ok { background: var(--good-soft); color: var(--good) }
.tag.un { background: var(--panel2); color: var(--muted) }
.ev { font-weight: 700 }
.ev.pos { color: var(--good) } .ev.neg { color: var(--bad) }
a.px { display: inline-flex; flex-direction: column; align-items: center; min-width: 58px; padding: 2px 8px; border-radius: 6px; background: var(--bet); color: var(--bet-ink); text-decoration: none; font-weight: 700; line-height: 1.15 }
a.px small, span.px small { font-weight: 500; font-size: 10px; opacity: .85 }
span.px { display: inline-flex; flex-direction: column; align-items: center; min-width: 58px; padding: 2px 8px; font-weight: 700; line-height: 1.15 }
/* tables: name column frozen on horizontal scroll (every table) */
.tbl { overflow: auto; flex: 1; min-height: 0 }
table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px }
th, td { padding: 5px 8px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--rule) }
th { position: sticky; top: 0; z-index: 2; background: var(--surface); color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em }
th:first-child, td:first-child { position: sticky; left: 0; z-index: 1; background: var(--surface); text-align: left; box-shadow: 1px 0 0 var(--rule) }
th:first-child { z-index: 3 }
td.l, th.l { text-align: left }
td small { color: var(--muted) }
/* replay (2026-11-19): the rink fills the panel; every skater steered (glides, curves, line changes over the boards); the play-by-play
   pops up on the ice by the play, big moments as a banner; hits shake the rink; a goal lights the lamp and the siren */
:root, :root[data-theme="light"] { --ice: #fbfdff; --ice2: #e3edf5; --arena: #142c4c; --rinkline: #c8102e; --rinkblue: #1f4fbf; --boards: #0c1a2c }
:root[data-theme="dark"] { --ice: #eef4fa; --ice2: #cfdbe6; --arena: #0a1626; --boards: #04090f }
.rp { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 8px; height: 100% }
.rp-left { display: flex; flex-direction: column; gap: 6px; min-height: 0; padding: 6px }
.fieldbox { position: relative; flex: 1; min-height: 200px; border-radius: 8px; overflow: hidden; background: var(--arena); cursor: pointer }
#rink { position: absolute; inset: 0; width: 100%; height: 100%; display: block; will-change: transform }
#rink .arena { fill: var(--arena) }
#rink .ice { fill: url(#iceG) }
#rink .boards { fill: none; stroke: var(--boards); stroke-width: 1.4 }
#rink .gl { stroke: var(--rinkline); stroke-width: .25 }
#rink .rl { fill: var(--rinkline); opacity: .9 } #rink .bln { fill: var(--rinkblue); opacity: .85 }
#rink .cc { fill: none; stroke: var(--rinkblue); stroke-width: .3 } #rink .cdot { fill: var(--rinkblue) }
#rink .fo { fill: none; stroke: var(--rinkline); stroke-width: .3; opacity: .85 } #rink .dot { fill: var(--rinkline) }
#rink .hash { stroke: var(--rinkline); stroke-width: .3; opacity: .85 }
#rink .trap { stroke: var(--rinkline); stroke-width: .25; fill: none; opacity: .8 }
#rink .ref { fill: none; stroke: var(--rinkline); stroke-width: .25; opacity: .7 }
#rink .crease { fill: rgba(70, 140, 230, .45); stroke: var(--rinkline); stroke-width: .25 }
#rink .net { fill: rgba(255, 255, 255, .55); stroke: #b3121f; stroke-width: .45 }
#rink .bench { fill: color-mix(in srgb, var(--c) 30%, #0b1422); stroke: color-mix(in srgb, var(--c) 70%, #fff); stroke-width: .25 }
#rink .bl { fill: rgba(255, 255, 255, .7); font: 800 1.7px var(--text); text-anchor: middle; letter-spacing: .25px; dominant-baseline: hanging }
#rink .glight { fill: #4a1015; stroke: #000; stroke-width: .2 }
#rink .glight.on { fill: #ff2b2b; filter: drop-shadow(0 0 2px #ff2b2b); animation: lamp .32s steps(2) infinite }
@keyframes lamp { 50% { fill: #ffb3b3 } }
/* skaters: home in their dark color, away in white with the color on the trim */
#rink .sk .bd circle { stroke-width: .42 }
#rink .sk.home .bd circle { fill: var(--c); stroke: #fff }
#rink .sk.away .bd circle { fill: #fff; stroke: var(--c) }
#rink .sk .bd text { font: 800 2.2px var(--text); text-anchor: middle; dominant-baseline: central; pointer-events: none }
#rink .sk.home .bd text { fill: #fff } #rink .sk.away .bd text { fill: var(--c) }
#rink .sk .stick { stroke: #3a2a1a; stroke-width: .42; stroke-linecap: round }
#rink .sk.gk .bd circle { stroke-width: .8 } #rink .sk.gk .stick { stroke-width: .7 }
#rink .sk .trail { fill: none; stroke: rgba(120, 160, 200, .55); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round }
#rink .sk .nm { font: 800 2.15px var(--text); text-anchor: middle; fill: #0b1422; stroke: rgba(255, 255, 255, .92); stroke-width: .55; paint-order: stroke; pointer-events: none }
#rink .sk.off .nm, #rink .sk.off .stick, #rink .sk.off .trail { display: none }
#rink .sk.down .bd { animation: down 1.2s ease-out }
@keyframes down { 0% { transform: scale(1) } 12% { transform: scale(1.35, .45) rotate(70deg) } 70% { transform: scale(1.1, .55) rotate(110deg) } 100% { transform: scale(1) rotate(0) } }
#rink #puck { fill: #050505; stroke: #fff; stroke-width: .18 }

.pow.on { animation: pow 1s cubic-bezier(.2, 1.6, .4, 1) forwards }

  .call { min-width: 0; max-width: calc(100% - 12px); padding: 4px 8px 4px 11px } .call .h { font-size: 12px; gap: 8px } .call .b { font-size: 12px } .call .s { font-size: 11px } .sit { font-size: 11px } }

/* cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; align-content: start }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column }

.card h3 small { color: var(--bar-sub); font-weight: 600 }
.card .bd { padding: 8px 12px; display: flex; flex-direction: column; gap: 8px }
.pick { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; padding-bottom: 8px; border-bottom: 1px solid var(--rule) }
.pick:last-child { border-bottom: 0; padding-bottom: 0 }
.pick .g { color: var(--muted); font-size: 12px; grid-column: 1 }
.cdown { display: flex; gap: 10px; align-items: baseline; padding: 10px 12px; background: var(--board); color: var(--board-ink); border-radius: 10px }
.cdown .t { font-weight: 800; font-size: 20px } .cdown .w { color: var(--board-muted); font-size: 12px }
.kpis { display: flex; gap: 8px; flex-wrap: wrap }

.kpi b { display: block; font-size: 22px } .kpi span { color: var(--muted); font-size: 12px }
.stk { color: var(--muted); font-weight: 600; font-size: 11px }
/* bet tabs (2026-11-18, Chris: "why cant you borrow that?"): the NBA page's lanes, parlay cards and Results charts, in its Terminal colors.
   A lane = one bet that clears the rules now: the painted line = the chance the price needs, the ball = our chance. */
:root { --disp: "Big Shoulders Display", "Archivo", sans-serif;
  --maple: var(--surface); --maple2: var(--surface); --grain: transparent; --walnut: var(--ink); --walnut2: var(--muted); --paintline: var(--accent); --barfill: var(--accent);
  --bet2: var(--bet); --betdk: color-mix(in srgb, var(--bet) 78%, #000) }
.lanes { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 12px; align-items: start }
.lanes-top { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 0 0 auto }
.lanes-top .bt-note { font-size: 12px; color: var(--muted); line-height: 1.35 } .lanes-top .bt-note b { color: var(--ink) }
.lanes-top .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.lcol { min-height: 0; max-height: 100%; display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; background: var(--maple); color: var(--walnut); border: 1px solid var(--rule) }
.lcol > h3 { margin: 0; padding: 12px 16px 10px; font: 800 24px/1 var(--disp); letter-spacing: .01em; display: flex; align-items: baseline; gap: 10px;
  background: var(--bar); color: var(--bar-ink) }
.lcol > h3 small { font: 600 12.5px/1.2 var(--text); color: var(--bar-sub) }
.lcol ol { list-style: none; margin: 0; padding: 0; overflow-y: auto; overscroll-behavior: contain; flex: 1 }
.lane { display: grid; grid-template-columns: minmax(0, 1fr) 92px; gap: 14px; align-items: center; padding: 11px 14px 12px 16px; border-bottom: 1px solid var(--rule) }
.ln-bet { font: 700 21px/1.05 var(--disp); color: var(--walnut); display: flex; align-items: center; gap: 9px; min-width: 0 }
.ln-bet span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.ln-bet i { font-style: normal; font-weight: 600; color: var(--walnut2) }
.ln-bet .stk { flex: none; margin-left: 8px; padding: 3px 6px; border: 1.5px solid var(--accent); border-radius: 4px; color: var(--accent); font: 800 12px/1 var(--text); white-space: nowrap; align-self: center }
.tchip { flex: 0 0 auto; display: inline-grid; place-items: center; width: 34px; height: 24px; border-radius: 5px; color: #fff; font: 800 11px/1 var(--text); letter-spacing: .02em; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .25) }
.ln-ctx { font: 600 12px/1.3 var(--text); color: var(--walnut2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.track { position: relative; height: 16px; margin: 12px 0 5px; border-radius: 8px; background: var(--panel2); box-shadow: inset 0 1px 0 var(--rule) }
.track .gap { position: absolute; top: 2px; bottom: 2px; border-radius: 5px; opacity: .85 }
.track .be { position: absolute; top: -6px; bottom: -6px; width: 4px; margin-left: -2px; background: var(--paintline); box-shadow: 0 0 0 1px rgba(0, 0, 0, .25) }
.lrung.neg { opacity: .55 } .lrung.neg .lr-p strong { font-weight: 600 }
/* the ball: a puck, seen edge-on */
.track .ball { position: absolute; top: 50%; width: 30px; height: 15px; margin: -7.5px 0 0 -15px; border-radius: 50% / 50%;
  background: linear-gradient(180deg, #3a3a3a 0 30%, #0c0c0c 32% 100%); box-shadow: 0 2px 3px rgba(0, 0, 0, .5), inset 0 0 0 1px rgba(255, 255, 255, .18) }
.track .ball::after { content: ""; position: absolute; left: 3px; right: 3px; top: 2px; height: 3px; border-radius: 50%; background: rgba(255, 255, 255, .22) }
.cap { position: relative; height: 15px; font: 600 11.5px/15px var(--text); color: var(--walnut2) }
.cap span { position: absolute; white-space: nowrap } .cap b { color: var(--walnut); font-weight: 800 }
.tkt { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 2px; min-height: 76px; padding: 8px 0 0; overflow: hidden; border-radius: 8px; text-decoration: none; cursor: pointer;
  background: linear-gradient(180deg, var(--bet), var(--bet2)); color: var(--bet-ink); box-shadow: 0 3px 0 var(--betdk), 0 6px 12px rgba(0, 0, 0, .22) }

a.tkt:hover { filter: brightness(1.08) } a.tkt:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--betdk) } a.tkt:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.tkt.off { background: var(--panel2); color: var(--walnut); box-shadow: none; cursor: default; padding: 0; justify-content: center } .tkt.off b, .tkt.off small { color: var(--walnut) }
.tkt.pass { background: var(--panel2); box-shadow: none; cursor: default; padding: 0; justify-content: center; border-bottom: 4px solid var(--bad) } .tkt.pass b { color: var(--bad); font-size: 22px } .tkt.pass small { color: var(--walnut2) }
.lnote { padding: 12px 16px; font: 600 13.5px/1.4 var(--text); color: var(--walnut) }
.lnote.slot-h { font: 800 19px/1 var(--disp); padding: 14px 16px 4px }
.lnote.wait { color: var(--walnut2, var(--walnut)); font-size: 12.5px; border-top: 1px dashed rgba(44, 28, 12, .25); padding-top: 9px }   /* the NBA page's held-bets line */
.ln-move { font: 700 12px/1.3 var(--text); color: var(--walnut2); margin-top: 3px; white-space: normal } .ln-move b { color: var(--walnut) }
.ln-move.bad { color: var(--bad) } .ln-move.bad b { color: var(--bad) }
.ln-move.mv::before, .ln-move.bad::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: #c98a1a } .ln-move.bad::before { background: var(--bad) }
.lane.past .track, .lane.past .cap { opacity: .45; filter: grayscale(1) }
.lane.past .ln-bet span { text-decoration: line-through; text-decoration-thickness: 2px; text-decoration-color: var(--bad) }
.lanes-seg { display: none }
.lanes.single { grid-template-columns: minmax(0, 1fr) }
.lane.ladder { grid-template-columns: minmax(0, 1fr) }
.lrungs { display: flex; gap: 6px; margin-top: 8px; align-items: flex-start; overflow-x: auto; padding-bottom: 3px }
.lrung { flex: 0 0 auto; width: 92px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px 5px; border-radius: 6px; text-decoration: none; text-align: center;
  background: var(--panel2); color: var(--ink); border-bottom: 4px solid var(--sel); box-shadow: 0 2px 0 rgba(0, 0, 0, .2) }
.lrung .lr-k { font: 800 15px/1 var(--disp); color: var(--muted) } .lrung .lr-o { font: 800 23px/1 var(--disp); color: var(--ink) }
.lrung .lr-p { font: 600 10.5px/1.2 var(--text); color: var(--ink) } .lrung .lr-p strong { font-weight: 800 } .lrung .lr-n { font: 600 10px/1.2 var(--text); color: var(--muted) }
.lrung .lr-u { font: 800 10px/1.1 var(--text); color: var(--accent) }
.lrung .lr-b { font: 600 10px/1.1 var(--text); color: var(--muted); max-width: 86px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
a.lrung { border-bottom-width: 0 } a.lrung .lr-go { align-self: stretch; margin: 3px -4px -5px; padding: 5px 0; background: var(--bet); color: var(--bet-ink); font: 900 11px/1 var(--text); letter-spacing: .06em; text-transform: uppercase }
a.lrung:hover { filter: brightness(1.08) } .lrung.off { opacity: .55 }
/* countdown to the next picks */
.cdown { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 10px 16px 6px; padding: 10px 14px; border-radius: 10px; background: var(--board); color: var(--board-ink); border-bottom: 4px solid var(--accent) }
.cdown .cd-l { font: 700 15px/1.2 var(--text); color: var(--board-muted) } .cdown .cd-t { font: 900 34px/1 var(--disp); letter-spacing: .02em; font-variant-numeric: tabular-nums; color: var(--board-ink) }
.cdown .cd-w { font: 600 13px/1.2 var(--text); color: var(--board-muted) }
/* parlay cards */
#bestBoard { flex: 1; min-height: 0; display: flex; flex-direction: column }
#parBoard { flex: 1; min-height: 0; display: flex; flex-direction: column }
.pcol { height: 100% } .pcol .pscroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain }
.pcol h3.h3b { margin: 0; padding: 12px 16px 10px; font: 800 24px/1 var(--disp); letter-spacing: .01em; display: flex; align-items: baseline; gap: 10px; background: var(--bar); color: var(--bar-ink) }
.pcol h3.h3b small { font: 600 12.5px/1.2 var(--text); color: var(--bar-sub) }
.pcard { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 14px 16px; color: var(--walnut); border-bottom: 1px solid var(--rule) }

.rtab td { text-align: left } .rtab td:last-child { text-align: right }

/* price buttons: the bet cards' (NBA) and the parlay cards' bigger one */
.bc-p { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 82px; max-width: 104px; padding: 6px 8px; border-radius: 8px;
  background: var(--accent); color: var(--accent-ink, #fff); text-decoration: none; line-height: 1.15; border: 1px solid var(--accent) }
.bc-p b { font-size: 16.5px; font-weight: 800 } .bc-p small { font-size: 10.5px; opacity: .85; max-width: 92px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.bc-p span { font-size: 9.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; opacity: .9; margin-top: 1px }
a.bc-p { background: linear-gradient(180deg, var(--bet), var(--bet2)); border: 0; color: var(--bet-ink); box-shadow: 0 3px 0 var(--betdk), 0 5px 10px rgba(0, 0, 0, .25); overflow: hidden; padding-bottom: 0 }
a.bc-p span { align-self: stretch; margin: 5px -8px 0; padding: 5px 0; background: var(--betdk); color: var(--bet-ink); opacity: 1; font-size: 11px; font-weight: 900; text-align: center }
a.bc-p:hover { filter: brightness(1.08) } a.bc-p:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--betdk) }
.bc-p.off { background: var(--surface); color: var(--ink); border-color: var(--rule-strong) }
.pcard > .bc-p { min-width: 128px; max-width: none; min-height: 84px; border-radius: 8px } .pcard > .bc-p b { font: 800 28px/1 var(--disp) } .pcard > .bc-p small { max-width: 150px }
.pcard > a.bc-p span { font-size: 13px; padding: 7px 0 }
/* the Replay tab's Bets panel (NBA) */
.bets { flex: 1; min-height: 0; gap: 8px; padding: 12px 12px 10px }
.bets-hd { display: flex; align-items: center; gap: 10px; flex-wrap: wrap }
.bets-t { font-size: 19px; font-weight: 800; letter-spacing: .02em; margin-right: auto }
.bets-sub { font-size: 12px; color: var(--muted); line-height: 1.35; flex: 0 0 auto } .bets-sub b { color: var(--ink) }
.bets-fill { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain }
.betlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px }
.betlist li.pe { font-size: 13px; color: var(--muted); padding: 10px 2px }
.bc { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--panel2); border: 1px solid var(--rule); border-radius: 9px; padding: 8px 8px 8px 11px }
.bc-m { min-width: 0 }
.bc-k { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: flex; gap: 6px; align-items: center; min-height: 16px }
.bc-b { font-size: 14.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px }
.bc-b .tsw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: 1px }
.bc-s { font-size: 12px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.bc-s .pos { color: var(--good) } .bc-s .neg { color: var(--bad) }
.bc-r { font-size: 12px; margin-top: 3px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.bc-r.won { color: var(--good); font-weight: 700 } .bc-r.live { color: var(--ink) } .bc-r.lost { color: var(--bad); font-weight: 700 }
.bc.none { grid-template-columns: minmax(0, 1fr); opacity: .62 } .bc.none .bc-b { font-size: 13px; font-weight: 600; color: var(--muted) }
.bc.fl-up { background: var(--good-soft); border-color: var(--good) } .bc.fl-dn { background: var(--bad-soft); border-color: var(--bad) }
.bc.cashed { background: var(--good-soft) !important; border-color: var(--good) !important }
.bc.dead { background: var(--bad-soft) !important; border-color: color-mix(in srgb, var(--bad) 60%, var(--rule)) !important }
.rgs { display: flex; gap: 5px; margin-top: 5px; flex-wrap: wrap }
.rg { font-size: 11.5px; border: 1px solid var(--rule-strong); border-radius: 6px; padding: 1px 6px; color: var(--ink); text-decoration: none; white-space: nowrap }
.rg.hit { border-color: var(--good); background: var(--good-soft) } .rg.miss { opacity: .5 }
@media (max-width: 900px) { .bets { padding: 9px 9px 8px } .bets-t { font-size: 16px } .bets-hd .seg button { font-size: 12px; padding: 4px 8px } .rp-right .bets-fill { flex: 0 0 auto; max-height: 46vh } }
/* Results: live charts */
#resBoard { padding: 2px }
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 10px }
.chart { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px }
.chart h4 { margin: 0 0 2px; font-size: 14px } .chart .cs { font-size: 12px; color: var(--muted); margin-bottom: 6px }
.chart svg { width: 100%; height: auto; display: block }
.chart svg text { font: 600 11px var(--text); fill: var(--muted) } .chart svg .v { fill: var(--ink); font-weight: 800 }
.chart .kpis { display: flex; gap: 14px; flex-wrap: wrap; margin: 4px 0 6px } .chart .kpis span { font-size: 12px; color: var(--muted) } .chart .kpis b { display: block; font-size: 18px; color: var(--ink) }
.bb-h { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 12px 2px 6px }
.rtab { width: 100%; border-collapse: collapse; font-size: 12.5px } .rtab td { padding: 4px 6px; border-top: 1px solid var(--rule); white-space: nowrap }
.rtab td.t { white-space: normal } .rtab .win { color: var(--good); font-weight: 800 } .rtab .loss { color: var(--bad); font-weight: 800 }
@media (max-width: 760px) {
  .lanes { grid-template-columns: minmax(0, 1fr) } .lanes[data-scope="game"] .lcol[data-scope="slate"], .lanes[data-scope="slate"] .lcol[data-scope="game"] { display: none }
  .lanes-seg { display: inline-flex; align-self: flex-start } .lane { grid-template-columns: minmax(0, 1fr) 90px; gap: 10px; padding: 10px 10px 11px 12px }
  .ln-bet { font-size: 19px; align-items: flex-start } .ln-bet span { white-space: normal } .tkt { min-height: 68px; padding-top: 6px } .tkt b { font-size: 22px } .tkt em { font-size: 11.5px; letter-spacing: .05em }
  #bestBoard .lcol > h3, #parBoard .lcol > h3 { white-space: nowrap } #bestBoard .lcol > h3 small, #parBoard .lcol > h3 small { display: none }
  .pcard { grid-template-columns: minmax(0, 1fr) } .pcard > .bc-p { order: 2; width: 100%; min-height: 64px }
  .rtab, .rtab tbody { display: block }
  .rtab tr { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; column-gap: 12px; row-gap: 3px; padding: 9px 2px; border-top: 1px solid var(--rule) }
  .rtab td { display: block; padding: 0; border: 0; white-space: nowrap; font-size: 13px }
  .rtab td:nth-child(1) { grid-column: 1; grid-row: 1; color: var(--muted) }
  .rtab td:nth-child(3) { grid-column: 2; grid-row: 1 } .rtab td:nth-child(4) { grid-column: 3; grid-row: 1 } .rtab td:nth-child(5) { grid-column: 4; grid-row: 1; text-align: right }
  .rtab td.t { grid-column: 1 / -1; grid-row: 2; white-space: normal; font-size: 14px; line-height: 1.35 }
}

/* ---------------------------------------------------------------- logos (the NBA page's sizes, Chris 2026-11-18) */
img.tsw { width: 18px !important; height: 18px !important; border-radius: 0 !important; object-fit: contain; vertical-align: -4px !important; margin-right: 6px; background: none !important; display: inline-block }
.tn img.tlogo { width: 26px; height: 26px; object-fit: contain; vertical-align: -6px; margin-right: 8px }
.side.r .tn img.tlogo { margin: 0 0 0 8px }
.ln-bet img { width: 30px; height: 30px; object-fit: contain; flex: 0 0 auto }
.legs li .lgw img { width: 30px; height: 30px; object-fit: contain; display: block }
@media (max-width: 760px) { .ln-bet img { width: 26px; height: 26px; margin-top: 1px } }

/* ---------------------------------------------------------------- book picker with logos (the NBA page's) */
#bookPick.bk-native { display: none !important }
.bkpick { position: relative; flex: 0 0 auto }
.bk-btn { height: 32px; min-width: 58px; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 6px; border: 1px solid var(--rule-strong); border-radius: 8px;
          background: var(--surface); color: var(--ink); font: 700 14px/1 var(--text); cursor: pointer; white-space: nowrap }
.bk-btn.on { border-color: var(--accent) } .bk-btn.txt { padding-left: 10px }
.bk-btn::after { content: "\25BE"; color: var(--muted); font-size: 12px; margin-left: 2px }
.bk-tile { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 6px; background: #fff; overflow: hidden; flex: none;
           box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .08) }
.bk-tile img { max-width: 22px; max-height: 22px; object-fit: contain; display: block }
.bk-tile.best { background: var(--accent); color: #fff; font: 900 10px/1 var(--text); letter-spacing: .04em }
.bk-tile.ini { color: #16233f; font: 900 9px/1 var(--text) }
.bk-list { position: absolute; right: 0; top: calc(100% + 6px); z-index: 70; min-width: 230px; max-height: 70vh; overflow-y: auto; margin: 0; padding: 6px; list-style: none;
           background: var(--surface); border: 1px solid var(--rule-strong); border-radius: 10px; box-shadow: 0 12px 30px rgba(0, 0, 0, .35) }
.bk-list .bk-tile { width: 30px; height: 30px } .bk-list .bk-tile img { max-width: 26px; max-height: 26px }
.bk-list li { display: flex; align-items: center; gap: 10px; padding: 7px 10px 7px 7px; border-radius: 8px; cursor: pointer; font: 700 14px/1.2 var(--text); color: var(--ink) }
.bk-list li:hover, .bk-list li:focus { background: var(--panel2); outline: none }
.bk-list li[aria-selected="true"] { background: var(--panel2); box-shadow: inset 3px 0 0 var(--accent) }
@media (max-width: 760px) { .bk-btn { height: 40px } .bk-btn .bk-tile { width: 30px; height: 30px } .bk-btn .bk-tile img { max-width: 26px; max-height: 26px } }
@media (max-width: 760px) and (pointer: coarse) {
  .bk-btn { height: 44px }
  .bk-list { width: min(calc(100vw - 32px), 340px); max-height: 70vh; border-radius: 12px }
  .bk-list li { min-height: 52px; font-size: 16px }
}

    ${ser[0].pts.length ? svgLine(ser, { aria: "Cumulative units, 2026 live" }) : `<div class="cs">No graded ${rv === "parlays" ? "parlays" : "bets"} yet.</div>`}
    ${Object.keys(rel).length ? `<div class="cs" style="margin-top:8px"><b>By release</b>: the picks made at each release</div><div class="kpis">${Object.keys(rel).sort().map(k => { const x = rel[k];
      return `<span><b>${x.won}-${x.lost} · ${sg(x.units)}${x.units.toFixed(1)}u · ${sg(x.units)}${(x.staked ? 100 * x.units / x.staked : 0).toFixed(1)}%</b>${hm12(+k.slice(0, 2), +k.slice(3, 5))} ET</span>`; }).join("")}</div>` : ""}</div>`;
  h += `</div>`;
  const rec = sel.slice().reverse().slice(0, 20);
  if (rec.length) h += `<div class="bb-h">Latest graded</div><div class="chart"><table class="rtab">${rec.map(r =>
    `<tr><td>${esc(String(r.slot).slice(5, 10))} ${esc(SLOT_DAY(String(r.slot)))}</td><td class="t">${esc(r.text)}<br><span style="color:var(--muted)">${esc(r.game || "")}</span></td><td>${odds(+r.price)} <small>${esc(r.book || "")}</small></td>
     <td class="${r.grade}">${esc(r.grade)}</td><td>${(+r.units) >= 0 ? "+" : ""}${(+r.units).toFixed(2)}${r.kind === "parlay" && r.grade === "win" ? " est." : ""}<br><span style="color:var(--muted)">bet ${uTxt(+(r.stake || 1))}</span></td></tr>`).join("")}</table></div>`;
  h += btBlock();
  el.innerHTML = h;
}

// ---------------------------------------------------------------- book picker with logos (the NBA page's, Chris 2026-11-11): logo only when
// closed, logo + name in the list. The hidden native select still holds the choice (its change event runs everything as before).
(() => {
  const sel = $("bookPick"); if (!sel) return;
  const BL = {}, wrap = document.createElement("div"), btn = document.createElement("button"), list = document.createElement("ul");
  wrap.className = "bkpick"; btn.type = "button"; btn.className = "bk-btn"; btn.setAttribute("aria-haspopup", "listbox"); btn.setAttribute("aria-expanded", "false");
  list.className = "bk-list"; list.setAttribute("role", "listbox"); list.setAttribute("aria-label", "Book"); list.hidden = true;
  sel.classList.add("bk-native"); sel.after(wrap); wrap.append(btn, list);
  const ini = v => esc((v.match(/[A-Z0-9]/g) || [v.slice(0, 2)]).join("").slice(0, 4).toUpperCase());
  const tile = v => v ? (BL[v] ? `<span class="bk-tile"><img src="nba_logos/books/${encodeURIComponent(BL[v])}" alt=""></span>` : "") : `<span class="bk-tile best">BEST</span>`;
  const paint = () => {
    const v = sel.value, o = sel.selectedOptions[0], name = v || "Best price";
    btn.classList.toggle("on", !!v); btn.classList.toggle("txt", !(v && BL[v]));
    btn.innerHTML = v && BL[v] ? tile(v) : esc(v || (mobile() ? "Best" : "Best price"));
    btn.title = `Book: ${o ? o.textContent : name}`; btn.setAttribute("aria-label", btn.title);
    const opts = [...sel.options].sort((a, b) => (a.value ? 1 : 0) - (b.value ? 1 : 0));   // Best price first
    list.innerHTML = opts.map(x => `<li role="option" tabindex="-1" data-v="${esc(x.value)}" aria-selected="${x.value === v}">${tile(x.value) || `<span class="bk-tile ini">${ini(x.value)}</span>`}<span>${esc(x.value ? x.value : x.textContent)}</span></li>`).join("");
  };
  const close = () => { list.hidden = true; btn.setAttribute("aria-expanded", "false"); };
  btn.addEventListener("click", e => { e.stopPropagation(); const open = list.hidden; list.hidden = !open; btn.setAttribute("aria-expanded", String(open));
    if (open) (list.querySelector('[aria-selected="true"]') || list.firstElementChild)?.focus(); });
  list.addEventListener("click", e => { const li = e.target.closest("li[data-v]"); if (!li) return; close();
    if (sel.value !== li.dataset.v) { sel.value = li.dataset.v; sel.dispatchEvent(new Event("change", { bubbles: true })); } paint(); btn.focus(); });
  list.addEventListener("keydown", e => { const li = document.activeElement?.closest?.("li[data-v]");
    if (e.key === "Escape") { close(); btn.focus(); } else if (e.key === "ArrowDown") { e.preventDefault(); (li?.nextElementSibling || list.firstElementChild)?.focus(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); (li?.previousElementSibling || list.lastElementChild)?.focus(); } else if ((e.key === "Enter" || e.key === " ") && li) { e.preventDefault(); li.click(); } });
  document.addEventListener("click", e => { if (!wrap.contains(e.target)) close(); });
  sel.addEventListener("change", paint);
  new MutationObserver(paint).observe(sel, { childList: true, subtree: true });
  paint();
  fetch("nba_logos/books/index.json", { cache: "no-store" }).then(r => r.ok ? r.json() : {}).then(j => { Object.assign(BL, j || {}); paint(); }).catch(() => {});
})();
const VIEWS = { replay: () => { renderReplay(false); renderLiveBets(); }, best: renderBest, parlay: renderParlay, bet: renderBet, props: renderProps, td: renderTD, ladders: renderLadders, results: renderResults };
function showView(v) {
  S.view = v; document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.view === v));
  document.querySelectorAll(".view").forEach(s => s.hidden = s.dataset.v !== v); VIEWS[v]();
}
$("tabs").addEventListener("click", e => { const b = e.target.closest("button[data-view]"); if (b) { if (S.view === "replay") { stop(); stopLoop(); } showView(b.dataset.view); } });
function pick(gid) {
  stop(); R.ready = false; S.gid = gid; if (!G(gid)) return;
  paintTeams();
  renderReplay(true); if (S.view !== "replay") VIEWS[S.view]();
}
$("gamePick").addEventListener("change", e => pick(e.target.value));
$("bookPick").addEventListener("change", e => { S.book = e.target.value || null; try { S.book ? localStorage.setItem("plNhlBook", S.book) : localStorage.removeItem("plNhlBook"); } catch (x) {} VIEWS[S.view](); });
(function () { const b = $("themeBtn"), root = document.documentElement;
  function paint() { const d = root.getAttribute("data-theme") === "dark"; b.textContent = d ? "☀" : "☾"; b.setAttribute("aria-label", d ? "Light theme" : "Dark theme"); }
  b.addEventListener("click", () => { const t = root.getAttribute("data-theme") === "dark" ? "light" : "dark"; root.setAttribute("data-theme", t); try { localStorage.setItem("plTheme", t); } catch (e) {} paint(); }); paint(); })();
async function boot() {
  try { await load(true); } catch (e) { $("views").innerHTML = `<div class="empty" style="padding:16px">No sims published yet.</div>`; return; }
  $("upd").textContent = `Updated ${stamp(S.prices.created_utc)}`; S.gid = games()[0]?.schedule_id; fillPicker(); fillBooks(); pick(S.gid);
}
let lastRefresh = Date.now();
async function refresh() { lastRefresh = Date.now(); try { if (await load(false)) { $("upd").textContent = `Updated ${stamp(S.prices.created_utc)}`; fillBooks(); if (S.view !== "replay") VIEWS[S.view](); else renderLiveBets(); } } catch (e) {} }
setInterval(refresh, 5 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - lastRefresh > 60000) refresh(); });
boot();
</script>
