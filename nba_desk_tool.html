<meta charset="utf-8">
<title>NBA Matchups</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: slate strip -> scoreboard header with the game's key edges -> one focused view at a time
   (Overview / Players / Rotations / Defense). Left aligned, summary before detail, rows expand for depth. */
:root{
  /* NFL desk palette: field / panel / ink navy / orange accent / turf green / clay red */
  --ground:#eef1f4; --surface:#ffffff; --ink:#16233f; --muted:#57647a; --rule:#d7dee6; --rule-strong:#b7c1cf; --panel2:#e7edf3; --faint:#8896a8;
  --accent:#e8632e; --accent-soft:#fcebe3;
  --good:#2f8f57; --good-soft:#dcf0e4; --bad:#c0392b; --bad-soft:#f8e1de; --caution:#9a5b00; --caution-soft:#fdf0db;
  --board:#16233f; --board-ink:#ffffff; --board-muted:#a9b6cc; --board-rule:#2b3b5e;
  --h0:#eef1f4; --h1:#fbe3d6; --h2:#f6bf9f; --h3:#ee925f; --h4:#e8632e; --h5:#a8400f;
  --cond:"Archivo",system-ui,sans-serif; --text:"Archivo",system-ui,sans-serif;
}


*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:400 15px/1.45 var(--text);font-variant-numeric:tabular-nums;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 56px}
.wrap{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* top line */
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 16px}
.top h1{font:800 1.9rem/1 var(--cond);letter-spacing:.01em;margin:0}
.top p{margin:0;color:var(--muted);font-size:.9rem}
.date{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.9rem}
select{background:var(--surface);border:1px solid var(--rule-strong);border-radius:6px;padding:5px 8px}

/* slate strip */
.slate{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip-game{flex:0 0 auto;background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:8px 12px;cursor:pointer;
  display:grid;grid-template-columns:auto auto;gap:2px 12px;text-align:left;min-width:132px}
.chip-game b{font:700 1.05rem/1.1 var(--cond);letter-spacing:.02em}
.chip-game span{color:var(--muted);font-size:.78rem;text-align:right}
.chip-game[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}

/* scoreboard */
.board{background:var(--board);color:var(--board-ink);border-radius:12px;padding:18px 22px;display:flex;flex-direction:column;gap:16px}
.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.team{display:flex;flex-direction:column;gap:2px}
.team.home{align-items:flex-end;text-align:right}
.team .ab{font:800 clamp(2.4rem,7vw,3.6rem)/.9 var(--cond);letter-spacing:.02em}
.team .meta{color:var(--board-muted);font-size:.86rem}
.mid{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--board-muted);font-size:.8rem;text-align:center}
.mid strong{font:700 1.6rem/1 var(--cond);color:var(--board-ink)}
.qi{border-top:1px solid var(--board-rule);padding-top:10px}
.qi > summary{cursor:pointer;list-style:none;font:700 .95rem var(--cond);letter-spacing:.03em;color:var(--board-ink);display:flex;align-items:center;gap:8px}
.qi > summary::-webkit-details-marker{display:none}
.qi > summary::before{content:"▾";color:var(--board-muted)} .qi:not([open]) > summary::before{content:"▸"}
.qi > summary span{font:500 .72rem var(--text);color:var(--board-muted);border:1px solid var(--board-rule);border-radius:999px;padding:0 7px}
.edges{padding-top:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:8px 22px}
.edge{display:grid;grid-template-columns:3px 1fr;gap:9px;font-size:.84rem;line-height:1.35}
.edge i{border-radius:2px;background:var(--board-muted)}
.edge.good i{background:var(--good)} .edge.bad i{background:var(--bad)} .edge.info i{background:var(--accent)}
.edge b{font-weight:600}
.edge small{display:block;color:var(--board-muted);font-size:.74rem;margin-top:1px}

/* view tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule-strong);overflow-x:auto;scrollbar-width:none}
.tabs button{flex:0 0 auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;padding:8px 14px;cursor:pointer;
  font:600 1.08rem var(--cond);letter-spacing:.02em;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.view{display:flex;flex-direction:column;gap:22px}
.row-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--rule-strong);border-radius:7px;overflow:hidden}
.seg button{background:none;border:0;padding:5px 12px;cursor:pointer;font-size:.88rem}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.hint{color:var(--muted);font-size:.86rem;margin:0;max-width:78ch}
.hint b{color:var(--ink);font-weight:600}
h2{font:700 1.3rem/1.15 var(--cond);letter-spacing:.01em;margin:0}
h3{font:700 1.05rem/1.2 var(--cond);letter-spacing:.02em;margin:0}

/* overview: tale of the tape */
.split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px}
@media (max-width:860px){.split{grid-template-columns:1fr}}
.tape{display:flex;flex-direction:column}
.tape-h,.tape-r{display:grid;grid-template-columns:1fr 130px 1fr;align-items:center;gap:10px}
.tape-h{font:700 1rem var(--cond);padding-bottom:6px;border-bottom:1px solid var(--rule-strong)}
.tape-h span:last-child{text-align:right}
.tape-r{padding:10px 0;border-bottom:1px solid var(--rule)}
.tape-r .lab .badge{margin-top:3px}
.tape-r .lab{text-align:center;color:var(--muted);font-size:.84rem;line-height:1.2}
.side{display:flex;align-items:center;gap:8px}
.side.l{flex-direction:row-reverse}
.track{flex:1;height:8px;background:var(--h0);border-radius:4px;display:flex;overflow:hidden}
.side.l .track{justify-content:flex-end}
.fill{height:100%;background:var(--rule-strong);border-radius:4px}
.fill.top{background:var(--accent)}
.num{font:600 .98rem/1.35 var(--cond);min-width:6.4em}
.side.r .num{text-align:right}
.rank{color:var(--muted);font:500 .78rem var(--text)}
.mu{display:flex;flex-direction:column;gap:16px}
.mu-block{display:flex;flex-direction:column}
.mu-r{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--rule);font-size:.9rem}
.mu-r .r{font:600 .95rem var(--cond);min-width:3.6em;text-align:right}
.mu-r .tag{font-size:.74rem;padding:1px 7px;border-radius:999px;justify-self:end}
.tag.good{background:var(--good-soft);color:var(--good)} .tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.plain{color:var(--muted)}


/* overview v2: dense cards */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card{overflow-x:auto}
@media (max-width:560px){.barc{display:none}.tape2 .c{white-space:normal}.tl2{display:none}.kp td.l small{display:none}}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.card-h .hint{font-size:.76rem}
.hint.sm{font-size:.76rem}
.ov-top{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px}
.ov-mid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:12px;align-items:stretch}
.ov-kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:12px}
@media (max-width:980px){.ov-mid{grid-template-columns:1fr}}
.ov-team{border-top:3px solid var(--tcol)}
.ov-team h3 .hint{font:500 .76rem var(--text)}
.starters{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.starters li{display:flex;gap:8px;align-items:baseline;padding:4px 0;border-bottom:1px solid var(--rule);font-size:.86rem;min-width:0}
.starters li .pname{font-weight:600;white-space:nowrap}
.starters li .arch{flex:1;min-width:0;color:var(--muted);font-size:.74rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.starters li .smin{font:600 .86rem var(--cond);white-space:nowrap}
.mini-h{font:700 .78rem var(--cond);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.injl{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:.84rem}
.injl li span{color:var(--muted);font-size:.76rem;margin-left:6px}
.chg{margin:0;font-size:.8rem;display:flex;flex-direction:column;gap:2px}
.chg .up{color:var(--good)} .chg .down{color:var(--bad)}
.env-score{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;text-align:center}
.env-score div{display:flex;flex-direction:column}
.env-score span{font:700 .9rem var(--cond);color:var(--muted)}
.env-score b{font:800 2.1rem/1 var(--cond)}
.env-score .at{color:var(--muted);font:600 1rem var(--cond);padding-bottom:6px}
.env-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center;background:var(--ground);border-radius:8px;padding:6px}
.env-kpis span{display:block;font-size:.72rem;color:var(--muted)} .env-kpis b{font:700 1.1rem var(--cond)}
.ctbl{width:100%;border-collapse:collapse;font-size:.84rem}
.ctbl th{font:600 .74rem var(--text);color:var(--muted);text-align:right;padding:3px 6px;border-bottom:1px solid var(--rule-strong);white-space:nowrap}
.ctbl td{padding:4px 6px;border-bottom:1px solid var(--rule);text-align:right;vertical-align:middle}
.ctbl tr:last-child td{border-bottom:0}
.ctbl .l{text-align:left} .ctbl .c{text-align:center;color:var(--muted);font-size:.78rem;white-space:nowrap} .ctbl .r{text-align:right}
.ctbl small{display:block;color:var(--muted);font-size:.7rem;line-height:1.1}
.env-t td small{display:inline;margin-left:5px}
.tape2 td{padding:5px 6px}
.tape2 td.l b,.tape2 td.r b{font:600 .95rem var(--cond)}
.tape2 small.alt{display:inline;margin-left:5px}
.barc{width:24%}
.tb{display:flex;height:7px;background:var(--h0);border-radius:4px;overflow:hidden;width:100%}
.barc.l .tb{justify-content:flex-end}
.tb i{display:block;height:100%;border-radius:4px}
.tb.sm{height:5px}
.tilt2 td{text-align:left;padding:6px}
.tilt2 td.lab{font-size:.82rem;white-space:nowrap}
.tilt2 th{text-align:left}
.tl{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.tl .vsline{font:600 .9rem var(--cond)}
.tl .tag{font-size:.7rem;padding:0 6px;border-radius:999px}
.tl2{display:grid;gap:2px;margin-top:3px}
.kp td .pname{font-weight:600}
.hist{color:var(--muted);font-style:italic}
.kp-ctl{margin-bottom:-10px}
.ov-col{display:flex;flex-direction:column;gap:12px;min-width:0}
.ss-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px 16px}
.ss{display:flex;flex-direction:column;gap:2px}
.ss .sl{font-size:.7rem;color:var(--muted);margin-top:4px}
.ss ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px}
.ss li{display:grid;grid-template-columns:1fr auto;gap:5px;align-items:baseline;font-size:.78rem;padding:2px 4px;border-radius:4px}
.ss li small{color:var(--muted);font-size:.68rem}

.ss li.hit{background:var(--accent-soft)} .ss li.hit span::before{content:"● ";color:var(--accent)}
.kp td.l small{display:inline;margin-left:6px}
.kp td.dv small{display:inline;margin-left:4px}
.kp td.dv.good{color:var(--good);font-weight:600} .kp td.dv.bad{color:var(--bad);font-weight:600}

.ov-top{grid-template-columns:minmax(0,.62fr) minmax(0,1.19fr) minmax(0,1.19fr)!important}
.kp th,.kp td{padding:4px 4px;font-size:.8rem}
.kp td.l .pname{font-size:.84rem}
@media (max-width:1180px){.ov-top{grid-template-columns:1fr 1fr!important}.ov-top .ov-env{grid-column:1/-1}}
@media (max-width:760px){.ov-top{grid-template-columns:1fr!important}}
.kp tr.st td:first-child{box-shadow:inset 3px 0 0 var(--tcol)}
.kp td:first-child{padding-left:9px}
.stmark{display:inline-block;width:3px;height:11px;background:var(--tcol);vertical-align:-1px;border-radius:1px}
.kp td.l small{display:block!important;margin:0!important}
.rot-foot{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:6px 16px}
.duels{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:14px 24px}
.duel{display:flex;flex-direction:column;gap:6px;min-width:0}
.duel-c{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.duel-c figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.duel-c figcaption{font:600 .78rem var(--cond);color:var(--muted);letter-spacing:.03em}
.hexc{width:100%;max-width:300px;height:auto;background:var(--ground);border-radius:8px}
.hexc .court *{fill:none;stroke:var(--muted);stroke-width:.2;opacity:.7}
.hexc polygon{stroke:var(--surface);stroke-width:.12}
:root{--rk-y:#fbf1c7;--rk-y-ink:#6b5300;--rk-o:#fbd3a8;--rk-o-ink:#8a3c00}


:root{--hot2:#c8361f;--hot1:#ee9a6e;--neu:#c7cdd6;--cold1:#8fb2e8;--cold2:#2f62c4}


i.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin:0 2px 0 6px;vertical-align:-1px}
i.sw.hot2{background:var(--hot2)} i.sw.hot1{background:var(--hot1)} i.sw.neu{background:var(--neu)} i.sw.cold1{background:var(--cold1)} i.sw.cold2{background:var(--cold2)}
.zt td small,.flow td small{display:inline!important;margin-left:4px}
.ov-flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:12px;align-items:stretch}
.flow th.gap,.flow td.gap{width:10px;border:0;padding:0}
.flow td.good{color:var(--good);font-weight:600} .flow td.bad{color:var(--bad);font-weight:600}
.flow td.l{white-space:pre;font-size:.8rem}
.luck{display:grid;grid-template-columns:minmax(110px,1.1fr) auto minmax(60px,1fr) 3.4em;grid-template-rows:auto auto;column-gap:10px;align-items:center;padding:5px 0;border-bottom:1px solid var(--rule);font-size:.84rem}
.luck .lv small{color:var(--muted);font-size:.72rem}
.luck .lbar{height:7px;background:var(--h0);border-radius:4px;position:relative;overflow:hidden}
.luck .lbar i{position:absolute;top:0;bottom:0;border-radius:4px}
.luck .lbar i.up{left:50%;background:var(--hot2)} .luck .lbar i.down{right:50%;background:var(--cold2)}
.luck .lbar::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--rule-strong)}
.luck b{font:700 .95rem var(--cond);text-align:right} .luck b.hot{color:var(--hot2)} .luck b.cold{color:var(--cold2)}
.luck .lr{grid-column:1/-1;color:var(--muted);font-size:.72rem}

.wf{display:flex;flex-direction:column;gap:3px;margin:6px 0 14px;max-width:900px}
.wf h3{margin-bottom:4px}
.wf-r{display:grid;grid-template-columns:minmax(120px,190px) minmax(150px,200px) 1fr;gap:10px;align-items:center;font-size:.84rem}
.wf-r.tot .wf-n{font-weight:600}
.wf-v{font-variant-numeric:tabular-nums} .wf-v em{font-style:normal;font-weight:600;margin-left:4px} .wf-v em.up{color:var(--good)} .wf-v em.down{color:var(--bad)}
.wf-t{position:relative;height:14px;background:var(--h0);border-radius:3px}
.wf-t i{position:absolute;top:0;bottom:0;border-radius:3px}
.wf-t i.free{background:var(--ink)} .wf-t i.up{background:var(--good)} .wf-t i.down{background:var(--bad)} .wf-t i.rest{background:var(--rule-strong)}
@media (max-width:560px){.wf-r{grid-template-columns:1fr auto}.wf-t{grid-column:1/-1}}

.rot-more{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px;align-items:start;margin-top:12px}
.closers{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:.84rem}
.closers li{display:grid;grid-template-columns:4.6em 1fr;gap:8px;align-items:baseline;padding:4px 0;border-bottom:1px solid var(--rule)}
.closers li b{font:700 1rem var(--cond)} .closers li span{color:var(--ink)}

.rkc{display:inline-flex;align-items:baseline;gap:5px;white-space:nowrap}
.rk{display:inline-block;min-width:2.9em;text-align:center;font:700 .92rem/1.25 var(--cond);letter-spacing:.01em;padding:1px 5px;border-radius:5px;background:var(--ground);color:var(--ink)}
.rk.g2{background:var(--good);color:var(--surface)} .rk.g1{background:var(--good-soft);color:var(--good)}
.rk.b2{background:var(--bad);color:var(--surface)} .rk.b1{background:var(--bad-soft);color:var(--bad)}
.rk.y{background:var(--rk-y);color:var(--rk-y-ink)} .rk.o{background:var(--rk-o);color:var(--rk-o-ink)}
.rk.v-hi{background:var(--h4);color:var(--surface)} .rk.hi{background:var(--h1);color:var(--ink)}
.rk.v-lo{background:#7b8696;color:#fff} .rk.lo{background:var(--rule);color:var(--ink)}
.rkc .rv{color:var(--muted);font:500 .74rem var(--text)}
.tape2 td.r .rkc{flex-direction:row-reverse}
.tape2 small.alt{display:inline!important;margin:0 0 0 6px!important}
.tape2 td{padding:3px 6px!important}
.env-kpis.sm b{font-size:.95rem}
.ss li .rkc{justify-self:end}
.env-t .rkc{flex-direction:column;align-items:flex-end;gap:0}
.env-t td{padding:3px 4px}
.ctbl td .rkc{justify-content:flex-end}

.toolbar{padding:8px 12px}
.toolbar .row-ctl{gap:8px 12px}
.tb-sp{flex:1}
.gwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:12px;align-items:start;margin-top:8px}
@media (max-width:1000px){.gwrap{grid-template-columns:1fr}}
.gwrap .wf{margin:0}
.gwrap .wf-r{grid-template-columns:minmax(100px,150px) minmax(140px,170px) 1fr}
.gwrap .oo-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
table.zebra tbody tr.p:nth-of-type(even) td{background:color-mix(in srgb,var(--ground) 45%,var(--surface))}

.kpis{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)} .kpis b{color:var(--ink);font:700 1rem var(--cond)} .kpis small{font-size:.72rem}
.oo-card-main{padding:12px 0 10px} .oo-card-main>.card-h,.oo-card-main>.hint{padding:0 14px}
.oo-wrap{border:0;border-radius:0;border-top:1px solid var(--rule)}
table.oo th.stk,table.oo td.stk{position:sticky;left:0;background:var(--surface);z-index:1;box-shadow:1px 0 0 var(--rule)}
table.oo th.band,table.oo td[data-band="1"]{background:color-mix(in srgb,var(--ground) 55%,var(--surface))}
table.oo thead th button.sort small{display:block;font-weight:500;color:var(--muted);font-size:.68rem}
table.oo tr.grp td{background:var(--ground);font:600 .74rem var(--text);color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:6px 10px}
table.oo tbody tr:hover td{background:var(--accent-soft)}
.seg-note{font-size:.8rem;color:var(--muted);padding:5px 10px;border:1px dashed var(--rule-strong);border-radius:7px}
.xbtn{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;border:1px solid var(--rule-strong);background:var(--surface);color:var(--muted);font:600 1rem/1 var(--text);cursor:pointer;padding:0}
.xbtn:hover{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.ir-card{position:relative}
.pill .x{margin-left:4px;font-weight:700}
.pill.clr{border-style:dashed;color:var(--muted)}
.outbar .lbl small{font-size:.72rem}
.oo-bottom{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:980px){.oo-bottom{grid-template-columns:1fr}}

/* ===== one-screen layout (NFL desk look) ===== */
html,body{height:100%;overflow:hidden;background:var(--ground)}
body{padding:0!important;font:14px/1.4 var(--text);font-feature-settings:"tnum" 1}
.wrap{max-width:none;height:100vh;height:100dvh;margin:0;padding:8px 14px 8px;gap:6px;display:flex;flex-direction:column}
/* top bar */
.top{display:flex;align-items:center;gap:14px;flex-wrap:nowrap;padding:0}
.navrow{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}.navrow .tabs{flex:1 1 auto}#datawin{margin-bottom:4px}
.brand{font-weight:800;font-size:17px;letter-spacing:.2px;white-space:nowrap}

.date{white-space:nowrap;font-size:.82rem;display:flex;gap:6px;align-items:center}

select{background:var(--panel2);border:1px solid var(--rule);border-radius:6px;padding:4px 8px}
/* scoreboard strip */
.board{flex:0 0 auto;padding:6px 16px;border-radius:8px;gap:0;flex-direction:row;align-items:center}
.board .teams{flex:1;gap:10px}
.team{flex-direction:row;align-items:baseline;gap:12px}
.team.home{flex-direction:row-reverse}
.team .ab{font:800 1.9rem/1 var(--cond);letter-spacing:0}
.team .meta{font-size:.76rem}
.mid{flex-direction:row;gap:10px;align-items:baseline;font-size:.72rem}
.mid strong{font:800 1.15rem/1 var(--cond)}
.board .qi,.board .feednote{display:none}
/* tabs + pages */
.nav2{display:flex;flex-direction:column;gap:4px;flex:0 0 auto}
.tabs{border-bottom:1px solid var(--rule);gap:4px;overflow:visible}
.tabs button{font:600 14px var(--text);letter-spacing:0;padding:6px 14px;border:0;border-radius:6px 6px 0 0;margin:0;color:var(--muted)}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--panel2);color:var(--accent);border:0}
.pgs{display:flex;align-items:center;gap:12px;min-height:30px;flex-wrap:nowrap}
.pgs:empty{display:none}
.pgs .use{color:var(--muted);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 auto}
.rosf{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);white-space:nowrap;flex:0 0 auto}
.pgs .ct{background:var(--accent);color:#fff;border-radius:9px;padding:0 6px;font-size:.68rem;margin-left:3px}
.seg{background:var(--surface);border:1px solid var(--rule);border-radius:6px;flex:0 0 auto}
.seg button{padding:4px 11px;color:var(--muted);font-weight:600;font-size:.82rem}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--accent)}
/* the viewport the page must fit in */
.vp{flex:1 1 auto;min-height:0;overflow:hidden;position:relative}
.vp.scrolly{overflow-y:auto}
.view{display:flex;flex-direction:column;gap:8px;height:auto}
/* card / table density */
.card{padding:9px 11px;gap:6px;border-radius:8px;border-color:var(--rule)}
.card-h h3{font:700 .95rem var(--cond);letter-spacing:0}
h2{font:700 1.1rem/1.15 var(--cond);letter-spacing:0}
h3{font:700 .95rem/1.2 var(--cond);letter-spacing:0}
.hint{font-size:.78rem}
.row-ctl{gap:6px 12px}
.toolbar{padding:6px 10px}
.rnote{padding:4px 10px;font-size:.78rem}
.ov-ctl .hint{display:none}
.ov-side{display:none} #view[data-t=overview][data-p=rot] .ov-side{display:inline-flex}
#view[data-t=overview]>.ov-rot{display:none} #view[data-t=overview][data-p=rot]>.ov-rot{display:block}
.ov-rot .ov-team{width:100%}
/* ----- pages: hide everything on a tab, then show the chosen page ----- */
#view[data-t=overview]>:not(.ov-ctl){display:none}
#view[data-t=overview][data-p=game]>.ov-top{display:grid;max-width:1000px;margin:0 auto;width:100%;grid-template-columns:minmax(0,1fr)!important}
#view[data-t=overview][data-p=matchup]>.ov-mid{display:grid}
#view[data-t=overview][data-p=luck]>.ov-flow,#view[data-t=overview][data-p=pace]>.ov-flow,#view[data-t=overview][data-p=fouls]>.ov-flow{display:grid}
#view[data-t=overview][data-p=luck] .ov-flow>.card:nth-child(n+2){display:none}
#view[data-t=overview][data-p=pace] .ov-flow>.card:not(:nth-child(2)){display:none}

  for(const [x,y,X,Y] of [[a,h,A,H],[h,a,H,A]]){
    let best=null;
    for(const p of X.players.filter(p=>p.mpg>=18&&p.gp>=15)){ const c=dvaFor(y,x).FG3A?.cells[`${p.arch}|${p.tier}`]; if(!c||c[2]<400) continue; if(!best||c[3]<best.c[3]) best={p,c}; }
    if(best&&best.c[3]<=8) add("dva","info",10-best.c[3],`${nm(best.p.id)} profiles well for 3PA`,`${y} allow the ${ord(best.c[3])}-most 3PA to ${PLURAL[best.p.arch]} (${best.p.tier.toLowerCase()} usage): ${sgn(best.c[0],2)} per 36`);
    const star=X.players.filter(p=>p.gp>=15).sort((p,q)=>q.dk-p.dk)[0];
    if(star){ const c=dvaFor(y,x).DK?.cells[`${star.arch}|${star.tier}`];
      if(c) add("star",c[0]>=0?"good":"bad",0.5+Math.abs(15.5-c[3])/4,`${last(star.id)}'s matchup: ${c[0]>=0?"favorable":"tough"}`,`${y} rank ${ord(c[3])} in DK allowed to ${PLURAL[star.arch]} (${star.tier.toLowerCase()} usage): ${sgn(c[0],1)} per 36`); }
  }
  // availability: only for players flagged for this game. Q / D -> "If X sits"; O -> "With X out".
  const S=statuses();
  for(const [x,X] of [[a,A],[h,H]]){
    for(const pid of X.onoff.map(o=>o.id).filter(id=>S[id])){
      const st_=S[pid], lead=st_==="O"?`With ${last(pid)} out`:`If ${last(pid)} sits (${STATUS[st_][0].toLowerCase()})`;
      const io=X.inout.find(o=>o.id===pid);
      if(io){ const b=io.mates.filter(m=>m.n_out>=3&&onRoster(x,m.id)).sort((p,q)=>(q.min_out-q.min_in)-(p.min_out-p.min_in))[0];
        if(b&&b.min_out-b.min_in>=2) add("minutes","info",20+(b.min_out-b.min_in)/2,`${lead}, ${nm(b.id)} gets the minutes`,`${b.min_in.toFixed(1)} → ${b.min_out.toFixed(1)} mpg and ${b.dk_in.toFixed(1)} → ${b.dk_out.toFixed(1)} DK in the ${b.n_out} games ${last(pid)} missed${b.n_out<5?" (small sample)":""}`); }
      const oo=X.onoff.find(o=>o.id===pid);
      if(oo){ const u=oo.mates.filter(m=>m.off.min>=150&&m.on.min>=150&&onRoster(x,m.id)).sort((p,q)=>(q.off.use-q.on.use)-(p.off.use-p.on.use))[0];
        if(u&&u.off.use-u.on.use>=0.02) add("usage","info",20+(u.off.use-u.on.use)*100/1.5,`${lead}, ${poss(nm(u.id))} usage climbs`,`${pct(u.on.use)} → ${pct(u.off.use)} usage and ${u.on.dk.toFixed(1)} → ${u.off.dk.toFixed(1)} DK per 36 over ${u.off.min.toFixed(0)} minutes without ${last(pid)}`); }
    }
  }
  // fallback so every game has six: each offense's widest offense-vs-defense rank gap
  for(const [x,y,X,Y] of [[a,h,pa,ph],[h,a,ph,pa]]){
    const rows=[["three_rate","opp_three_rate","3-point volume"],["rim_rate","opp_rim_rate","rim attempts"],["ft_rate","opp_ft_rate","free throws"]];
    const r=rows.map(([o,d,l])=>({l,ro:X[o+"_rank"],rd:Y[d+"_rank"]})).sort((p,q)=>(p.ro+p.rd)-(q.ro+q.rd))[0];
    add("tilt","info",0.2,`${x} ${r.l}: ${ord(r.ro)} vs. ${ord(r.rd)}`,`${x} rank ${ord(r.ro)} in ${r.l} rate; ${y} rank ${ord(r.rd)} in allowing it`);
  }
  if(LIVE) for(const [x,X] of [[a,A],[h,H]]){ const {nu,gone}=rosterChange(x);

  }
  // Game Flow backups: 3-point luck (shooting or opponents' shooting far from the shot mix) and transition edges
  const FL=t=>D.teams[t].flow?.season;
  if(FL(a)&&FL(h)){
    for(const [x,side,lab] of [[a,"off",`${a}'s 3-point shooting`],[h,"off",`${h}'s 3-point shooting`],[a,"def",`${a}'s opponents from 3`],[h,"def",`${h}'s opponents from 3`]]){
      const v=FL(x)[side].fg3_luck; if(v==null) continue;
      add("luck",side==="off"?(v>0?"bad":"good"):(v>0?"good":"bad"),0.5+Math.abs(v)*100/1.5,`${lab}: ${v>0?"running hot":"running cold"} (${sgn(v*100,1)} pts of 3P%)`,
        `${pct(FL(x)[side].fg3_pct)} vs. ${pct(FL(x)[side].fg3_exp)} expected from the shot mix · defenses barely control this, so it tends to even out`); }
    for(const [x,y] of [[a,h],[h,a]]){ const o=FL(x).off, d=FL(y).def;
      const ro=o.fb_g_rank, rd=d.fb_g_rank; if(ro==null||rd==null) continue;
      add("trans",ro<=10&&rd<=10?"good":ro>=21&&rd>=21?"bad":"info",0.3+Math.max(0,20-(ro+rd)/2)/4,`${x} fast breaks: ${ord(ro)} vs. ${ord(rd)}`,
        `${x} score ${o.fb_g.toFixed(1)} fast-break pts/g (${ord(ro)}); ${y} allow ${d.fb_g.toFixed(1)} (${ord(rd)}) · live-ball TO share ${pct(o.live_tov_share)}`); }
  }
  const per={}, out=[];
  for(const c of C.sort((x,y)=>y.score-x.score)){ if((per[c.kind]||0)>=2) continue; per[c.kind]=(per[c.kind]||0)+1; out.push([c.tone,c.title,c.sub]); if(out.length===8) break; }
  return out;
}

// one screen, no vertical page scroll: if the page is taller than the window, shrink it to fit (floor 60%)
function fit(){
  const vp=$("vp"), v=$("view"); v.style.zoom="";
  if(window.matchMedia("(max-width:700px)").matches){ vp.classList.remove("scrolly"); return; }
  const avail=vp.clientHeight; let z=1;
  for(let i=0;i<4;i++){
    const hgt=v.getBoundingClientRect().height;
    if(hgt<=avail+1) break;
    z=Math.max(.6,z*avail/hgt); v.style.zoom=z;
    if(z<=.6) break;
  }
  vp.classList.toggle("scrolly", v.getBoundingClientRect().height>avail+2);
}

// half-court hex chart: size = share of the team's shots, color = FG% vs league in that hex
const HEXSZ=2.0;
function court(){ return `<g class="court"><line x1="-25" y1="-5.25" x2="25" y2="-5.25"/><rect x="-8" y="-5.25" width="16" height="19"/><circle cx="0" cy="13.75" r="6"/>
  <circle cx="0" cy="0" r="0.75"/><line x1="-3" y1="-1.25" x2="3" y2="-1.25"/><path d="M -4 0 A 4 4 0 0 0 4 0"/>
  <line x1="-22" y1="-5.25" x2="-22" y2="8.95"/><line x1="22" y1="-5.25" x2="22" y2="8.95"/><path d="M -22 8.95 A 23.75 23.75 0 0 0 22 8.95"/></g>`; }
function hexChart(hex,total,title){
  const L={}; for(const [q,r,a,m] of D.flow_lg.hex) L[q+","+r]=[a,m];
  const lgT=D.flow_lg.hex.reduce((x,y)=>x+y[2],0);
  const pts=i=>{const an=Math.PI/180*(60*i-30); return [Math.cos(an),Math.sin(an)];};
  let body="";
  for(const [q,r,a,m] of hex){ if(a<8) continue;
    const cx=HEXSZ*Math.sqrt(3)*(q+r/2), cy=HEXSZ*1.5*r; if(cy>34||Math.abs(cx)>25) continue;
    const share=a/total, l=L[q+","+r], lshare=l?l[0]/lgT:share, fgd=l?m/a-l[1]/l[0]:0;
    const k=Math.max(0.38,Math.min(1,Math.sqrt(share/0.012)))*0.95, col=fgd>0.03?"var(--hot2)":fgd>0.01?"var(--hot1)":fgd<-0.03?"var(--cold2)":fgd<-0.01?"var(--cold1)":"var(--neu)";
    const poly=[0,1,2,3,4,5].map(i=>{const [x,y]=pts(i); return (cx+x*HEXSZ*k).toFixed(2)+","+(cy+y*HEXSZ*k).toFixed(2);}).join(" ");
    body+=`<polygon points="${poly}" style="fill:${col}" data-tip="${title}: ${a} shots (${(share*100).toFixed(1)}% of shots, league ${(lshare*100).toFixed(1)}%) · ${(m/a*100).toFixed(0)}% FG (league ${l?(l[1]/l[0]*100).toFixed(0):"–"}%)"/>`; }
  return `<svg class="hexc" viewBox="-25.5 -6 51 41" role="img" aria-label="${title} shot chart">${court()}${body}</svg>`;
}
const ZN=[["rim","At the rim"],["smid","Short mid"],["lmid","Long mid"],["cnr3","Corner 3"],["ab3","Above-break 3"]];
function shotDuel(o,d){
  const O=FLW(o,"season"), Dd=FLW(d,"season");
  const zr=ZN.map(([z,l])=>{ const of=O.off[z+"_freq"], df=Dd.def[z+"_freq"], ro=O.off[z+"_freq_rank"], rd=Dd.def[z+"_freq_rank"];

    return `<tr><td class="l">${l}</td><td>${RK(ro,0,fv(of,"pct"))}</td><td>${fv(O.off[z+"_fg"],"pct")}</td><td>${RK(rd,0,fv(df,"pct"))}</td><td>${fv(Dd.def[z+"_fg"],"pct")}</td><td>${tag}</td></tr>`;}).join("");
  return `<div class="duel"><div class="duel-h"><h3>${dot(o)}${o} shots vs. ${dot(d)}${d} defense</h3></div>
    <div class="duel-c"><figure>${hexChart(O.off.hex,O.off.fga_total,o+" offense")}<figcaption>${o} offense</figcaption></figure>
      <figure>${hexChart(Dd.def.hex,Dd.def.fga_total,d+" allowed")}<figcaption>${d} allowed</figcaption></figure></div>
    <table class="ctbl zt"><thead><tr><th class="l">Zone</th><th>${o} freq</th><th>${o} FG%</th><th>${d} allows</th><th>allowed FG%</th><th></th></tr></thead><tbody>${zr}</tbody></table></div>`;
}
function luckRow(t,side,W){ const X=FLW(t,W)[side], v=X.fg3_luck; if(v==null) return "";
  const W2=W==="l10"?"season":"l10", Y=FLW(t,W2)?.[side], v2=Y?.fg3_luck;
  const w=Math.min(50,Math.abs(v)/0.04*50), lab=side==="off"?`${t} shooting`:`${t} opponents`;

function waterfall(off,x){ // usage he frees up and who absorbs it, season on/off with 150+ minutes each way

function gainBoxes(off,x){ // on/off gainers when x is off the floor, plus minutes gainers from games he missed

function detail(off,def,p){

function renderRotations(){
  const [tm]=sideTeam(), M=D.teams[tm].mm, wg=M.per_game.slice(-Math.min(st.mmwin,M.per_game.length));
  const outId=st.out[tm]||"";
  const played=(g,p)=>{const a=g.sec[p];return (a&&a.some(x=>x>0))||(g.ot[p]>0);};
  const games=outId?wg.filter(g=>!played(g,outId)):wg, n=games.length;
  const rows={};
  for(const g of games){const S=new Set(g.starters||[]);
    for(const p of new Set([...Object.keys(g.sec),...Object.keys(g.ot)])){ if(!played(g,p)) continue;
      const r=rows[p]||(rows[p]={p,c:new Array(48).fill(0),gp:0,min:0,st:0,cl:0,cg:0});
      const a=g.sec[p]||new Array(48).fill(0); a.forEach((s,i)=>r.c[i]+=s);
      r.gp++; r.min+=a.reduce((x,y)=>x+y,0)/60+(g.ot[p]||0); if(S.has(p)) r.st++; if(g.comp!==false){ r.cg++; if(a[47]>0) r.cl++; } }}
  const list=Object.values(rows).filter(r=>r.min>=2&&!(LIVE&&st.ros!=="all"&&!onRoster(tm,r.p))).sort((a,b)=>b.min-a.min).slice(0,14);
  const base={};   // minutes per game played across every game in the window, for the delta when a filter is on
  for(const g of wg) for(const p of new Set([...Object.keys(g.sec),...Object.keys(g.ot)])){ if(!played(g,p)) continue;
    const b=base[p]||(base[p]={gp:0,min:0}); b.gp++; b.min+=(g.sec[p]||[]).reduce((x,y)=>x+y,0)/60+(g.ot[p]||0); }
  const cand=D.teams[tm].inout.filter(x=>onRoster(tm,x.id)).slice().sort((x,y)=>y.mpg-x.mpg).slice(0,8);
  let h=`<div class="toolbar card"><div class="row-ctl">${sideSeg()}${seg("mmwin",[["Last 5",5],["Last 10",10],["Last 20",20],[SL,999]],st.mmwin)}</div>
    <div class="outbar"><span class="lbl">Only games without:</span>${cand.map(x=>`<button class="pill" data-id="${x.id}" aria-pressed="${x.id===outId}">${nm(x.id)}</button>`).join("")}</div></div>
    
    <section class="card"><div class="card-h"><h3>${dot(tm)}${tm} minutes matrix</h3><span class="hint">${n} game${n===1?"":"s"}${outId?` without ${nm(outId)}`:""}${n&&n<5?" · small sample":""}${M.excluded?` · ${M.excluded} game left out because the feed listed under 5 players`:""}</span></div>
    <div class="mmwrap"><table class="mm"><thead><tr><th class="nm">Player</th>`;
  for(let m=0;m<48;m++){const q=m%12===0; h+=`<th class="${q?"q":""}">${q?"Q"+(m/12+1):(m%12===5?"6'":"")}</th>`;}
  h+=`</tr></thead><tbody>`;
  if(!n) h+=`<tr><td class="nm" colspan="49" style="padding:12px">No games in this window match. Widen the window.</td></tr>`;
  let sum="";
  for(const r of list){
    const mpg=r.min/r.gp, b=base[r.p], bm=b?b.min/b.gp:null, dl=outId&&bm!=null?mpg-bm:null;
    const gone=LIVE&&!onRoster(tm,r.p);
    h+=`<tr class="${gone?"gone":""}"><td class="nm">${nm(r.p)}${gone?' <span class="badge mid">gone</span>':""}</td>`;
    r.c.forEach((s,i)=>{const v=s/60/n; h+=`<td class="c${i%12===0&&i?" qs":""}" data-tip="${nm(r.p)}: on the floor in ${Math.round(v*100)}% of games at Q${Math.floor(i/12)+1} ${12-(i%12)}:00" style="background:${heat(v)}"></td>`;});
    h+=`</tr>`;
    sum+=`<div class="ms${gone?" gone":""}"><span class="n">${nm(r.p)}${gone?' <span class="badge mid">gone</span>':""}</span><span class="m"><b>${mpg.toFixed(1)}</b> min${mbar(mpg,48,tc(tm))}${dl!=null&&Math.abs(dl)>=0.5?`<span class="delta ${dl>0?"up":"down"}">${sgn(dl)}</span>`:""}</span>
      <small>${r.gp} game${r.gp===1?"":"s"} · ${r.st}/${r.gp} starts · closes ${r.cg?Math.round(100*r.cl/r.cg)+"% ("+r.cl+"/"+r.cg+")":"–"}</small></div>`;
  }
  h+=`</tbody></table></div><div class="mm-sum">${sum}</div>`;
  h+=`<div class="legend"><span>Off the floor</span><span class="ramp">${RAMP.map(t=>`<i style="background:var(${t})"></i>`).join("")}</span><span>On the floor every game</span></div></section>`;
  // stints, stagger and closing lineups for the same games
  if(n){
    const stt=list.slice(0,10).map(r=>{ let ns=0,gp=0; for(const g of games){ const k=g.stints?.[r.p]; if(k){ns+=k;gp++;} }
      return {p:r.p, spg:gp?ns/gp:null, len:ns?r.min/ns:null, mpg:r.min/r.gp}; });
    const mx=Math.max(...stt.map(x=>x.len||0),1);
    const stintT=`<table class="ctbl"><thead><tr><th class="l">Player</th><th>Min / g</th><th>Stints / g</th><th>Avg stint</th><th></th></tr></thead><tbody>${stt.map(x=>`<tr><td class="l">${nm(x.p)}</td><td>${x.mpg.toFixed(1)}</td><td>${x.spg?x.spg.toFixed(1):"–"}</td><td>${x.len?x.len.toFixed(1)+" min":"–"}</td><td style="width:35%">${x.len?mbar(x.len,mx,tc(tm)):""}</td></tr>`).join("")}</tbody></table>`;
    // stagger: for the top regulars, share of each one's minutes with the other off the floor (season on/off splits)
    const T=D.teams[tm], regs=rosterRegs(tm).slice().sort((x,y)=>y.mpg-x.mpg).slice(0,4);
    let stag="";
    for(let i=0;i<regs.length;i++) for(let j=i+1;j<regs.length;j++){ const X=T.onoff.find(o=>o.id===regs[i].id), m=X?.mates.find(q=>q.id===regs[j].id); if(!m) continue;
      const on=m.w.season[0]?.[OI.min]||0, off=m.w.season[1]?.[OI.min]||0, sh=off/(on+off||1);
      const Y=T.onoff.find(o=>o.id===regs[j].id), mi=Y?.mates.find(q=>q.id===regs[i].id), on2=mi?.w.season[0]?.[OI.min]||0, off2=mi?.w.season[1]?.[OI.min]||0;
      const ln=id=>nm(id).split(" ").slice(-1)[0];
      stag+=`<tr><td class="l">${ln(regs[i].id)} + ${ln(regs[j].id)}</td><td>${(on/(on+off||1)*100).toFixed(0)}%</td><td>${(sh*100).toFixed(0)}%</td><td>${on2+off2?(off2/(on2+off2)*100).toFixed(0)+"%":"–"}</td></tr>`; }
    const stagT=stag?`<table class="ctbl"><thead><tr><th class="l">Pair</th><th title="Share of the second player's minutes with the first on the floor">Together</th><th title="Share of the second player's minutes with the first off the floor">2nd w/o 1st</th><th title="Share of the first player's minutes with the second off the floor">1st w/o 2nd</th></tr></thead><tbody>${stag}</tbody></table>`:'<p class="hint">Not enough shared minutes.</p>';
    // closing lineups: most-used 5-man unit in the last 2:00 of regulation, competitive games only
    const cnt={}; let cg=0; for(const g of games){ if(g.comp===false||!(g.close5||[]).length) continue; cg++; const k=g.close5.slice().sort().join("|"); cnt[k]=(cnt[k]||0)+1; }
    const top=Object.entries(cnt).sort((x,y)=>y[1]-x[1]).slice(0,4);
    const closeT=top.length?`<ol class="closers">${top.map(([k,v])=>`<li><span class="cc"><b>${v}</b> of ${cg}</span><span>${k.split("|").map(id=>nm(id).split(" ").slice(-1)[0]).join(" · ")}</span></li>`).join("")}</ol>`:'<p class="hint">No competitive finishes in this window.</p>';
    h+=`<div class="rot-more">
      <div class="card"><div class="card-h"><h3>Stint lengths</h3><span class="hint">${n} games${outId?` without ${nm(outId)}`:""}</span></div>${stintT}<p class="hint sm">A stint runs from checking in to checking out. Longer stints with fewer of them = a heavier, steadier role.</p></div>
      <div class="card"><div class="card-h"><h3>Stagger</h3><span class="hint">top regulars on tonight's roster · ${SL} on/off minutes</span></div>${stagT}<p class="hint sm">High "without" shares mean the coach staggers the pair, so one is usually on the floor: those minutes carry more usage for whoever is out there.</p></div>
      <div class="card"><div class="card-h"><h3>Closing lineups</h3><span class="hint">most-used unit in the last 2:00 · competitive games</span></div>${closeT}<p class="hint sm">Blowouts left out, same rule as Closes.</p></div>
    </div>`;
  }
  $("view").innerHTML=h;
  wire("side",v=>st.side=v); wire("mmwin",v=>st.mmwin=v);
  $("view").querySelectorAll(".pill").forEach(b=>b.onclick=()=>{st.out[tm]=st.out[tm]===b.dataset.id?"":b.dataset.id;render(true);});
}

/* ---------------- defense ---------------- */
function renderDefense(){
  const [off,def]=sideTeam(), F=D.teams[def], O=D.teams[off], DV=dvaFor(def,off);
  const who={}; for(const p of O.players.filter(p=>(p.mpg>=12&&p.gp>=10)||(LIVE&&p.starter))) (who[`${p.arch}|${p.tier}`]=who[`${p.arch}|${p.tier}`]||[]).push(nm(p.id).split(" ").slice(-1)[0]);
  const only=st.donly===true;
  const SL=STATS;
  const cellH=(k,c)=>{ if(!c) return `<td class="dc">–</td>`; const [tot,dev,min,rk]=c;
    const amt=Math.min(1,Math.abs(tot)/(SCALE[k]*3));
    return `<td class="dc" style="background:color-mix(in srgb, var(${tot>=0?"--good":"--bad"}) ${(amt*34).toFixed(0)}%, transparent)" data-tip="${def} · ${k}: ${sgn(tot,2)} per 36 ${DV[k].per==="poss"?`at tonight's pace (${sgn(c[4],2)} per 100 possessions)`:""} = team-wide ${sgn(DV[k].overall[0],2)} + type-specific ${sgn(dev,2)} · ${min} opponent minutes · rank ${ord(rk)} of 30${DV[k].per==="poss"?" per possession":""}">${RK(rk,1,sgn(tot,k==="FG3A"||k==="RIM_FGA"||k==="TRIPS"?2:1))}</td>`; };
  let rows="";
  rows+=`<tr class="tw"><td class="l"><b>Team-wide</b><small>every player type</small></td>${SL.map(([k])=>{const o=DV[k].overall; return `<td class="dc">${RK(o[1],1,sgn(o[0],2))}</td>`;}).join("")}</tr>`;
  for(const a of ARCH) for(const t of ["High","Low"]){ const key=`${a}|${t}`, w=who[key]; if(only&&!w) continue;
    rows+=`<tr class="${w?"has":"none"}${t==="High"?" first":""}"><td class="l"><b>${a}</b> <span class="badge ${t==="High"?"hi":"lo"}">${t.toLowerCase()} usage</span><small>${w?`${off}: ${w.join(", ")}`:`No ${off} regular`}</small></td>${SL.map(([k])=>cellH(k,DV[k].cells[key])).join("")}</tr>`; }
  const h=`<div class="toolbar card"><div class="row-ctl">${seg("side",[[`${dot(teams().h)}${teams().h} defense`,"away"],[`${dot(teams().a)}${teams().a} defense`,"home"]],st.side)}${seg("donly",[["All player types","all"],[`Types ${off} plays`,"only"]],only?"only":"all")}</div></div>
    <section class="card"><div class="card-h"><h3>${dot(def)}What ${def} allow by player type</h3><span class="hint">big number = ${def}'s rank of 30, per possession so pace doesn't skew it (1st = gives up the most, green = good for the offense) · beside it: per 36 vs. each player's own rate at tonight's pace (${tonightPace(def,off).toFixed(1)} possessions) · 3PA ranked per minute · hover for the breakdown</span></div>
    <div class="tbl dtbl-w"><table class="ctbl dtbl"><thead><tr><th class="l">Player type · ${off} players</th>${SL.map(([k,l])=>`<th>${l}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>
    <p class="hint sm">Each cell = ${def}'s team-wide effect plus a type-specific part shrunk by sample. 3PA is the most repeatable; points and assists are the noisiest. Names are ${off} players with 12+ mpg${LIVE?" or projected to start":""}.</p></section>`;
  $("view").innerHTML=h;
  wire("side",v=>st.side=v); wire("donly",v=>st.donly=v==="only");
}

function render(keep){
  save();
  renderTop(); renderBoard(); renderTabs();
  ({overview:renderOverview,players:renderPlayers,onoff:renderOnOff,rotations:renderRotations,defense:renderDefense})[st.tab]();
  applyPage();
}
const tip=$("tip");
document.addEventListener("mousemove",e=>{const el=e.target.closest("[data-tip]"); if(!el){tip.hidden=true;return;}
  tip.textContent=el.dataset.tip; tip.hidden=false;
  tip.style.left=Math.min(e.clientX+12,window.innerWidth-tip.offsetWidth-8)+"px"; tip.style.top=(e.clientY+14)+"px";});
render();
</script>

<script>
/* Data loading, same pattern as the NFL desk: fetch nba_matchup_master.json from next to this page
   (or ?data=URL), then run the page code (stored in #deskapp) once the data is in. A self-contained
   build (make_page.py --inline) sets window.NBA_DATA up front and skips the fetch. */
(function(){
  const box=document.getElementById("view")||document.body;
  function start(data){
    window.NBA_DATA=data;
    const s=document.createElement("script");
    s.textContent=document.getElementById("deskapp").textContent;
    document.body.appendChild(s);
  }
  if(window.NBA_DATA) return start(window.NBA_DATA);
  const qs=new URLSearchParams(location.search); let win=qs.get("w"); try{ if(win==null) win=localStorage.getItem("nba_win")||""; }catch(e){ win=win||""; }
  const base=qs.get("data")||"nba_matchup_master.json", main=base;
  const url=win==="2627"?base.replace(/\.json(\?.*)?$/,"_2627.json$1"):base;
  document.querySelectorAll("#datawin button").forEach(b=>{ b.setAttribute("aria-pressed",String(b.dataset.w===(win==="2627"?"2627":""))); b.onclick=()=>{ try{localStorage.setItem("nba_win",b.dataset.w);}catch(e){} const u=new URL(location.href); u.searchParams.delete("w"); location.href=u.href; }; });
  const esc=x=>String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  box.innerHTML='<p style="padding:24px;color:#5a6575">Loading the desk...</p>';
  fetch(url).then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .catch(e=>{ if(url===main) throw e; try{localStorage.setItem("nba_win","");}catch(_){} document.querySelectorAll("#datawin button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.w===""))); return fetch(main).then(r=>{ if(!r.ok) throw e; return r.json(); }); })
    .then(start)
    .catch(e=>{ box.innerHTML='<div style="padding:24px"><b>Can\'t load the data file.</b><br>Looked for <code>'+esc(url)+'</code> ('+esc(e.message)+
      '). Put <code>nba_matchup_master.json</code> next to this page, or point at one with <code>?data=URL</code>. Serving over http (not file://) is required for fetch.</div>'; });
})();
</script>
