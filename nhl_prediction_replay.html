<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prediction Pro NHL Sims</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Big+Shoulders+Display:wght@700;800;900&display=swap">
<style>
/* NHL Prediction Pro NHL Sims (Chris 2026-11-19): the NBA pages' layout and themes, a rink instead of the court. One screen: header -> scoreboard
   -> tabs -> the one view on screen (it scrolls inside, the page never does). */
:root {
  --ground: #e5f0f7; --surface: #f3f9fd; --ink: #0c2138; --muted: #58778f; --faint: #829bae; --rule: #ccdfed; --rule-strong: #a5c2d7;
  --panel2: #dbe9f3; --accent: #22496f; --accent-soft: #dbe9f3; --accent-ink: #ffffff;
  --good: #2f7d32; --good-soft: #dff2db; --bad: #c0392b; --bad-soft: #f8e1de; --warn: #9a6400;
  --board: linear-gradient(180deg, #1d3a60, #142c4c); --board-ink: #ffffff; --board-muted: #c9dbe7; --board-rule: rgba(255, 255, 255, .18);
  --hdr: #142c4c; --hdr-ink: #ffffff; --sel: #142c4c; --sel-ink: #ffffff; --bar: #142c4c; --bar-ink: #ffffff; --bar-sub: #c9dbe7;
  --bet: #1d3a60; --bet-ink: #ffffff; --ctl-bg: #ffffff; --ctl-ink: #0c2138; --ctl-rule: #ffffff;
  --ice: #f4f8fb; --ice2: #e6eef4; --boards: #0c2138; --redline: #c8102e; --blueline: #1d4f91; --crease: #9fd0ef;
  --t0: #2a6fd6; --t1: #d4561f;
  --text: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif; --disp: "Big Shoulders Display", "Archivo", sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --ground: #0b1f36; --surface: #142c4c; --ink: #e8f0f6; --muted: #8fa2b6; --faint: #6c8299; --rule: #264765; --rule-strong: #31567a;
  --panel2: #183353; --accent: #9ccae1; --accent-soft: rgba(156, 202, 225, .14); --accent-ink: #0b1f36;
  --good: #aeef9c; --good-soft: #26481b; --bad: #ff8a7a; --bad-soft: rgba(255, 111, 94, .16); --warn: #ffd27a;
  --board: linear-gradient(180deg, #183353, #142c4c); --board-ink: #ffffff; --board-muted: #9ccae1; --board-rule: #264765;
  --hdr: #142c4c; --hdr-ink: #ffffff; --sel: #c9dbe7; --sel-ink: #0b1f36; --bar: #c9dbe7; --bar-ink: #0b1f36; --bar-sub: #31567a;
  --bet: #c9dbe7; --bet-ink: #0b1f36; --ctl-bg: #183353; --ctl-ink: #e8f0f6; --ctl-rule: #31567a;
  --ice: #dfe8ef; --ice2: #cbd7e1; --boards: #0b1f36;
  color-scheme: dark;
}
/* Prediction Pro skin: purple and black (as the NBA Prediction Pro page) */
:root, :root[data-theme="dark"], :root[data-theme="light"] {
  --ground: #0b0c14; --surface: #12101f; --panel2: #181028; --ink: #f3f0ff; --muted: #a99fc9; --faint: #6f6690;
  --rule: #251c3d; --rule-strong: #34295a; --accent: #9262f4; --accent-ink: #ffffff; --accent-soft: rgba(146, 98, 244, .2);
  --good: #9ff0a5; --good-soft: rgba(80, 200, 120, .16); --bad: #ff8b9b; --bad-soft: rgba(255, 93, 115, .14); --warn: #ffd27a;
  --board: #0a0912; --board-ink: #ffffff; --board-muted: #a99fc9; --board-rule: #2a2145;
  --hdr: #0a0912; --hdr-ink: #ffffff; --sel: #9262f4; --sel-ink: #ffffff; --bar: #1d1340; --bar-ink: #ffffff; --bar-sub: #b9a8e8;
  --bet: #7a4fe6; --bet-ink: #ffffff; --ctl-bg: #181028; --ctl-ink: #f3f0ff; --ctl-rule: #34295a;
  --ice: #e9e6f5; --ice2: #d6d1ec; --boards: #0a0912; color-scheme: dark;
}
body { background: radial-gradient(1200px 600px at 85% -10%, rgba(146, 98, 244, .18), transparent 60%), var(--ground) }
.brand .an { height: 30px }
* { box-sizing: border-box }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ground); color: var(--ink) }
body { font: 400 14px/1.4 var(--text); font-variant-numeric: tabular-nums }
button, select, input { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
[hidden] { display: none !important }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }
.app { height: 100%; height: 100dvh; display: flex; flex-direction: column; gap: 8px; max-width: 1440px; margin: 0 auto;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) max(10px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)) }
/* header */
.top { position: relative; z-index: 60; display: flex; align-items: center; gap: 10px; min-width: 0; color: var(--hdr-ink);
  padding: max(10px, env(safe-area-inset-top, 0px)) 0 10px }
.top::before { content: ""; position: absolute; top: 0; bottom: 0; left: -100vmax; right: -100vmax; z-index: -1; background: var(--hdr); border-bottom: 1px solid var(--rule) }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 18px; white-space: nowrap }
.brand .an { display: block; height: 26px } .brand .lg { font: 800 13px/1 var(--text); letter-spacing: .08em; padding: 3px 6px; border: 1px solid rgba(255,255,255,.45); border-radius: 4px }
.grow { flex: 1; min-width: 0 }
.top select, .thm { background: var(--ctl-bg); color: var(--ctl-ink); border: 1px solid var(--ctl-rule); border-radius: 6px; min-height: 32px; padding: 0 8px }
#gamePick { width: 100%; max-width: 360px; font-weight: 700 }
#bookPick { max-width: 210px; font-weight: 600 } #bookPick.on { box-shadow: 0 0 0 2px var(--accent) inset }
.upd { color: #c9dbe7; font-size: 12px; white-space: nowrap }
.thm { min-width: 34px; font-size: 15px; line-height: 1 }
@media (max-width: 760px) { .top { flex-wrap: wrap; row-gap: 6px } .brand span { display: none } .upd { display: none } #bookPick { order: 9; flex: 1; max-width: none } }
/* scoreboard */
.board { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; background: var(--board); color: var(--board-ink);
  border-radius: 10px; padding: 8px 14px; border: 1px solid var(--rule); position: relative; overflow: hidden }
.side { display: flex; align-items: center; gap: 10px; min-width: 0 } .side.r { justify-content: flex-end; text-align: right }
.tn { font: 800 18px/1.1 var(--disp); letter-spacing: .02em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.side.r .tn { justify-content: flex-end }
.tlogo { width: 30px; height: 30px; object-fit: contain }
.tmeta { color: var(--board-muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.sc { font: 900 40px/1 var(--disp); min-width: 34px; text-align: center; transition: transform .2s }
.sc.pop { animation: pop .9s ease-out }
@keyframes pop { 0% { transform: scale(1) } 25% { transform: scale(1.45); color: #ffdf5e } 100% { transform: scale(1) } }
.clk { text-align: center; display: flex; flex-direction: column; align-items: center; min-width: 96px }
.clk b { font: 700 12px/1 var(--text); color: var(--board-muted); text-transform: uppercase; letter-spacing: .08em }
.clk strong { font: 800 28px/1.1 var(--disp) } .clk small { color: var(--board-muted); font-size: 11px }
.pp { font: 800 11px/1 var(--text); letter-spacing: .06em; background: #ffdf5e; color: #1a1a1a; border-radius: 4px; padding: 3px 5px; margin-top: 3px }
.board.goal::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, rgba(255, 40, 40, .55), transparent 70%); animation: strobe .5s steps(2) 6 }
@keyframes strobe { 0% { opacity: 1 } 50% { opacity: .1 } 100% { opacity: 1 } }
@media (max-width: 760px) { .tn { font-size: 15px } .sc { font-size: 32px } .tmeta { display: none } .tlogo { width: 24px; height: 24px } }
/* tabs */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--rule-strong); overflow-x: auto; scrollbar-width: none; flex: 0 0 auto }
.tabs::-webkit-scrollbar { display: none }
.tabs button { flex: 0 0 auto; background: none; border: 1px solid transparent; border-bottom: 0; padding: 7px 12px; font-weight: 700; color: var(--muted); border-radius: 6px 6px 0 0; white-space: nowrap }
.tabs button[aria-selected="true"] { background: var(--sel); color: var(--sel-ink) }
.views { flex: 1; min-height: 0; position: relative }
.view { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 8px; min-height: 0 }
.scroll { overflow: auto; min-height: 0; flex: 1 }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; min-height: 0 }
.seg { display: inline-flex; border: 1px solid var(--sel); border-radius: 7px; overflow: hidden; flex: 0 0 auto }
.seg button { background: none; border: 0; padding: 5px 10px; font-weight: 700; font-size: 13px; color: var(--ink) }
.seg button[aria-pressed="true"] { background: var(--sel); color: var(--sel-ink) }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.chip { border: 1px solid var(--rule-strong); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700 }
.chip[aria-pressed="true"] { background: var(--sel); color: var(--sel-ink); border-color: var(--sel) }
.note { color: var(--muted); font-size: 12px }
.empty { padding: 30px 16px; text-align: center; color: var(--muted) }
/* replay */
.rp { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 8px; flex: 1; min-height: 0 }
.rp-left { display: flex; flex-direction: column; gap: 6px; min-height: 0; padding: 8px }
.rinkbox { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center }
#rink { width: 100%; height: 100%; max-height: 100%; display: block }
#rink .ice { fill: var(--ice) } #rink .boards { fill: none; stroke: var(--boards); stroke-width: 1.4 }
#rink .red { stroke: var(--redline); fill: none } #rink .blue { stroke: var(--blueline); fill: none } #rink .dotr { fill: var(--redline) } #rink .dotb { fill: var(--blueline) }
#rink .crease { fill: var(--crease); stroke: var(--redline); stroke-width: .25 }
#rink .net { fill: rgba(255,255,255,.6); stroke: var(--redline); stroke-width: .6 }
#rink .bench { fill: var(--ice2); stroke: var(--boards); stroke-width: .4 }
#rink .lbl { font: 700 3px/1 var(--text); fill: #58778f; letter-spacing: .06em; text-transform: uppercase }
#rink .pl circle { stroke: #fff; stroke-width: .5 } #rink .pl text { font: 800 2.2px/1 var(--text); fill: #fff; text-anchor: middle; dominant-baseline: central; pointer-events: none }
#rink .pl .nm { font: 700 2px/1 var(--text); fill: #0c2138; dominant-baseline: hanging }
#rink .pl.g circle { stroke: #000; stroke-width: .6 }
#rink .puck { fill: #111 }
#rink .shot { stroke-width: .5 } #rink .shot.goal { stroke: #000 }
#rink .light { fill: #ff2b2b; opacity: 0 } #rink .light.on { animation: lamp .35s steps(2) 10 }
@keyframes lamp { 0% { opacity: 1 } 50% { opacity: .15 } 100% { opacity: 1 } }
.siren { position: absolute; inset: 0; overflow: hidden; border-radius: 10px; pointer-events: none; display: flex; align-items: center; justify-content: center; flex-direction: column; opacity: 0 }
.siren.on { animation: siren 2.6s ease-out forwards }
.siren .beam { position: absolute; inset: 0; background: conic-gradient(from 0deg, rgba(255,30,30,.42), transparent 25%, rgba(255,30,30,.42) 50%, transparent 75%, rgba(255,30,30,.42));
  animation: spin .45s linear infinite; mix-blend-mode: multiply }
.siren .gl { position: relative; font: 900 64px/1 var(--disp); color: #fff; text-shadow: 0 0 18px #ff1f1f, 0 3px 0 #8b0000; letter-spacing: .06em }
.siren .who { position: relative; margin-top: 6px; font: 800 16px/1.2 var(--text); color: #fff; background: rgba(0,0,0,.6); padding: 4px 10px; border-radius: 6px; text-align: center }
@keyframes spin { to { transform: rotate(360deg) } }
@keyframes siren { 0% { opacity: 0; transform: scale(.9) } 8% { opacity: 1; transform: scale(1) } 80% { opacity: 1 } 100% { opacity: 0 } }
.callout { position: absolute; left: 10px; top: 10px; background: rgba(12, 33, 56, .86); color: #fff; border-radius: 6px; padding: 4px 8px; font-size: 12px; font-weight: 700; max-width: 70%; pointer-events: none }
.ctl { display: flex; gap: 6px; align-items: center; flex-wrap: wrap }
.btn { border: 1px solid var(--rule-strong); background: var(--surface); border-radius: 7px; padding: 5px 12px; font-weight: 700 }
.btn.primary { background: var(--sel); color: var(--sel-ink); border-color: var(--sel) }
.scrub { flex: 1; min-width: 160px; position: relative } .scrub input { width: 100% }
.ticks { position: relative; height: 12px; font-size: 10px; color: var(--muted) } .ticks span { position: absolute; transform: translateX(-50%) }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--muted) } .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: -1px }
.rp-right { display: flex; flex-direction: column; min-height: 0 }
.rp-right .panel { display: flex; flex-direction: column; flex: 1; min-height: 0 }
.rhd { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--rule) }
.rhd b { font: 800 15px/1 var(--disp); text-transform: uppercase; letter-spacing: .04em }
.feed { list-style: none; margin: 0; padding: 0 } .feed li { padding: 6px 10px; border-bottom: 1px solid var(--rule); font-size: 13px; display: flex; gap: 8px }
.feed li .t { color: var(--muted); flex: 0 0 64px; font-size: 12px } .feed li.goal { background: rgba(255, 60, 60, .12); font-weight: 700 } .feed li.cur { outline: 2px solid var(--accent); outline-offset: -2px }
.tmk { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px }
@media (max-width: 900px) { .rp { grid-template-columns: 1fr; grid-template-rows: minmax(220px, 1.1fr) minmax(160px, 1fr) } }
/* bets panel (replay) */
.bt { padding: 7px 10px; border-bottom: 1px solid var(--rule); display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center }
.bt .bl { font-weight: 700; font-size: 13px } .bt .bs { font-size: 12px; color: var(--muted) } .bt .st { font-size: 12px; font-weight: 700 }
.bt.won { background: var(--good-soft) } .bt.lost { background: var(--bad-soft) } .bt .st.up { color: var(--good) } .bt .st.dn { color: var(--bad) }
/* bet lanes */
.lanes { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 8px; align-content: start }
.lcol { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; min-width: 0 }
.lcol > h3 { margin: 0; padding: 9px 12px; background: var(--bar); color: var(--bar-ink); font: 800 16px/1.1 var(--disp); text-transform: uppercase; letter-spacing: .04em; display: flex; justify-content: space-between; gap: 8px; align-items: baseline }
.lcol > h3 small { color: var(--bar-sub); font: 600 11px/1.2 var(--text); text-transform: none; letter-spacing: 0 }
.lane { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; padding: 9px 12px; border-bottom: 1px solid var(--rule); align-items: center }
.lane:last-child { border-bottom: 0 }
.ln-bet { font-weight: 800; font-size: 14px; line-height: 1.25 } .ln-ctx { font-size: 12px; color: var(--muted) }
.track { grid-column: 1 / -1; position: relative; height: 10px; border-radius: 6px; background: var(--panel2) }
.track .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: var(--accent); opacity: .85 }
.track .be { position: absolute; top: -3px; width: 3px; height: 16px; background: var(--ink); border-radius: 2px }
.tkt { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 82px; padding: 5px 8px; border-radius: 8px; background: var(--bet); color: var(--bet-ink); text-decoration: none; line-height: 1.1 }
.tkt b { font: 900 18px/1 var(--disp) } .tkt small { font-size: 10px; opacity: .85 } .tkt em { font-style: normal; font: 800 9px/1 var(--text); text-transform: uppercase; letter-spacing: .08em; margin-top: 3px }
.tkt.off { background: var(--panel2); color: var(--ink) }
.sig { display: inline-block; font: 800 10px/1 var(--text); text-transform: uppercase; letter-spacing: .05em; padding: 3px 5px; border-radius: 4px; margin-left: 6px; vertical-align: 1px }
.sig.strong { background: var(--good-soft); color: var(--good) } .sig.lean { background: rgba(214, 150, 20, .16); color: var(--warn) }
.ev { font-weight: 800 } .ev.up { color: var(--good) } .ev.dn { color: var(--bad) }
.lnote { padding: 12px; color: var(--muted); font-size: 13px }
/* ladders */
.rungs { display: flex; gap: 6px; flex-wrap: wrap; grid-column: 1 / -1 }
.rung { display: flex; flex-direction: column; align-items: center; padding: 5px 8px; border-radius: 7px; background: var(--panel2); text-decoration: none; color: var(--ink); min-width: 70px; border-bottom: 3px solid var(--sel) }
.rung b { font: 800 14px/1 var(--text) } .rung span { font-size: 11px; color: var(--muted) } .rung i { font-style: normal; font: 900 15px/1.2 var(--disp) }
/* best bets / parlays */
.cards { list-style: none; margin: 0; padding: 0 }
.bc { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--rule); align-items: center }
.bc-k { font: 700 11px/1.2 var(--text); color: var(--muted); text-transform: uppercase; letter-spacing: .05em } .bc-b { font-weight: 800; font-size: 15px; display: flex; align-items: center; gap: 6px }
.bc-s { font-size: 12px; color: var(--muted) } .bc-s .was { color: var(--warn) } .bc.past { opacity: .62 }
.tsw { width: 20px; height: 20px; object-fit: contain }
.pcard { padding: 10px 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; border-bottom: 1px solid var(--rule) }
.pcard h4 { margin: 0 0 4px; font: 800 15px/1.2 var(--disp); text-transform: uppercase } .pcard .ps { font-size: 12px; color: var(--muted); margin-bottom: 6px }
.legs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px }
.legs li { display: flex; justify-content: space-between; gap: 8px; padding: 5px 8px; border: 1px solid var(--rule); background: var(--panel2); border-radius: 6px; font-size: 13px }
.legs li.past { opacity: .6 } .legs li span { color: var(--muted); font-size: 12px }
.lgo { margin-left: 6px; padding: 2px 6px; border-radius: 5px; background: var(--bet); color: var(--bet-ink); font: 800 10px/1.2 var(--text); text-decoration: none; text-transform: uppercase }
/* tables (box, players, results): the name column stays put on horizontal scroll */
.tw { overflow: auto; max-width: 100% }
table.t { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px }
table.t th, table.t td { padding: 5px 8px; border-bottom: 1px solid var(--rule); text-align: right; white-space: nowrap }
table.t th { position: sticky; top: 0; background: var(--panel2); z-index: 2; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); cursor: pointer }
table.t th:first-child, table.t td:first-child { position: sticky; left: 0; text-align: left; background: var(--surface); z-index: 1; font-weight: 700; box-shadow: 1px 0 0 var(--rule) }
table.t th:first-child { z-index: 3; background: var(--panel2) }
table.t tr.tot td { font-weight: 800 } table.t td.l { text-align: left }
.twocol { display: grid; grid-template-columns: 1fr 1fr; gap: 8px } @media (max-width: 900px) { .twocol { grid-template-columns: 1fr } }
.kpis { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 12px }
.kpi { background: var(--panel2); border-radius: 8px; padding: 8px 12px; min-width: 110px } .kpi b { display: block; font: 900 22px/1 var(--disp) } .kpi span { font-size: 11px; color: var(--muted) }
.tip { position: fixed; z-index: 99; background: #0c2138; color: #fff; padding: 5px 8px; border-radius: 6px; font-size: 12px; pointer-events: none }
.warnbar { margin: 0; padding: 8px 12px; border-radius: 8px; background: var(--accent-soft); font-size: 12px; color: var(--ink) }
</style>
<script>
(function () { var t = null; try { t = localStorage.getItem("plTheme"); } catch (e) {}
  if (true) t = "dark";
  if (t !== "light" && t !== "dark") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", t); })();
</script>

<body>

<script>
(() => {
"use strict";
const BOARD = "predictionpro";            // which prices this page shows: "action" (PickLabs: sportsbooks) or "predictionpro" (exchanges)
const SIMKEY = BOARD === "action" ? "std" : "predictionpro";
const CTX = BOARD === "action" ? "fantasylabs-picklabs" : "predictionpro";
const DATA = "https://raw.githubusercontent.com/chrisgimino/jabroni/data/";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pct = (x, d = 0) => x === null || x === undefined ? "–" : (100 * x).toFixed(d) + "%";
const odds = a => a === null || a === undefined ? "–" : (a > 0 ? "+" + a : String(a));
const dec1 = a => a > 0 ? 1 + a / 100 : 1 + 100 / Math.abs(a);
const evf = e => e === null || e === undefined ? "–" : (e >= 0 ? "+" : "") + (100 * e).toFixed(1) + "%";
const uTxt = u => u ? `${(+u).toFixed(2).replace(/0$/, "")}u` : "";
const DLURL = id => /^https?:/.test(id) ? id : `https://switchboard.actionnetwork.com/v2/deeplink?deeplinkId[0]=${encodeURIComponent(id)}&context=${CTX}`;
const DLMULTI = ids => ids.some(i => /^https?:/.test(i)) ? DLURL(ids[0]) : `https://switchboard.actionnetwork.com/v2/deeplink?${ids.map((d, i) => `deeplinkId[${i}]=${encodeURIComponent(d)}`).join("&")}&context=${CTX}`;
const S = { games: [], slate: null, prices: null, gid: null, sm: null, ins: null, t: 0, playing: false, speed: 20, view: "replay", rMode: "bets",
  ev: [], endT: 3600, cur: -1, scope: "game", stat: "all", scKind: "anytime", posOnly: true, sortKey: "pts", sortDir: -1, book: null, last: 0, pos: new Map(), sirenAt: -1 };
try { S.book = localStorage.getItem("nhlBook") || null; } catch (e) {}

// ------------------------------------------------------------------ teams: colours, logos (NHL's public logo files)
const TCOL = { ANA: "#f47a38", BOS: "#ffb81c", BUF: "#003087", CGY: "#c8102e", CAR: "#ce1126", CHI: "#cf0a2c", COL: "#6f263d", CBJ: "#002654",
  DAL: "#006847", DET: "#ce1126", EDM: "#ff4c00", FLA: "#c8102e", LAK: "#111111", MIN: "#154734", MTL: "#af1e2d", NSH: "#ffb81c", NJD: "#ce1126",
  NYI: "#00539b", NYR: "#0038a8", OTT: "#c52032", PHI: "#f74902", PIT: "#fcb514", SJS: "#006d75", SEA: "#001628", STL: "#002f87", TBL: "#002868",
  TOR: "#00205b", UTA: "#69b3e7", VAN: "#00205b", VGK: "#b4975a", WSH: "#c8102e", WPG: "#041e42" };
const LOGO = ab => ab ? `https://assets.nhle.com/logos/nhl/svg/${ab}_light.svg` : "";
const logoImg = (ab, cls = "tsw") => ab ? `<img class="${cls}" src="${LOGO(ab)}" alt="" onerror="this.remove()">` : "";
function teamColors(a0, a1) {   // two colours that read apart: the away team takes white-ish if both are close
  let c0 = TCOL[a0] || "#2a6fd6", c1 = TCOL[a1] || "#d4561f";
  const lum = c => { const n = parseInt(c.slice(1), 16); return .3 * (n >> 16) + .59 * (n >> 8 & 255) + .11 * (n & 255); };
  const d = (x, y) => { const a = parseInt(x.slice(1), 16), b = parseInt(y.slice(1), 16); return Math.abs((a >> 16) - (b >> 16)) + Math.abs((a >> 8 & 255) - (b >> 8 & 255)) + Math.abs((a & 255) - (b & 255)); };

}

// ------------------------------------------------------------------ data: the slate (sims + replays) and the prices laid over it
async function getJSON(u) { const r = await fetch(u, { cache: "no-store" }); if (!r.ok) throw new Error(r.status); return r.json(); }
async function loadData(first) {
  const tryGet = async name => { try { return await getJSON(DATA + name); } catch (e) { return await getJSON(name); } };
  const p = await tryGet("nhl_prices.json");
  if (!first && S.prices && p.created_utc === S.prices.created_utc) return null;
  if (first || !S.slate || p.slate !== S.slate.id) S.slate = await tryGet("nhl_replay_data.json");

}
const INS = gid => S.prices?.games?.[gid] || null;
const SEC = gid => INS(gid ?? S.gid)?.[SIMKEY] || null;
const GAME = gid => S.games.find(g => String(g.schedule_id) === String(gid));
const SM = gid => S.slate?.games?.[gid]?.sims;
function stamp(s) { const d = new Date(s); return isNaN(d) ? "" : d.toLocaleString("en-US", { timeZone: "America/New_York", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) + " ET"; }
async function refresh() {
  try { const st = await loadData(false); if (!st) return; $("upd").textContent = `Updated ${stamp(st)}`; fillBooks(); if (S.view !== "replay") renderView(); else renderRight(); } catch (e) {}
}
setInterval(refresh, 5 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });

// ------------------------------------------------------------------ book picker
function walkBooks(o, set, dp = 0) {
  if (!o || dp > 9 || typeof o !== "object") return;
  if (Array.isArray(o)) { for (const v of o) walkBooks(v, set, dp + 1); return; }
  for (const [k, v] of Object.entries(o)) { if (k === "bp" && v && typeof v === "object") Object.keys(v).forEach(b => set.add(b)); else if (k === "book" && typeof v === "string") set.add(v); else if (v && typeof v === "object") walkBooks(v, set, dp + 1); }
}
function fillBooks() {
  const set = new Set(); for (const g of S.games) walkBooks(SEC(g.schedule_id), set);
  const list = [...set].filter(Boolean).sort(); if (S.book && !list.includes(S.book)) list.push(S.book);
  $("bookPick").innerHTML = `<option value="">Best price · any ${BOARD === "action" ? "book" : "exchange"}</option>` + list.map(b => `<option value="${esc(b)}"${b === S.book ? " selected" : ""}>${esc(b)} only</option>`).join("");
  $("bookPick").classList.toggle("on", !!S.book);
}
function atBook(x) {   // a priced bet at the picked book (our chance stays): null when that book doesn't offer it
  if (!S.book || !x) return x;
  if (x.book === S.book) return x;
  const q = x.bp?.[S.book]; if (!q) return null;
  return { ...x, price: q[0], book: S.book, dl: q[1], ev: x.p * dec1(q[0]) - 1 };
}

// ------------------------------------------------------------------ game picker
function gameLbl(gid) { const g = GAME(gid); return g ? g.label : String(gid); }
function fillPicker() {
  $("gamePick").innerHTML = S.games.map(g => { const t = g.tip ? new Date(g.tip).toLocaleTimeString("en-US", { timeZone: "America/New_York", hour: "numeric", minute: "2-digit" }) : "";
    return `<option value="${esc(g.schedule_id)}">${esc(g.label)}${t ? " · " + t : ""}</option>`; }).join("");
}
function pick(gid) {
  stop(); S.gid = String(gid); S.sm = SM(gid); S.ins = INS(gid); if (!S.sm) return;
  prepare(); S.t = 0; S.cur = -1; S.sirenAt = -1; renderStatic(); seek(0); renderView();
}

// ------------------------------------------------------------------ the replayed game
const nm = id => S.sm?.players?.[id]?.name || String(id ?? "");
const last = id => { const n = nm(id).split(" "); return n.length > 1 ? n.slice(1).join(" ") : n[0]; };
const ini = id => nm(id).split(" ").map(w => w[0] || "").join("").slice(0, 2).toUpperCase();
const abbr = t => S.sm.teams[t].team;
const PER = t => t < 3600 ? Math.floor(t / 1200) + 1 : (t < 3900 ? 4 : 5);
const PNAME = p => ["1st", "2nd", "3rd", "OT", "SO"][p - 1];
function clockAt(t) { const p = PER(t); if (p === 5) return { p, txt: "SO" }; const st = p <= 3 ? (p - 1) * 1200 : 3600, len = p <= 3 ? 1200 : 300;
  const r = Math.max(0, len - (t - st)); return { p, txt: `${Math.floor(r / 60)}:${String(Math.floor(r % 60)).padStart(2, "0")}` }; }
function prepare() {
  const E = (S.sm.events || []).map((e, i) => ({ ...e, i }));
  // the puck's spot at each event: shots at their real spot (team 1 attacks left), hits and penalties along the boards
  const R = mulberry(+S.gid || 7);
  for (const e of E) {
    const dir = e.team === 0 ? 1 : -1;
    if (e.type === "shot") { e.px = dir * (e.x || 70); e.py = dir * (e.y || 0); }
    else if (e.type === "hit") { e.px = (R() * 2 - 1) * 85; e.py = (R() < .5 ? -1 : 1) * (36 + R() * 5); }
    else if (e.type === "period_end" || e.type === "ot_start" || e.type === "final") { e.px = 0; e.py = 0; }
  }
  S.ev = E; S.endT = E.length ? Math.max(...E.map(e => e.t)) + 2 : 3600;
  S.goals = E.filter(e => e.type === "shot" && e.res === "goal");
  S.ons = E.filter(e => e.type === "on");

}
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// state at time t: score, on ice, box, penalties, pulled goalies, last event
function stateAt(t) {
  const st = { score: [0, 0], on: [[], []], str: [5, 5], pulled: [false, false], relief: [false, false], box: {}, pen: [], cur: -1, lastSpot: null, nextSpot: null, prevT: 0, nextT: 0, toi: {} };
  const B = id => (st.box[id] ||= { g: 0, a: 0, pts: 0, sog: 0, blk: 0, hits: 0, ppp: 0, sv: 0, ga: 0, pim: 0 });
  let lastOn = 0;
  for (const e of S.ev) {
    if (e.t > t) { if (e.px !== undefined && !st.nextSpot) { st.nextSpot = e; st.nextT = e.t; } continue; }
    st.cur = e.i;
    if (e.type === "on") { for (const tm of st.on) for (const id of tm) st.toi[id] = (st.toi[id] || 0) + (e.t - lastOn); lastOn = e.t; st.on = e.on.map(x => x.slice()); st.str = e.skaters || [5, 5]; }
    else if (e.type === "shot") {
      const g = goalieOf(1 - e.team, st);
      if (e.res === "goal") { st.score = e.score ? e.score.slice() : st.score; const b = B(e.player); b.g++; b.pts++; b.sog++; if (e.str === "PP") b.ppp++;
        for (const a of e.ast || []) { const x = B(a); x.a++; x.pts++; if (e.str === "PP") x.ppp++; }
        if (g && e.str !== "EN") B(g).ga++; }
      else if (e.res === "save") { B(e.player).sog++; if (g) B(g).sv++; }
      else if (e.res === "block" && e.blocker) B(e.blocker).blk++;
    }
    else if (e.type === "hit") B(e.player).hits++;
    else if (e.type === "penalty") { B(e.player).pim += e.min; st.pen.push({ team: e.team, player: e.player, until: e.t + 60 * e.min, t: e.t }); }

    else if (e.type === "goalie_back") st.pulled[e.team] = false;
    else if (e.type === "relief_goalie") st.relief[e.team] = true;
    else if (e.type === "so_attempt") { st.so = e.score; }
    else if (e.type === "final" && e.score) st.score = e.score.slice();
    if (e.px !== undefined) { st.lastSpot = e; st.prevT = e.t; }
  }

  return st;
}
function goalieOf(team, st) {   // the starter while he is in (a relief goalie isn't in the projections: his saves aren't shown)
  if (st && st.relief[team]) return null;
  const g = Object.entries(S.sm.players).filter(([, p]) => p.team === team && p.pos === "G");
  return g.length ? g[0][0] : null;
}

// ------------------------------------------------------------------ static parts
function renderStatic() {
  const sm = S.sm, g = GAME(S.gid), [c0, c1] = S.col, sim = S.ins?.sim;
  for (const t of [0, 1]) {
    const ab = abbr(t), name = (g?.team_names || [])[t] || ab;
    $("n" + t).innerHTML = t === 0 ? `${logoImg(ab, "tlogo")}<span>${esc(matchMedia("(max-width: 760px)").matches ? ab : name)}</span>` : `<span>${esc(matchMedia("(max-width: 760px)").matches ? ab : name)}</span>${logoImg(ab, "tlogo")}`;
    $("l" + t).textContent = sim ? `Sim ${sim.goals[t].toFixed(2)} goals · wins ${pct(sim.win[t])}` : "";
  }
  document.documentElement.style.setProperty("--t0", c0); document.documentElement.style.setProperty("--t1", c1);
  const hi = sm.teams.findIndex(x => x.home); $("cLogo").setAttribute("href", LOGO(abbr(hi >= 0 ? hi : 1)));
  $("dir0").textContent = `${abbr(0)} attacks ▶`; $("dir1").textContent = `◀ ${abbr(1)} attacks`;
  $("bench0").textContent = `${abbr(0)} bench`; $("bench1").textContent = `${abbr(1)} bench`;
  $("scrub").max = Math.ceil(S.endT);
  const tk = [0, 1200, 2400, 3600].filter(x => x < S.endT); if (S.endT > 3900) tk.push(3900);
  $("ticks").innerHTML = tk.map((x, i) => `<span style="left:${100 * x / S.endT}%">${["P1", "P2", "P3", "OT", "SO"][i]}</span>`).join("");
  $("legend").innerHTML = `<span><i style="background:${c0}"></i>${esc(abbr(0))}</span><span><i style="background:${c1}"></i>${esc(abbr(1))}</span>` +
    `<span>★ goal</span><span>○ save</span><span>✕ missed</span><span>▲ blocked</span><span>${sm.trials.toLocaleString()} sims · this is the one closest to the expected total</span>`;
  $("simLbl").textContent = "typical game";
  $("players").innerHTML = ""; $("shots").innerHTML = ""; S.pos = new Map(); S.dotEl = new Map();
  drawFaceoffDots();
}
function drawFaceoffDots() {
  let h = "";
  for (const sx of [-1, 1]) for (const sy of [-1, 1]) {
    h += `<circle class="red" cx="${sx * 69}" cy="${sy * 22}" r="15" stroke-width=".35"/><circle class="dotr" cx="${sx * 69}" cy="${sy * 22}" r="1"/><circle class="dotr" cx="${sx * 20}" cy="${sy * 22}" r="1"/>`;
  }
  $("dots").innerHTML = h;
}

// ------------------------------------------------------------------ positions: formations around the puck, eased every frame
// Team 0 attacks to the right (+x), team 1 to the left. The puck goes from one event's spot to the next; the team that owns the next
// event has the puck. Skaters take shape around it; a line change sends the old five to the bench and the new ones out from it.
function puckAt(st, t) {
  const a = st.lastSpot, b = st.nextSpot;
  const ax = a ? a.px : 0, ay = a ? a.py : 0;
  if (!b) return { x: ax, y: ay, own: a ? a.team : 0 };
  const span = Math.max(.1, st.nextT - st.prevT), f = Math.min(1, Math.max(0, (t - st.prevT) / span));
  const w = .5 - .5 * Math.cos(Math.PI * f);     // ease
  // a rush: from the last spot through the neutral zone to the next shot's spot
  const own = b.type === "hit" ? 1 - b.team : b.team;
  return { x: ax + (b.px - ax) * w, y: ay + (b.py - ay) * w + Math.sin(f * Math.PI * 2 + b.i) * 4 * (1 - Math.abs(2 * f - 1)), own };
}
function targets(st, puck, t) {
  const out = new Map();
  for (const team of [0, 1]) {
    const dir = team === 0 ? 1 : -1, att = puck.own === team, ids = st.on[team] || [];
    const F = ids.filter(id => S.sm.players[id]?.pos !== "D"), D = ids.filter(id => S.sm.players[id]?.pos === "D");
    const px = puck.x, py = puck.y, z = px * dir;          // z: how deep the puck is in this team's attacking direction
    const wob = (id, k) => Math.sin(t / 7 + (+id % 97) * k) * 2.2;
    F.forEach((id, k) => {
      let x, y;
      if (att) { x = k === 0 ? px - dir * 2 : px - dir * (8 + 6 * k); y = k === 0 ? py : (k === 1 ? -py * .6 + 12 * Math.sign(-py || 1) : py * .3 - 14 * Math.sign(py || 1)); }
      else { x = px - dir * (6 + 9 * k); y = py * .5 + (k - 1) * 14; }
      x = Math.max(-92, Math.min(92, x)); y = Math.max(-40, Math.min(40, y));
      out.set(id, [x + wob(id, 1.3), y + wob(id, 2.1)]);
    });
    D.forEach((id, k) => {
      let x, y; const sgn = k === 0 ? -1 : 1;
      if (att) { x = Math.max(dir > 0 ? 27 : -999, Math.min(dir < 0 ? -27 : 999, z > 25 ? dir * 31 : px - dir * 22)); y = sgn * 16; }
      else { x = z < -25 ? dir * -80 : px - dir * 18; y = sgn * (z < -25 ? 9 : 17); }
      x = Math.max(-90, Math.min(90, x));
      out.set(id, [x + wob(id, 1.7), y + wob(id, .9)]);
    });
    const g = goalieOf(team, st) || Object.entries(S.sm.players).find(([, p]) => p.team === team && p.pos === "G")?.[0];
    if (g) out.set(g, st.pulled[team] ? [team === 0 ? -14 : 14, -48] : [-dir * 86, Math.max(-3, Math.min(3, py * .08))]);
  }
  for (const p of st.pen) out.set(p.player, [p.team === 0 ? -4 : 4, 48.5]);
  return out;
}
function drawPlayers(st, t, snap) {
  const puck = puckAt(st, t), tg = targets(st, puck, t), g = $("players"), seen = new Set();
  const benchSpot = (team, id) => [team === 0 ? -14 + ((+id % 9) - 4) * 1.6 : 14 + ((+id % 9) - 4) * 1.6, -48.5];
  for (const [id, xy] of tg) seen.add(id);
  // players leaving: skate to the bench, then fade
  for (const [id] of S.pos) if (!seen.has(id)) { const p = S.sm.players[id]; if (p) tg.set(id, benchSpot(p.team, id)); }

    return col(`${SLOT_LBL[s.slot] || s.slot} ET`, `${ps.length} picks · posted ${esc((s.made_et || "").slice(11, 16))}`, ps.map(p => `<ul class="cards">${pickCard(S.book && p.book !== S.book ? { ...p, ...atBook(p) } : p)}</ul>`), "No bet cleared the floor at this time."); }).join("")
    : `<div class="lcol"><h3>Best bets<small>11:30 AM, 3:30 and 5:30 PM ET</small></h3><div class="lnote">The first best bets of the day come at 11:30 AM ET. Picks need EV 4% to 40% at the best price, 2 per game at most; earlier picks are re-checked at the books every run.</div></div>`;
  $("bestBoard").innerHTML = h + `</div><p class="note" style="padding:8px 4px">${esc(S.ins?.tested?.market || "")} ${esc(S.ins?.tested?.sim || "")}</p>`;
}
function legLi(l, z) {
  const st = z?.status, gone = st === "past" || st === "started";
  return `<li class="${gone ? "past" : ""}"><div>${logoImg(l.team)} <b>${esc(l.text)}</b><br><span>${esc(l.game)} · sim ${pct(z?.p ?? l.p, 0)}${st === "moved" ? ` · was ${odds(l.odds)}` : gone ? ` · ${st === "started" ? "game started" : "past our number"}` : ""}</span></div>
    <em>${odds(z?.odds ?? l.odds)}${!gone && (z?.dl || l.dl) ? `<a class="lgo" href="${DLURL(z?.dl || l.dl)}" target="_blank" rel="noopener">Bet ›</a>` : ""}</em></li>`;
}
function renderParlay() {
  const slots = slotsOf(); let h = `<div class="lanes">`;
  const pars = slots.map(s => [s.slot, s.sims?.[BOARD]?.parlay]).filter(([, p]) => p && (!S.book || p.book === S.book));
  h += col("Parlay of the day", "4 legs, 4 games, one book · odds = the legs' prices multiplied", pars.map(([slot, p]) => {
    const n = p.now || {}, ids = p.legs.map((l, i) => n.legs?.[i]?.dl || l.dl).filter(Boolean), pass = n.status === "past";
    return `<div class="pcard"><div><h4>${esc(SLOT_LBL[slot] || slot)} ET · ${p.legs.length} legs${p.u ? " · bet " + uTxt(p.u) : ""}</h4><div class="ps">All legs hit in ${pct(n.p ?? p.p, 1)} of our sims · EV ${evf(p.ev)} at ${esc(p.book)}${n.status ? ` · checked ${esc((n.t || "").slice(11, 16))}: ${n.status === "same" ? "same prices" : n.status === "moved" ? "a leg moved, still +EV" : "a leg is gone: pass the full parlay"}` : ""}</div>
      <ol class="legs">${p.legs.map((l, i) => legLi(l, n.legs?.[i])).join("")}</ol></div>
      ${pass ? `<div class="tkt off"><b>PASS</b><small>past our number</small></div>` : ids.length === p.legs.length ? `<a class="tkt" href="${DLMULTI(ids)}" target="_blank" rel="noopener"><b>${odds(n.odds ?? p.odds)}</b><small>${esc(p.book)}</small><em>Bet all ›</em></a>` : `<div class="tkt off"><b>${odds(p.odds)}</b><small>${esc(p.book)}</small></div>`}</div>`; }),
    slots.length ? "No parlay today: it needs 4 games with a +EV leg at the same book." : "The first parlay comes with the 11:30 AM ET best bets.");
  const sg = SEC()?.sgp;
  h += col(`Same-game parlay · ${gameLbl(S.gid)}`, "each leg +EV at one book; the book prices the parlay", sg && (!S.book || sg.book === S.book) ? [`<div class="pcard"><div><div class="ps">Legs in one game move together, so ${esc(sg.book)} prices it; the legs' prices multiplied would be ${odds(sg.odds_if_separate)}.</div><ol class="legs">${sg.legs.map(l => legLi(l, null)).join("")}</ol></div>
      <a class="tkt" href="${DLMULTI(sg.legs.map(l => l.dl))}" target="_blank" rel="noopener"><b>SGP</b><small>${esc(sg.book)}</small><em>Build it ›</em></a></div>`] : [], "No same-game parlay for this game: it needs 2+ +EV legs at one book.");
  $("parBoard").innerHTML = h + `</div>`;
}
function renderResults() {
  const R = S.prices?.bet_results || {}, b = R.by_board?.[BOARD];
  if (!b) { $("resBoard").innerHTML = `<div class="lcol"><h3>Results<small>graded from the NHL's box scores</small></h3><div class="lnote">No graded bets yet: picks are graded the morning after their games end.</div></div>`; return; }
  const kp = (v, l) => `<div class="kpi"><b>${v}</b><span>${l}</span></div>`;
  let h = `<div class="lcol"><h3>Results<small>every logged pick and parlay, graded</small></h3><div class="kpis">${kp(`${b.won}-${b.lost}${b.push ? "-" + b.push : ""}`, "won-lost-push")}${kp((b.units >= 0 ? "+" : "") + b.units + "u", "units")}${kp(b.roi === null ? "–" : (100 * b.roi).toFixed(1) + "%", "ROI")}${kp(b.risked + "u", "risked")}</div>`;
  h += `<div class="tw"><table class="t"><thead><tr><th>Bet</th><th>Date</th><th>Type</th><th>Price</th><th>Book</th><th>Result</th><th>Units</th></tr></thead><tbody>` +
    (b.recent || []).slice().reverse().map(r => `<tr><td>${esc(r.label)}</td><td>${esc(r.date)} ${esc(r.slot)}</td><td class="l">${esc(KIND_T[r.kind] || r.kind)}</td><td>${odds(+r.price)}</td><td class="l">${esc(r.book)}</td><td>${esc(r.result)}</td><td>${(+r.units).toFixed(2)}</td></tr>`).join("") + `</tbody></table></div></div>`;
  $("resBoard").innerHTML = h;
}

// ------------------------------------------------------------------ box score, players
function renderBox() {
  const st = S.st || stateAt(S.t), sm = S.sm; let h = "";
  for (const t of [0, 1]) {
    const ps = Object.entries(sm.players).filter(([, p]) => p.team === t);
    const sk = ps.filter(([, p]) => p.pos !== "G").sort((a, b) => (st.box[b[0]]?.pts || 0) - (st.box[a[0]]?.pts || 0) || (st.toi[b[0]] || 0) - (st.toi[a[0]] || 0));
    const gl = ps.filter(([, p]) => p.pos === "G"), mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
    h += `<div class="panel"><div class="rhd"><b>${logoImg(abbr(t))} ${esc(abbr(t))} · ${st.score[t]}</b></div><div class="tw"><table class="t"><thead><tr><th>Skater</th><th>Pos</th><th>G</th><th>A</th><th>P</th><th>SOG</th><th>BLK</th><th>HIT</th><th>PPP</th><th>PIM</th><th>TOI</th></tr></thead><tbody>` +
      sk.map(([id, p]) => { const b = st.box[id] || {}; return `<tr><td>${esc(p.name)}</td><td>${esc(p.pos)}</td><td>${b.g || 0}</td><td>${b.a || 0}</td><td>${b.pts || 0}</td><td>${b.sog || 0}</td><td>${b.blk || 0}</td><td>${b.hits || 0}</td><td>${b.ppp || 0}</td><td>${b.pim || 0}</td><td>${mmss(st.toi[id] || 0)}</td></tr>`; }).join("") +
      `</tbody></table></div><div class="tw"><table class="t"><thead><tr><th>Goalie</th><th>SV</th><th>GA</th><th>SV%</th></tr></thead><tbody>` +
      gl.map(([id, p]) => { const b = st.box[id] || {}; return `<tr><td>${esc(p.name)}${st.relief[t] ? " (pulled)" : ""}</td><td>${b.sv || 0}</td><td>${b.ga || 0}</td><td>${b.sv + b.ga ? (b.sv / (b.sv + b.ga)).toFixed(3).replace(/^0/, "") : "–"}</td></tr>`; }).join("") + `</tbody></table></div></div>`;
  }
  $("boxTwo").innerHTML = h; $("boxNote").textContent = `The replayed game at ${PNAME(clockAt(S.t).p)} ${clockAt(S.t).txt}: scrub or play it on the Replay tab.`;
}
const PCOLS = [["name", "Player"], ["team", "Tm"], ["pos", "Pos"], ["line", "Line"], ["pp", "PP"], ["g", "G"], ["ast", "A"], ["pts", "P"], ["sog", "SOG"], ["blk", "BLK"], ["hits", "HIT"], ["ppp", "PPP"], ["anytime", "Goal %"], ["first", "1st goal"], ["sv", "SV"], ["ga", "GA"], ["win", "Win"]];
function renderPlayers() {
  $("plCtl").innerHTML = `<span class="note">Sim averages per game (all ${S.sm?.trials?.toLocaleString?.() || ""} sims), this game. Tap a column to sort.</span>`;
  const ps = (S.ins?.sim?.players || []).slice(), k = S.sortKey, d = S.sortDir;
  ps.sort((a, b) => { const x = a[k], y = b[k]; return (typeof x === "string" || typeof y === "string") ? d * String(x ?? "").localeCompare(String(y ?? "")) : d * ((x ?? -1) - (y ?? -1)); });
  const f = (k, v) => v === null || v === undefined ? "" : ["anytime", "first", "win"].includes(k) ? pct(v, 1) : typeof v === "number" ? v.toFixed(2) : esc(v);
  $("plT").innerHTML = `<table class="t"><thead><tr>${PCOLS.map(([k, l]) => `<th data-sort="${k}">${l}${S.sortKey === k ? (S.sortDir < 0 ? " ▾" : " ▴") : ""}</th>`).join("")}</tr></thead><tbody>` +
    ps.map(p => `<tr>${PCOLS.map(([k]) => `<td${["team", "pos"].includes(k) ? ' class="l"' : ""}>${f(k, p[k])}</td>`).join("")}</tr>`).join("") + `</tbody></table>`;
}

// ------------------------------------------------------------------ views + wiring
function showView() {
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === S.view)));
  document.querySelectorAll(".view").forEach(v => v.hidden = v.dataset.v !== S.view);
}
function renderView() {
  showView(); if (!S.sm) return;
  ({ replay: renderRight, best: renderBest, parlay: renderParlay, bet: renderBet, props: renderProps, scorers: renderScorers, ladders: renderLadders, box: renderBox, players: renderPlayers, results: renderResults })[S.view]?.();
}
$("tabs").addEventListener("click", e => { const b = e.target.closest("button[data-view]"); if (!b) return; S.view = b.dataset.view; renderView(); });
$("views").addEventListener("click", e => {
  const b = e.target.closest("[data-k]"); const th = e.target.closest("th[data-sort]");
  if (th) { const k = th.dataset.sort; S.sortDir = S.sortKey === k ? -S.sortDir : -1; S.sortKey = k; renderPlayers(); return; }
  if (!b) return;
  const seg = b.closest(".seg[data-k]"), btn = e.target.closest("button");
  if (seg && btn) { S[seg.dataset.k] = btn.dataset.v; renderView(); return; }
  if (b.dataset.k === "posOnly") S.posOnly = !S.posOnly; else if (b.dataset.k === "stat") S.stat = b.dataset.v;
  renderView();
});
$("rMode").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; S.rMode = b.dataset.v; $("rTitle").textContent = S.rMode === "bets" ? "Bets" : "Play-by-play";
  [...$("rMode").children].forEach(x => x.setAttribute("aria-pressed", String(x === b))); renderRight(); });
$("play").addEventListener("click", () => S.playing ? stop() : play());
$("prevG").addEventListener("click", () => jumpGoal(-1)); $("nextG").addEventListener("click", () => jumpGoal(1));
$("speed").addEventListener("change", e => S.speed = +e.target.value);
$("scrub").addEventListener("input", e => { stop(); seek(+e.target.value); });
$("gamePick").addEventListener("change", e => pick(e.target.value));
$("bookPick").addEventListener("change", e => { S.book = e.target.value || null; try { S.book ? localStorage.setItem("nhlBook", S.book) : localStorage.removeItem("nhlBook"); } catch (x) {} fillBooks(); renderView(); });
window.addEventListener("resize", () => { if (S.sm) renderStatic(), seek(S.t); });

async function boot() {
  try {
    const st = await loadData(true); $("upd").textContent = `Updated ${stamp(st)}`;
    if (!S.games.length) throw new Error("no games");
    fillPicker(); fillBooks(); pick(S.games[0].schedule_id);
  } catch (e) {
    $("views").innerHTML = `<div class="empty"><b>No NHL slate yet.</b><br>The sims and prices for today's games appear here once the EC2 run has pushed them (nhl_replay_data.json + nhl_prices.json).</div>`;
  }
}
boot();
})();
</script>
<script>
(function () {
  var b = document.getElementById("themeBtn"), root = document.documentElement; if (!b || b.hidden) return;
  function paint() { var d = root.getAttribute("data-theme") === "dark"; b.textContent = d ? "☀" : "☾"; b.setAttribute("aria-label", d ? "Light theme" : "Dark theme"); b.title = b.getAttribute("aria-label"); }
  b.addEventListener("click", function () { var t = root.getAttribute("data-theme") === "dark" ? "light" : "dark"; root.setAttribute("data-theme", t); try { localStorage.setItem("plTheme", t); } catch (e) {} paint(); });
  paint();
})();
</script>
