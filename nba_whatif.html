<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NBA What If</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
<style>
/* NBA What If: reads nba_whatif_data.json from next to itself (pushed by nba_nightly.py --mode whatif).
   Palette: the NBA Matchups desk / SQ Replay Room (light only, same look as the other desk pages in the repo). */
:root {
  --ground: #eef1f4; --surface: #ffffff; --ink: #16233f; --muted: #57647a; --faint: #8896a8; --rule: #d7dee6; --rule-strong: #b7c1cf;
  --panel2: #e7edf3; --accent: #e8632e; --accent-soft: #fcebe3;
  --good: #2f8f57; --good-soft: #dcf0e4; --bad: #c0392b; --bad-soft: #f8e1de;
  --board: #16233f; --board-ink: #ffffff; --board-muted: #a9b6cc; --board-rule: #2b3b5e;
  --grid: #d3dae4; --grid-strong: #a9b4c4; --head: #e3e9f1; --zebra: #f7f9fb; --zebra-solid: #f7f9fb;
  --text: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box }
html, body { margin: 0; background: var(--ground); color: var(--ink) }
body { font: 400 14px/1.4 var(--text); font-variant-numeric: tabular-nums }
button, select, input { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
[hidden] { display: none !important }
.app { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px;
  padding: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px)) }

/* top bar */
.top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap }
.brand { font-weight: 800; font-size: 20px; letter-spacing: .01em; white-space: nowrap }
.brand span { color: var(--accent) }
.upd { color: var(--muted); font-size: 12px }
.grow { flex: 1 }
.note { background: #fff6e0; border: 1px solid #efc66b; border-left: 4px solid #e0a020; border-radius: 6px; padding: 8px 12px; font-size: 13px; line-height: 1.4; color: var(--ink) }
.note b { font-weight: 800 }
.seg { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 7px; overflow: hidden; background: var(--surface) }
.seg button { border: 0; background: none; padding: 5px 12px; font-weight: 700; font-size: 13px; color: var(--muted) }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff }
@media (max-width: 640px) { .upd { width: 100% } }

/* tabs */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--rule-strong); overflow-x: auto; scrollbar-width: none }
.tabs::-webkit-scrollbar { display: none }
.tabs button { flex: 0 0 auto; background: none; border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px; padding: 7px 12px; font-weight: 700; color: var(--muted) }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent) }
.tabs.small button { padding: 5px 10px; font-size: 13px }

/* game chips */
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin }
.chip { flex: 0 0 auto; background: var(--surface); border: 1px solid var(--rule); border-radius: 9px; padding: 6px 12px; text-align: left; line-height: 1.2 }
.chip b { display: block; font-weight: 800 }
.chip small { color: var(--muted); font-size: 12px }
.chip[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink) }

/* board */
.board { background: var(--board); color: var(--board-ink); border-radius: 10px; padding: 10px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px }
.board .tm { font-weight: 800; font-size: 20px }
.board .meta { color: var(--board-muted); font-size: 12px }
.board .q { display: flex; flex-wrap: wrap; gap: 6px }
.qtag { background: var(--board-rule); border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 600 }
.qtag em { font-style: normal; color: #ffcf6b; margin-right: 4px; font-weight: 800 }

/* layout: scenario list + detail */
.split { display: grid; grid-template-columns: 210px 1fr; gap: 10px; align-items: start }
@media (max-width: 860px) { .split { grid-template-columns: 1fr } }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; min-width: 0 }
.lbl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 2px 0 6px }
.sclist { display: flex; flex-direction: column; gap: 4px }
@media (max-width: 860px) { .sclist { flex-direction: row; flex-wrap: wrap } .sclist .lbl { display: none } .sclist .sc { flex: 1 1 150px } }
.sc { background: none; border: 1px solid transparent; border-radius: 8px; padding: 6px 9px; text-align: left; display: flex; justify-content: space-between; gap: 8px; align-items: center; flex: 0 0 auto }
.sc:hover { background: var(--panel2) }
.sc[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent) }
.sc .who { font-weight: 700 }
.sc .t { color: var(--muted); font-size: 12px }
.sc .gain { color: var(--good); font-weight: 700; font-size: 12px; white-space: nowrap }
@media (min-width: 861px) { .sc { flex-direction: column; align-items: flex-start; gap: 2px } }

.head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; margin-bottom: 8px }
.head h2 { margin: 0; font-size: 19px; font-weight: 800 }
.stat { font-size: 13px; color: var(--muted) }
.stat b { color: var(--ink) }

/* tables */
.tw { overflow-x: auto; border: 1px solid var(--grid-strong); border-radius: 4px }
.tw + .lbl { margin-top: 14px }
table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px }
th, td { padding: 5px 7px; text-align: right; white-space: nowrap; border-right: 1px solid var(--grid); border-bottom: 1px solid var(--grid); background-clip: padding-box }
th:last-child, td:last-child { border-right: 0 }
tbody tr:last-child td { border-bottom: 0 }
tbody tr:nth-child(even) td { background-color: var(--zebra) }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink); font-weight: 800; background: var(--head); border-bottom: 1px solid var(--grid-strong); cursor: pointer; user-select: none }
/* frozen player column */
.pn, th.pnh { position: sticky; left: 0; z-index: 1; background: var(--surface); box-shadow: inset -1px 0 0 var(--grid-strong) }
tbody tr:nth-child(even) td.pn { background: var(--zebra-solid) }
th.pnh { z-index: 2; background: var(--head) }
th.l, td.l { text-align: left }
th[aria-sort] { color: var(--ink) }
th[aria-sort="descending"]::after { content: " ▾" } th[aria-sort="ascending"]::after { content: " ▴" }
td.xl { font-weight: 700 }
td.c .d, td.c .d.pos, td.c .d.neg { color: var(--ink); opacity: .75 }
.pos { color: var(--good); font-weight: 700 } .neg { color: var(--bad); font-weight: 700 } .zero { color: var(--faint) }
.d { font-size: 11px; margin-left: 4px }
.pn { font-weight: 700 }
.badge { display: inline-block; font-size: 10px; font-weight: 700; border-radius: 4px; padding: 0 5px; margin-left: 5px; vertical-align: 1px }
.b-big { background: #e4ecfa; color: #2a5cb8 } .b-new { background: var(--good-soft); color: var(--good) }
.b-st { background: #fff2d6; color: #8a6200 }
.empty { color: var(--muted); padding: 14px 4px }

/* minutes bars */
.bars { display: grid; grid-template-columns: minmax(110px, 180px) 1fr 74px; gap: 6px 10px; align-items: center }
.bar { height: 14px; background: var(--panel2); border-radius: 4px; overflow: hidden }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px }
.bars .n { font-weight: 700 } .bars .v { text-align: right; color: var(--muted); font-size: 12px }

/* roles */
.roles { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px }
.role { border: 1px solid var(--rule); border-radius: 9px; padding: 8px 10px }
.role .k { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted) }
.role .v { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; margin-top: 2px }
.role .arrow { color: var(--faint) }
.role .chg { color: var(--accent); font-weight: 800 }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted) }
.sub { display: block; color: var(--muted); font-size: 12px; font-weight: 500 }
.outrow { opacity: .55 } .outtag { font-size: 10px; font-weight: 700; color: var(--muted) }
.toggle { margin-bottom: 6px }
@media (max-width: 640px) {
  .hs { display: none }
  .chips { flex-wrap: wrap; overflow: visible } .chip { padding: 5px 10px }
  .tabs.small { flex-wrap: wrap; overflow: visible } .tabs.small button { padding: 5px 8px }
  table { font-size: 12.5px } th, td { padding: 5px 4px } th { font-size: 10px; letter-spacing: .02em }
  td .d { display: block; margin-left: 0; line-height: 1.1 }
  td.pn { white-space: normal; min-width: 92px; line-height: 1.2 }
  .tt td:not(.pn), .pt td:not(.pn), .st td:not(.pn) { font-size: 12px }
  .badge { display: none }
  .head h2 { font-size: 17px } .head .stat { width: 100% }
  .panel { padding: 8px }
  .bars { grid-template-columns: minmax(90px, 120px) 1fr 70px }
  .sclist .sc { flex: 1 1 100%; padding: 5px 8px }
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">What <span>If</span> · NBA</div>
    <div class="upd" id="upd">Loading…</div>
    <div class="grow"></div>
    <div class="seg" role="group" aria-label="Site">
      <button id="siteDK" aria-pressed="true">DK</button><button id="siteFD" aria-pressed="false">FD</button>
    </div>
  </div>
  <div class="note" role="note"><b>Automated estimates.</b> Final projections are curated by the RotoGrinders NBA team upon breaking news.</div>
  <section id="vGames"></section>
</div>
<script>
"use strict";
const S = { data: null, site: "dk", ti: 0, sit: null, sub: "team", sort: {} };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const f1 = x => x == null ? "—" : (+x).toFixed(1);
const f2 = x => x == null ? "—" : (+x).toFixed(2);
const money = x => x == null ? "—" : "$" + Math.round(x).toLocaleString();
function dlt(x, d = 1, suf = "") {
  if (x == null) return "";
  const v = +x, cls = Math.abs(v) < Math.pow(10, -d) / 2 ? "zero" : v > 0 ? "pos" : "neg";
  return `<span class="d ${cls}">${v > 0 ? "+" : ""}${v.toFixed(d)}${suf}</span>`;
}
// Excel-style conditional formats: green (#63BE7B) - white - red (#F8696B), per column over the rows shown
const XL = { g: [99, 190, 123], w: [255, 255, 255], r: [248, 105, 107] };
const mix = (a, b, t) => `rgb(${a.map((x, i) => Math.round(x + (b[i] - x) * Math.max(0, Math.min(1, t)))).join(",")})`;
const bg = c => c ? ` style="background:${c}"` : "";
const nums = (rows, f) => rows.map(f).filter(v => v != null && isFinite(v));
// diverging around 0: gains green, losses red, the biggest change in the column is the full color
function xlDiv(rows, f) { const m = Math.max(0, ...nums(rows, f).map(Math.abs));
  return v => v == null || !m ? "" : v >= 0 ? mix(XL.w, XL.g, v / m) : mix(XL.w, XL.r, -v / m); }
// 3-color scale: lowest red, median white, highest green
function xl3(rows, f) { const v = nums(rows, f).sort((a, b) => a - b); if (v.length < 2) return () => "";
  const lo = v[0], hi = v[v.length - 1], md = v[Math.floor(v.length / 2)];
  return x => x == null ? "" : x >= md ? (hi > md ? mix(XL.w, XL.g, (x - md) / (hi - md)) : "") : (md > lo ? mix(XL.w, XL.r, (md - x) / (md - lo)) : ""); }
// 2-color scale: lowest white, highest green
function xl2(rows, f) { const v = nums(rows, f); if (!v.length) return () => "";
  const lo = Math.min(...v), hi = Math.max(...v); return x => x == null || hi <= lo ? "" : mix(XL.w, XL.g, (x - lo) / (hi - lo)); }
// raw fantasy-point change, full size (the main number of the Chg column)
const chg = x => { if (x == null) return "—"; const v = +x; return `${v > 0 ? "+" : ""}${v.toFixed(1)}`; };
const lastName = n => { const p = String(n).split(" "); return p.length > 1 ? p.slice(1).join(" ") : n; };
const outLabel = sc => "If " + (sc.out_names.length === 1 ? sc.out_names[0] : sc.out_names.map(lastName).join(" + ")) +
  (sc.out_names.length > 1 ? " are out" : " is out");
const site = () => S.site, SITE = () => S.site.toUpperCase();

async function load() {
  try {
    const r = await fetch("nba_whatif_data.json", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    S.data = await r.json();
  } catch (e) { $("upd").textContent = "nba_whatif_data.json not loaded (" + e.message + ")"; return; }
  const d = S.data;
  $("upd").textContent = `${d.date} · updated ${d.updated_et} · ${(d.sims || 0).toLocaleString()} sims per scenario`;
  render();
}

// ---------------------------------------------------------------------------------------------- team view
// Every team in a game with a questionable player. Situations: as projected, each of its own OUT cases, then the
// other team's OUT cases (how this team changes when the opponent is missing someone).
function teamList() {
  const out = [];
  (S.data.games || []).forEach((g, gi) => g.teams.forEach(t => {
    const own = [], opp = [];
    g.scenarios.forEach((sc, si) => (sc.team === t ? own : opp).push(si));
    out.push({ gi, t, g, own, opp, q: g.questionable.filter(q => q.team === t) });
  }));
  return out.filter(x => x.own.length > 0);   // only teams with a questionable player of their own
}
function renderTeams() {
  const teams = teamList();
  if (!teams.length) { $("vGames").innerHTML = `<div class="panel empty">No questionable players today.</div>`; return; }
  S.ti = Math.min(S.ti || 0, teams.length - 1);
  const T = teams[S.ti], g = T.g;
  const sits = T.own.map(si => ({ key: si, label: outLabel(g.scenarios[si]) }));
  if (!sits.some(x => x.key === S.sit)) S.sit = sits.length ? sits[0].key : null;
  const opp = g.teams.find(x => x !== T.t);
  const chips = teams.map((x, i) => `<button class="chip" data-i="${i}" aria-pressed="${i === S.ti}"><b>${esc(x.t)}</b>
    <small>vs ${esc(x.g.teams.find(y => y !== x.t))} · ${x.q.length} Q</small></button>`).join("");
  const board = `<div class="board"><div><div class="tm">${esc(T.t)}</div>
      <div class="meta">vs ${esc(opp)} · ${esc(g.tip_et || "")}</div></div>
    <div class="grow"></div><div><div class="meta">Questionable</div><div class="q">${T.q.length ? T.q.map(q =>
      `<span class="qtag"><em>Q</em>${esc(q.name)}</span>`).join("") : `<span class="meta">none on ${esc(T.t)}</span>`}</div></div></div>`;
  const list = `<div class="panel"><div class="sclist"><div class="lbl">Situations</div>${sits.map(x => {
      const div = "";
      const sc = g.scenarios[x.key];
      const top = sc && !sc.error ? [...sc.players].filter(p => p.team === T.t).sort((a, b) => (b[site() + "_d"] ?? -99) - (a[site() + "_d"] ?? -99))[0] : null;
      return `${div}<button class="sc" data-k="${x.key}" aria-pressed="${x.key === S.sit}"><span><span class="who">${esc(x.label)}</span>
        ${sc && sc.freed_min != null ? `<br><span class="t">frees ${f1(sc.freed_min)} min</span>` : ""}</span>
        ${top && (top[site() + "_d"] ?? 0) > 0.25 ? `<span class="gain">${esc(lastName(top.name))} +${f1(top[site() + "_d"])}</span>` : sc && sc.error ? `<span class="neg">failed</span>` : ""}</button>`; }).join("")}</div></div>`;
  $("vGames").innerHTML = `<div class="chips">${chips}</div>${board}<div class="split">${list}<div class="panel" id="detail"></div></div>`;
  $("vGames").querySelectorAll(".chip").forEach(b => b.onclick = () => { S.ti = +b.dataset.i; S.sit = null; renderTeams(); });
  $("vGames").querySelectorAll(".sc").forEach(b => b.onclick = () => { S.sit = +b.dataset.k; renderTeams(); });
  if (S.sit == null) { $("detail").innerHTML = `<div class="empty">No situations for ${esc(T.t)}.</div>`; return; }
  renderDetail(g, T.t, g.scenarios[S.sit]);
}

function renderDetail(g, team, sc) {
  const el = $("detail");
  if (sc && sc.error) { el.innerHTML = `<div class="head"><h2>${esc(outLabel(sc))}</h2></div><div class="empty">This situation did not run: ${esc(sc.error)}</div>`; return; }
  const own = sc && sc.team === team;
  const title = sc ? outLabel(sc) + (own ? "" : ` (${sc.team})`) : "As projected";
  const teams = sc ? sc.teams : (g.base.teams || []).map(t => ({ ...t, pts_d: null, win_d: null }));
  const tstr = (teams || []).filter(t => t.abbr === team).map(t => `<span class="stat">${esc(t.abbr)} <b>${f1(t.pts)}</b>${dlt(t.pts_d)} pts · win <b>${f1(t.win * 100)}%</b>${dlt(t.win_d)}</span>`).join("");
  const subs = [["team", `${team} projection`]];
  if (sc) subs.push(["props", `Props (${goodProps(sc, team).length})`]);
  if (!subs.some(x => x[0] === S.sub)) S.sub = "team";
  el.innerHTML = `<div class="head"><h2>${esc(title)}</h2>${tstr}</div>
    <div class="tabs small" role="tablist">${subs.map(([k, t]) => `<button role="tab" data-k="${k}" aria-selected="${S.sub === k}">${esc(t)}</button>`).join("")}</div>
    <div id="sub" style="margin-top:8px"></div>`;
  el.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { S.sub = b.dataset.k; renderDetail(g, team, sc); });
  const sub = $("sub");
  if (S.sub === "team") sub.innerHTML = teamTable(g, team, sc);
  else sub.innerHTML = propsView(sc, team);
  sub.querySelectorAll("th[data-k]").forEach(h => h.onclick = () => {
    const t = h.closest("table").dataset.t, cur = S.sort[t] || [], k = h.dataset.k;
    S.sort[t] = [k, cur[0] === k ? -cur[1] : (k === "name" || k === "pick" ? 1 : -1)]; renderDetail(g, team, sc); });
}

function sorter(t, def, get) {
  const key = S.sort[t] || def;
  return { key, cmp: (a, b) => { const x = get(a, key[0]), y = get(b, key[0]); return (x < y ? -1 : x > y ? 1 : 0) * key[1]; } };
}
function th(t, key, k, label, left, cls) {
  return `<th data-k="${k}" class="${left ? "l" : ""} ${cls || ""}" ${key[0] === k ? `aria-sort="${key[1] < 0 ? "descending" : "ascending"}"` : ""}>${label}</th>`;
}

// the whole team in one situation, one site at a time (DK / FD toggle). Two thin tables: the fantasy view and the box
// score. Every number cell is colored Excel-style by its change (green gain, red loss); OUT players listed last.
const cell = (v, c, extra) => `<td class="c${extra ? " " + extra : ""}"${bg(c)}>${v}</td>`;
function teamRows(sc, team, t, def) {
  let rows = sc.players.filter(p => p.team === team);
  const { key, cmp } = sorter(t, def, (p, k) => k === "name" ? p.name : (p[k] ?? -999));
  return { key, rows: rows.sort(cmp) };
}
const pname = p => `<td class="l pn">${esc(p.name)}${p.starter ? `<span class="badge b-st">S</span>` : ""}</td>`;
function teamTable(g, team, sc) {
  const s = site(), t = "team";
  const { key, rows } = teamRows(sc, team, t, [s, -1]);
  const outs = sc.team === team ? g.base.players.filter(p => sc.out.includes(p.rg_id)) : [];
  const cMin = xlDiv(rows, p => p.min_d), cChg = xlDiv(rows, p => p[s + "_d"]), cVal = xl3(rows, p => p[s + "_val"]), cSm = xlDiv(rows, p => p[s + "_smash_d"]);
  return `<div class="tw"><table class="tt" data-t="${t}"><thead><tr>${th(t, key, "name", "Player", 1, "pnh")}${th(t, key, "min", "Min")}
    ${th(t, key, s, SITE())}${th(t, key, s + "_d", "Chg")}${th(t, key, s + "_val", "Value")}${th(t, key, s + "_smash", "Smash")}</tr></thead><tbody>
    ${rows.map(p => `<tr>${pname(p)}${cell(f1(p.min) + dlt(p.min_d), cMin(p.min_d))}<td>${f1(p[s])}</td>
      ${cell(chg(p[s + "_d"]), cChg(p[s + "_d"]), "xl")}${cell(f2(p[s + "_val"]), cVal(p[s + "_val"]))}
      ${cell(f1(p[s + "_smash"]) + "%" + dlt(p[s + "_smash_d"]), cSm(p[s + "_smash_d"]))}</tr>`).join("")}
    ${outs.map(p => `<tr class="outrow"><td class="l pn"><s>${esc(p.name)}</s> <span class="outtag">OUT</span></td><td>0.0${dlt(-p.min)}</td>
      <td>—</td><td>—</td><td>—</td><td>—</td></tr>`).join("")}
    </tbody></table></div>
    <div class="lbl">Box score</div>${statsTable(sc, team)}`;
}
function statsTable(sc, team) {
  const s = site(), t = "stats";
  const { key, rows } = teamRows(sc, team, t, ["pts", -1]);
  const cols = [["pts", "Pts"], ["reb", "Reb"], ["ast", "Ast"], ["fg3m", "3PM"]];
  const C = Object.fromEntries(cols.map(([k]) => [k, xlDiv(rows, p => p[k + "_d"])])), cU = xlDiv(rows, p => p.usg_d);
  return `<div class="tw"><table class="st" data-t="${t}"><thead><tr>${th(t, key, "name", "Player", 1, "pnh")}
    ${cols.map(([k, l]) => th(t, key, k, l)).join("")}${th(t, key, "usg", "Usg")}${th(t, key, s + "_sal", "Salary")}</tr></thead><tbody>
    ${rows.map(p => `<tr>${pname(p)}${cols.map(([k]) => cell(f1(p[k]) + dlt(p[k + "_d"]), C[k](p[k + "_d"]))).join("")}
      ${cell(f1(p.usg) + "%" + dlt(p.usg_d), cU(p.usg_d))}<td>${money(p[s + "_sal"])}</td></tr>`).join("")}
    </tbody></table></div>`;
}

// props that are a good play with the player(s) out: the pick, its edge, and the projected stat (sim mean with them out)
const GOOD = 5;   // edge % (sim vs the books' no-vig price) for a good play
const STAT = { "Points": ["PTS", ["pts"]], "Rebounds": ["REB", ["reb"]], "Assists": ["AST", ["ast"]], "3PM": ["3PM", ["fg3m"]],
  "Pts+Reb+Ast": ["PRA", ["pts", "reb", "ast"]], "Pts+Reb": ["P+R", ["pts", "reb"]], "Pts+Ast": ["P+A", ["pts", "ast"]], "Reb+Ast": ["R+A", ["reb", "ast"]],
  "Blocks": ["BLK", ["blk"]], "Steals": ["STL", ["stl"]], "Turnovers": ["TO", ["tov"]] };
function goodProps(sc, team) {
  const P = Object.fromEntries((sc.players || []).map(p => [p.rg_id, p]));
  return (sc.props || []).filter(p => p.team === team && p.edge >= GOOD).map(p => {
    const [ab, ks] = STAT[p.stat] || [p.stat, []], pl = P[p.rg_id];
    const vals = pl ? ks.map(k => pl[k]) : [];
    const proj = vals.length && vals.every(v => v != null) ? vals.reduce((a, b) => a + b, 0) : null;
    // edge change on this same pick vs as projected: same side = edge - before; side flipped = the over-probability move
    const de = p.base_side === p.side && p.base_edge != null ? p.edge - p.base_edge : p.move == null ? null : p.side === "Over" ? p.move : -p.move;
    return { ...p, ab, proj, de, pick: `${ab} ${p.side === "Over" ? "o" : "u"}${p.line}` };
  });
}
function propsView(sc, team) {
  let rows = goodProps(sc, team);
  if (!rows.length) return `<div class="empty">No props are a good play for ${esc(team)} in this situation.</div>`;
  const t = "props", { key, cmp } = sorter(t, ["edge", -1], (p, k) => k === "name" ? p.name + p.ab : (p[k] ?? -999));
  rows = [...rows].sort(cmp);
  const cE = xl2(rows, p => p.edge);
  return `<div class="tw"><table class="pt" data-t="props"><thead><tr>${th(t, key, "name", "Player", 1, "pnh")}${th(t, key, "pick", "Prop", 1)}
    ${th(t, key, "proj", "Proj")}${th(t, key, "edge", "Edge")}</tr></thead><tbody>
    ${rows.map(p => `<tr><td class="l pn">${esc(p.name)}</td><td class="l"><b>${esc(p.pick)}</b></td><td>${f1(p.proj)}</td>
      ${cell(f1(p.edge) + "%" + (p.de == null ? "" : dlt(p.de, 1, "%").replace('">', '">(').replace("</span>", ")</span>")), cE(p.edge), "xl")}</tr>`).join("")}
    </tbody></table></div>`;
}

// ---------------------------------------------------------------------------------------------- shell
function render() {
  if (!S.data) return;
  $("siteDK").setAttribute("aria-pressed", S.site === "dk"); $("siteFD").setAttribute("aria-pressed", S.site === "fd");
  renderTeams();
}
$("siteDK").onclick = () => { S.site = "dk"; render(); };
$("siteFD").onclick = () => { S.site = "fd"; render(); };
load();
</script>
</body>
