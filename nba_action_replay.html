<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Action Replay</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one screen, never scrolls. Top bar -> navy scoreboard -> view tabs -> the one view on screen. Long lists page
   (‹ 1/3 ›) instead of scrolling; lists open a detail panel (beside on desktop, over the list on phones).
   Palette: the NBA Matchups desk (light only, on purpose: same look as the desk pages in the repo). */
:root {
  --ground: #eef0f3; --surface: #ffffff; --ink: #1d1d25; --muted: #57647a; --faint: #8896a8; --rule: #d7dee6; --rule-strong: #b7c1cf;
  --panel2: #e9ebef; --accent: #00c458; --accent-soft: #e3f8ec; --accent-ink: #1d1d25;
  --good: #2f8f57; --good-soft: #dcf0e4; --bad: #c0392b; --bad-soft: #f8e1de;
  --board: #1d1d25; --board-ink: #ffffff; --board-muted: #a9abb8; --board-rule: #383a46;
  --court: #f4efe6; --court-line: #c4b8a3; --paint: #ece4d6;
  --t0: #2a6fd6; --t1: #d4561f;
  --text: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ground); color: var(--ink) }
body { font: 400 14px/1.4 var(--text); font-variant-numeric: tabular-nums }
button, select, input { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
[hidden] { display: none !important }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }

.app { height: 100%; height: 100dvh; display: flex; flex-direction: column; gap: 8px; max-width: 1440px; margin: 0 auto;
  padding-top: max(10px, env(safe-area-inset-top, 0px)); padding-bottom: max(10px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }

/* top bar */
.top { display: flex; align-items: center; gap: 10px; min-width: 0 }
.brand { font-weight: 800; font-size: 18px; letter-spacing: .01em; white-space: nowrap }
.brand span { color: var(--ink) }
.brand { display: flex; align-items: center; gap: 8px }
.brand .an { display: block; height: 26px; border-radius: 5px }
@media (max-width: 520px) { .brand .an { height: 18px } .brand span { display: none } }
/* Action Replay: the standard sim only (Replay and Box) */
.tabs button[data-view="players"] { display: none }
.top .grow { flex: 1; min-width: 0 }
.top select { max-width: 100%; width: 100%; background: var(--surface); border: 1px solid var(--rule-strong); border-radius: 6px; padding: 5px 8px; min-height: 32px }
.upd { color: var(--muted); font-size: 12px; white-space: nowrap }
.filebtn { position: relative; overflow: hidden; background: var(--surface); border: 1px solid var(--rule-strong); border-radius: 6px; padding: 5px 10px; font-size: 13px; white-space: nowrap }
.filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer }
@media (max-width: 760px) { .upd { display: none } .brand { font-size: 16px } }

/* scoreboard */
.board { background: var(--board); color: var(--board-ink); border-radius: 10px; padding: 8px 16px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px }
.side { display: flex; align-items: center; gap: 12px; min-width: 0 }
.side.r { justify-content: flex-end; text-align: right }
.tn { font-weight: 800; font-size: 20px; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.tn i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 7px; vertical-align: 1px }
.side.r .tn i { margin: 0 0 0 7px }
.tmeta { color: var(--board-muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.sc { font-weight: 800; font-size: 38px; line-height: 1; min-width: 2.1ch; text-align: center }
.clk { text-align: center; line-height: 1.15 }
.clk b { display: block; font-weight: 700; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--board-muted) }
.clk strong { font-weight: 700; font-size: 22px }
.clk small { display: block; color: var(--board-muted); font-size: 11px }
@media (max-width: 760px) {
  .board { padding: 6px 10px; gap: 6px } .tn { font-size: 15px } .sc { font-size: 28px } .clk strong { font-size: 17px }
  .clk small, .tmeta { display: none } .side { gap: 8px }
}

/* tabs */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--rule-strong); overflow-x: auto; scrollbar-width: none; flex: 0 0 auto }
.tabs::-webkit-scrollbar { display: none }
.tabs button { flex: 0 0 auto; background: none; border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px; padding: 6px 12px; font-weight: 700; font-size: 14px; color: var(--muted) }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent) }
.tabs button:disabled { opacity: .4; cursor: default }

/* views */
.views { flex: 1; min-height: 0; position: relative }
.view { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 8px; min-height: 0 }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 6px }
.fill { flex: 1; min-height: 0; overflow: hidden; position: relative }
.lbl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted) }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; min-width: 0 }
.row.wrap { flex-wrap: wrap }
.spacer { flex: 1 }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--rule-strong); border-radius: 6px; overflow: hidden; flex: 0 0 auto }
.seg button { border: 0; background: none; padding: 4px 10px; font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff }
.pager { display: flex; align-items: center; justify-content: flex-end; gap: 8px; font-size: 13px; color: var(--muted); height: 30px; flex: 0 0 auto }
.pager button { width: 30px; height: 28px; border: 1px solid var(--rule-strong); border-radius: 6px; background: var(--surface); font-size: 16px; line-height: 1 }
.pager button:disabled { opacity: .35; cursor: default }
.chiprow { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: 0 0 auto; align-items: center }
.chiprow::-webkit-scrollbar { display: none }
.chip { flex: 0 0 auto; border: 1px solid var(--rule-strong); background: var(--surface); border-radius: 999px; padding: 2px 10px; font-size: 12px; height: 26px; white-space: nowrap }
.chip[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink) }
.chip small { color: var(--faint); margin-left: 3px }
.chip[aria-pressed="true"] small { color: var(--board-muted) }
.empty-note { color: var(--muted); font-size: 13px; padding: 8px 0 }

/* replay */
.rp { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 8px; height: 100% }
.rp-left { display: flex; flex-direction: column; gap: 6px; min-height: 0 }
.courtbox { flex: 1; min-height: 120px; position: relative; display: flex; align-items: center; justify-content: center }
#court { width: 100%; height: 100%; display: block; touch-action: manipulation }
#court .floor { fill: var(--court) }
#court .paint { fill: var(--paint) }
#court .ln { fill: none; stroke: var(--court-line); stroke-width: .17 }
#court .half-lbl { font-family: var(--text); font-weight: 800; font-size: 4.6px; fill: var(--court-line); opacity: .55; letter-spacing: .04em }
.mk.t0 { --c: var(--t0) } .mk.t1 { --c: var(--t1) }
.mk .made { fill: var(--c); stroke: var(--court); stroke-width: .22 }
.mk .miss { stroke: var(--c); stroke-width: .3; stroke-linecap: round; fill: none }
.mk .hit { fill: transparent }
.mk.dim { opacity: .13 }
.mk:hover .made { stroke: var(--ink) }
.ball { fill: var(--ink) } .pulse { fill: none; stroke: var(--ink); stroke-width: .2 }
.pop { font-family: var(--text); font-weight: 800; font-size: 3px; fill: var(--ink) }
.lastlbl { font-family: var(--text); font-weight: 600; font-size: 1.7px; fill: var(--ink); paint-order: stroke; stroke: var(--court); stroke-width: .5px }
#court .logo circle { fill: var(--board) }
#dots { transition: opacity .6s } #dots.gone { opacity: 0; pointer-events: none }
.dot.t0 { --c: var(--t0) } .dot.t1 { --c: var(--t1) }
.dot circle { fill: var(--c); stroke: #fff; stroke-width: .28 }
.dot text { font-family: var(--text); font-weight: 800; font-size: 1.05px; fill: #fff; text-anchor: middle; pointer-events: none }
#bdot { stroke: #fff; stroke-width: .16 }
@media (max-width: 760px) { .dot text { display: none } }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: #fff; font-size: 12px; padding: 6px 8px; border-radius: 6px; max-width: 230px; z-index: 5; line-height: 1.35 }
.ctl { display: flex; align-items: center; gap: 6px; flex: 0 0 auto }
.ctl .btn { height: 32px; border: 1px solid var(--rule-strong); background: var(--surface); border-radius: 6px; padding: 0 10px; font-weight: 600; font-size: 13px; white-space: nowrap }
.ctl .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); min-width: 64px }
.ctl select { height: 32px; border: 1px solid var(--rule-strong); border-radius: 6px; background: var(--surface); padding: 0 6px; font-size: 13px }
.scrub { flex: 1; min-width: 80px; display: flex; flex-direction: column }
#scrub { width: 100%; accent-color: var(--accent); margin: 0 }
.ticks { position: relative; height: 12px; font-size: 10px; color: var(--faint) }
.ticks span { position: absolute; transform: translateX(-50%) }
.legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); align-items: center; flex: 0 0 auto; white-space: nowrap; overflow: hidden }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: 0 }
.rp-right { display: flex; flex-direction: column; gap: 8px; min-height: 0 }
.five { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; flex: 0 0 auto }
.five ol { list-style: none; margin: 3px 0 0; padding: 0 }
.five li { display: flex; justify-content: space-between; gap: 6px; font-size: 12px; height: 20px; align-items: center; border-bottom: 1px solid var(--rule) }
.five li span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.five li span:last-child { color: var(--muted); white-space: nowrap }
.feed { list-style: none; margin: 0; padding: 0 }
.feed li { height: 44px; display: grid; grid-template-columns: 50px 4px minmax(0, 1fr) 52px; gap: 7px; align-items: center; border-bottom: 1px solid var(--rule); font-size: 12.5px }
.feed .tm { color: var(--faint); font-size: 11px }
.feed .bar { width: 4px; height: 30px; border-radius: 2px }
.feed .tx { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.3 }
.feed .sc2 { text-align: right; color: var(--muted); font-size: 12px }
.feed li.big .tx { font-weight: 600 }
.feed li.now { background: var(--accent-soft) }
.feed li.pe { grid-template-columns: 1fr; text-align: center; font-weight: 700; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em }
.pt { font-size: 10.5px; font-weight: 600; color: var(--muted); border: 1px solid var(--rule-strong); border-radius: 4px; padding: 0 4px; margin-left: 4px; white-space: nowrap }
@media (max-width: 760px) {
  .rp { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) }
  .courtbox { flex: 0 0 auto; aspect-ratio: 97 / 53; min-height: 0; max-width: 100% }
  .five, .legend { display: none } .ctl .speed { display: none }
}

/* tables */
table.t { border-collapse: collapse; width: 100%; table-layout: auto }
.t th { font-size: 11px; font-weight: 600; color: var(--muted); text-align: right; padding: 0 6px; height: 28px; border-bottom: 1px solid var(--rule-strong); white-space: nowrap }
.t td { text-align: right; padding: 0 6px; height: 30px; border-bottom: 1px solid var(--rule); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; font-size: 13px }
.t th:first-child, .t td:first-child { text-align: left }
.t th.sort { cursor: pointer } .t th.sort:hover { color: var(--ink) }
.t tr.on td:first-child { font-weight: 700 }
.t tr.on td:first-child::after { content: " •"; color: var(--accent) }
.t .tsw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: 0 }
.up { color: var(--good) } .down { color: var(--bad) }
.div { position: relative; height: 10px; width: 90px; display: inline-block; vertical-align: middle; background: linear-gradient(var(--rule-strong), var(--rule-strong)) center / 1px 100% no-repeat }
.div i { position: absolute; top: 1px; height: 8px; border-radius: 2px }
.div i.p { background: var(--good) } .div i.n { background: var(--bad) }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; height: 100% }
@media (max-width: 760px) { .two { grid-template-columns: minmax(0, 1fr) } .hide-m { display: none } .t td { max-width: 140px } }

/* master-detail */
.md { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 8px; height: 100% }
.list { list-style: none; margin: 0; padding: 0 }
.list li { height: 56px; border-bottom: 1px solid var(--rule); display: flex; align-items: center; gap: 10px; padding: 0 6px; cursor: pointer }
.list li:hover { background: var(--panel2) }
.list li[aria-selected="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent) }
.list .who { flex: 1; min-width: 0 }
.list .who b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.list .who > span { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.list .nums { text-align: right; font-size: 12px; color: var(--muted); white-space: nowrap }
.list .nums b { color: var(--ink); font-size: 14px }
.sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; flex: 0 0 auto }
.sig { display: inline-flex; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 1px 6px; border-radius: 999px; white-space: nowrap }
.sig.up { background: var(--good-soft); color: var(--good) } .sig.down { background: var(--bad-soft); color: var(--bad) } .sig.nt { background: var(--panel2); color: var(--muted) }
.tag { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 1px 6px; border-radius: 999px; white-space: nowrap }
.tag.obs { background: var(--good-soft); color: var(--good) } .tag.np { background: var(--bad-soft); color: var(--bad) }
.detail { overflow: hidden }
.detail h3 { margin: 0; font-size: 17px; font-weight: 800 }
.detail .sub { color: var(--muted); font-size: 12px }
.kp { display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted) }
.kp b { color: var(--ink); font-size: 15px; font-weight: 700 }
.rs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px }
.rs li { font-size: 13px; display: flex; flex-direction: column; gap: 3px }
.rs .sig { align-self: flex-start }
.rs .tested { font-size: 12px; color: var(--muted); border-left: 2px solid var(--rule-strong); padding-left: 8px }
.back { display: none; border: 1px solid var(--rule-strong); background: var(--surface); border-radius: 6px; padding: 3px 10px; font-size: 13px; font-weight: 600; width: fit-content }
@media (max-width: 760px) {
  .md { grid-template-columns: minmax(0, 1fr) }
  .md .detail { position: absolute; inset: 0; z-index: 3 }
  .md.closed .detail { display: none }
  .back { display: inline-block }
}
.lines-t { max-width: 640px }
.emptyapp { position: absolute; inset: 0; z-index: 10; background: var(--ground); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; height: 100%; color: var(--muted); text-align: center }
.emptyapp b { color: var(--ink); font-size: 18px }

/* insights (nbasq_insights): betting, props, first basket, ladders, DFS */
.warn { flex: 0 0 auto; background: #fff6e0; border: 1px solid #e6c36a; color: #5c4300; border-radius: 8px; padding: 5px 10px; font-size: 12.5px }
.warn summary { cursor: pointer; list-style: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.warn summary::-webkit-details-marker { display: none }
.warn[open] summary { white-space: normal }
.warn .q { font-weight: 800; background: #f2d27a; border-radius: 4px; padding: 0 4px; font-size: 11px }
.warn .wd { margin-top: 5px; display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; color: var(--ink) }
.why { flex: 0 0 auto; font-size: 13.5px; line-height: 1.45; border-left: 3px solid var(--accent); padding: 1px 0 1px 10px; max-height: 4.4em; overflow: hidden }
.tested-note { flex: 0 0 auto; font-size: 11.5px; color: var(--muted); line-height: 1.35; max-height: 2.8em; overflow: hidden }
.sig.lean { background: #fdf0d5; color: #8a5a00 } .sig.unc { background: #ece9e1; color: #6d5e3a }
.tw { overflow-x: auto; overflow-y: hidden; max-width: 100% }
.tw .t th:first-child, .tw .t td:first-child { position: sticky; left: 0; background: var(--surface); z-index: 1 }
.t td small { color: var(--faint); font-size: 11px; margin-left: 3px }
.ins-two { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 8px; flex: 1; min-height: 0 }
@media (max-width: 760px) { .ins-two { grid-template-columns: minmax(0, 1fr) } .ins-two > .panel + .panel { display: none } .why { max-height: 6em } }
.lad { display: flex; align-items: center; gap: 8px; height: 56px; border-bottom: 1px solid var(--rule); padding: 0 4px; min-width: 0 }
.lad .who { flex: 0 0 170px; min-width: 0 } .lad .who b { display: block; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.lad .who span { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.rungs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0 }
.rungs::-webkit-scrollbar { display: none }
.rung { flex: 0 0 auto; border: 1px solid var(--rule-strong); border-radius: 6px; padding: 2px 8px; font-size: 12px; line-height: 1.25; text-align: center; background: var(--surface) }
.rung b { display: block; font-size: 13px } .rung span { color: var(--muted); font-size: 11px }
.rung.hot { border-color: var(--good); background: var(--good-soft) }
.lad .ev { flex: 0 0 auto; text-align: right; font-size: 12px; color: var(--muted) } .lad .ev b { display: block; color: var(--good); font-size: 14px }
@media (max-width: 760px) { .lad .who { flex-basis: 110px } .lad .ev { display: none } }
.tfirst { flex: 0 0 auto; display: flex; gap: 14px; align-items: center; font-size: 13px; color: var(--muted); flex-wrap: wrap }
.tfirst b { color: var(--ink) }
.splitbar { flex: 1; min-width: 120px; max-width: 320px; height: 10px; border-radius: 5px; overflow: hidden; display: flex }
.splitbar i { display: block; height: 100% }
.lad .tsw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; flex: 0 0 auto }
.mobile-only { display: none }
@media (max-width: 760px) { .mobile-only { display: inline-flex } .ins-two[data-part="alt"] > .panel:first-child { display: none } .ins-two[data-part="alt"] > .panel + .panel { display: flex } }

/* ---- v2: dark look, neutral blacks (Chris 2026-11-07); the light court stays ---- */
:root {
  --ground: #08080a; --surface: #121214; --ink: #f2f2f3; --muted: #a3a3ab; --faint: #6f6f78; --rule: #232327; --rule-strong: #323237;
  --panel2: #1b1b1e; --accent-soft: color-mix(in srgb, var(--accent) 20%, transparent);
  --good: #3fcf7e; --good-soft: rgba(63, 207, 126, .14); --bad: #ff6f5e; --bad-soft: rgba(255, 111, 94, .14);
  --board: #0d0d0f; --board-ink: #ffffff; --board-muted: #9b9ba3; --board-rule: #2a2a2e;
  --court: #f4efe6; --court-line: #c4b8a3; --paint: #ece4d6;
  --t0: #2563eb; --t1: #ea580c;
  color-scheme: dark;
}
.seg button[aria-pressed="true"], .chip[aria-pressed="true"] { color: var(--ground) }
.tip { background: #f2f2f3; color: #08080a }
.ball, #bdot { fill: #e8761c } .pulse { stroke: #e8761c }
.lastlbl { fill: #121214 } .pop { fill: #121214 } #court .half-lbl { fill: #b8a98f; opacity: .5 }
#court .logo circle { fill: #0a0a0a }
.board { border: 1px solid var(--rule) }
.panel { border-color: var(--rule) }
.warn { background: #241d0c; border-color: #57461a; color: #f2d58a } .warn .q { background: #57461a; color: #ffe7a6 } .warn .wd { color: var(--ink) }
.sig.lean { background: rgba(240, 180, 60, .15); color: #f0b43c } .sig.unc { background: rgba(203, 191, 154, .12); color: #cbbf9a }
.rung.hot { border-color: var(--good); background: var(--good-soft) }
#teamChips, #ptChips, #legend { display: none !important }
#court .half-lbl { opacity: .35 }
/* on-floor box */
.five { gap: 10px; grid-template-columns: minmax(0, 1fr) !important }
.five table { width: 100%; border-collapse: collapse }
.five th { font-size: 10.5px; font-weight: 700; color: var(--muted); text-align: right; padding: 0 4px; height: 20px; letter-spacing: .04em }
.five th:first-child { text-align: left; text-transform: uppercase; letter-spacing: .07em; font-size: 11px }
.five td { font-size: 13px; text-align: right; padding: 0 4px; height: 23px; border-top: 1px solid var(--rule); white-space: nowrap }
.five td:first-child { text-align: left; max-width: 0; width: 100%; overflow: hidden; text-overflow: ellipsis }
.five td b { font-weight: 800 }
.five tr.hot td:first-child { color: var(--accent) }
/* moments */
.moments { list-style: none; margin: 0; padding: 0 }
.moments li { height: 48px; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 9px; align-items: center; border-bottom: 1px solid var(--rule) }
.moments .mt { min-width: 0 } .moments .mtt { display: block; font-size: 12.5px; font-weight: 800; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.moments .mt span b { color: var(--accent) }
.moments .mt span { display: block; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.moments .mc { font-size: 11px; color: var(--faint); text-align: right; white-space: nowrap }
.badge { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 9.5px; font-weight: 800; color: #fff; letter-spacing: .02em; flex: 0 0 auto;
  box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .18) }
.popout { position: absolute; left: 50%; top: 7%; transform: translate(-50%, -8px); opacity: 0; pointer-events: none; z-index: 6; min-width: min(78%, 360px); max-width: 92%;
  display: grid; grid-template-columns: 6px auto minmax(0, 1fr); align-items: center; gap: 0 12px; background: rgba(8, 8, 10, .94); border: 1px solid rgba(255, 255, 255, .12);
  border-radius: 10px; padding: 0 16px 0 0; box-shadow: 0 10px 30px rgba(0, 0, 0, .45); transition: opacity .22s, transform .22s; overflow: hidden }
.popout.on { opacity: 1; transform: translate(-50%, 0) }
.popout .stripe { align-self: stretch } .popout .badge { width: 40px; height: 40px; font-size: 12px; margin: 10px 0 }
.popout .pt1 { font-size: 17px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: #fff; line-height: 1.15 }
.popout .pt2 { font-size: 12.5px; color: #c7d1df; line-height: 1.3; margin-top: 2px }
.popout .pt2 b { color: var(--accent) }
@media (max-width: 760px) { .popout { top: 4%; min-width: 86% } .popout .pt1 { font-size: 14px } .popout .pt2 { font-size: 11.5px } .popout .badge { width: 32px; height: 32px; font-size: 10.5px; margin: 7px 0 } }
.dot.jumper circle { stroke: #f28c28; stroke-width: .42 }
@media (max-width: 760px) {
  .rp { grid-template-rows: auto auto minmax(0, 1fr) }
  .five { display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 8px } .five td { height: 19px; font-size: 12px } .five th { height: 17px }
  .moments li { height: 42px }
}
</style>
</head>

const SIMKEY = "std";   // which sims' insights this page shows: "sq" (SQ page) or "std" (Action page)

// ------------------------------------------------------------------ insights (nbasq_insights in the nightly's matchups mode; Chris 2026-11-06)
// Each game's matchup file carries insights.sq (the SQ sims) and insights.std (the standard sims): game lines, props, alt lines,
// ladders, first events, DFS (SQ only), the team-based injury warnings and Gemini's whys. This page shows SIMKEY's.
const STR = { strong: ["Strong", "up"], lean: ["Lean", "lean"], uncertain: ["⚠ Uncertain", "unc"] };
const pctf = (x, d = 0) => (x === null || x === undefined || Number.isNaN(+x)) ? "–" : (100 * x).toFixed(d) + "%";
const odds = a => (a === null || a === undefined) ? "–" : (a > 0 ? "+" + a : String(a));
const evf = x => (x === null || x === undefined) ? "–" : sgn(100 * x, 1) + "%";
const evc = x => x === null || x === undefined ? "" : x >= .04 ? "up" : x < 0 ? "down" : "";
const strTag = s => s && STR[s] ? `<span class="sig ${STR[s][1]}">${STR[s][0]}</span>` : "";
const INS = (gid = S.gid) => (String(gid) === String(S.gid) ? S.mu : S.local[gid]?.mu)?.insights || null;
const SEC = (gid = S.gid) => INS(gid)?.[SIMKEY] || null;
const allGames = () => { const ids = new Set([String(S.gid), ...Object.keys(S.local).filter(k => S.local[k].mu?.insights)]); return [...ids]; };
const gameLbl = gid => { const g = S.games.find(x => String(x.schedule_id) === String(gid)); return g ? (g.teams || []).join("-") : ""; };
function noIns(el) { el.innerHTML = `<div class="empty-note">No market read for this game yet: the insights come with the hourly matchups run (books post player props about 14 hours before tip).</div>`; }
function warnHTML() {
  const W = INS()?.warnings || []; if (!W.length) return "";
  return W.map(w => `<details class="warn"${S.warnOpen ? " open" : ""}><summary>⚠ <b>${esc(w.team)}</b>: ${w.players.map(x => `${esc(x.name)} <span class="q">${esc(x.status)}</span> ${fmt(x.plan_min, 0)} min projected`).join(" · ")} — everything ${esc(w.team)}'s result decides is uncertain until his status is known</summary>
    ${w.players.map(x => { const o = x.without;
      return `<div class="wd">${o ? `<div><b>Without ${esc(x.name)}</b> (our what-if): ${esc(w.team)} ${fmt(o.with.team_pts)} → ${fmt(o.without.team_pts)} pts, win ${pctf(o.with.win)} → ${pctf(o.without.win)}${(o.teammates_up || []).filter(m => m.dk_change > 0).length ? " · up: " + o.teammates_up.filter(m => m.dk_change > 0).map(m => `${esc(m.name)} ${sgn(m.dk_change)} DK`).join(", ") : ""}</div>`
        : `<div>No what-if for ${esc(x.name)} yet today (it runs once a day).</div>`}
        ${(x.signals || []).map(s => `<div>• ${esc(s)} <span class="tag np">not tested</span></div>`).join("")}</div>`; }).join("")}</details>`).join("");
}
function whyHTML(k) { const w = INS()?.why?.[k]; return w ? `<div class="why">${esc(w)}</div>` : ""; }
function testedHTML(...keys) { const T = INS()?.tested || {}; const t = keys.map(k => T[k]).filter(Boolean); return t.length ? `<div class="tested-note">Backtest: ${t.map(esc).join(" ")}</div>` : ""; }
function insTable(el, key, head, rows) {   // pagedTable inside a sideways-scrolling box with the first column frozen
  el.innerHTML = `<div class="tw"><table class="t"><thead>${head}</thead><tbody></tbody></table></div>`;
  const per = fit(el, 30, 28 + (rows.length * 30 + 28 > el.clientHeight ? 32 : 0) + (el.scrollWidth > el.clientWidth ? 12 : 0)), g = pg(key, rows.length, per);

function renderDFS() {

    <div><h3>${tsw(p.team)}${esc(p.name)}</h3><div class="sub">${esc(p.team)}${p.uncertain ? " · ⚠ his team has a questionable player: uncertain" : ""}</div></div>
    ${why ? `<div class="why">${esc(why)}</div>` : ""}
    <div class="kp"><span>SQ <b>${fmt(p.sq_dk)}</b></span><span>Main <b>${fmt(p.main_dk)}</b></span>${p.dk_own !== null && p.dk_own !== undefined ? `<span>Own <b>${fmt(p.dk_own)}%</b></span>` : ""}</div>
    <ul class="rs">${(p.reasons || []).map((r, i) => `<li><span>${esc(r)}</span>${p.tested?.[i] ? `<span class="tested">Backtest: ${esc(p.tested[i])}</span>` : ""}</li>`).join("")}</ul>`;

// ------------------------------------------------------------------ v2: moments, the on-floor box, the jump ball (Chris 2026-11-07)
const JUMP_LEN = 5;   // replay seconds the opening tip holds the clock (the toss, the tip, the ball to a guard)
const TEAM_COLOR = { ATL: "#E03A3E", BOS: "#007A33", BKN: "#3d3d3d", BRK: "#3d3d3d", CHA: "#1D1160", CHO: "#1D1160", CHI: "#CE1141", CLE: "#860038",
  DAL: "#00538C", DEN: "#0E2240", DET: "#C8102E", GSW: "#1D428A", GS: "#1D428A", HOU: "#CE1141", IND: "#002D62", LAC: "#C8102E", LAL: "#552583",
  MEM: "#5D76A9", MIA: "#98002E", MIL: "#00471B", MIN: "#0C2340", NOP: "#0C2340", NO: "#0C2340", NYK: "#006BB6", NY: "#006BB6", OKC: "#007AC1",
  ORL: "#0077C0", PHI: "#006BB6", PHO: "#1D1160", PHX: "#1D1160", POR: "#E03A3E", SAC: "#5A2D81", SAS: "#5b6670", SA: "#5b6670", TOR: "#CE1141",
  UTA: "#002B5C", UTAH: "#002B5C", WAS: "#002B5C", WSH: "#002B5C" };
const tColor = t => TEAM_COLOR[String(S.rp?.teams?.[t]?.abbr || "").toUpperCase()] || `var(--t${t})`;
const badge = t => `<span class="badge" style="background:${tColor(t)}">${esc(tShort(t))}</span>`;
const MKT = () => (typeof STD === "function" && STD()) ? STD().markets : S.rp?.markets;
const SIMS_N = () => (typeof STD === "function" && STD()) ? STD().sims : S.rp?.sims;
function moments() {   // the moments of the replayed game, by event index; pr 3 = always pops out, 2 = pops out, 1 = list only
  const M = [], ev = S.ev, pts = {}, reb = {}, ast = {}, mk = MKT(), run = [0, 0], N = (SIMS_N() || 0).toLocaleString();
  let firstDone = false, lastLead = 0, ddDone = new Set(), tdDone = new Set(), runMark = 0;
  const fbShare = id => { const p = mk?.players?.[S.byId[id]?.rg_id]; return p?.fb ? p.fb.reduce((a, b) => a + b, 0) : null; };
  const fav = () => { let b = null, bp = -1; for (const [rg, p] of Object.entries(mk?.players || {})) { const v = (p.fb || []).reduce((a, x) => a + x, 0); if (v > bp) { bp = v; b = p; } } return b ? [b.name, bp] : null; };
  const lead = sc => Math.sign(sc[0] - sc[1]);
  for (let i = 0; i < ev.length; i++) {
    const e = ev[i], add = (pr, title, sub, team = e.team) => M.push({ i, t: e.t, pr, title, sub, team, q: e.period, clock: e.clock });
    if (e.type === "jump") {
      const [a, b] = (e.jump || []).map(x => x ? lastName(x) : ""), w = e.team;
      M.push({ i, t: e.t, pr: 3, team: w, q: 1, clock: "12:00", title: a && b ? `Opening tip · ${w === 0 ? a : b}` : "Opening tip", sub: `${esc(tShort(w))} wins it${e.p_win ? ` — <b>${Math.round(100 * e.p_win)}%</b> of sims` : ""}${a && b ? ` · ${esc(w === 0 ? a : b)} vs ${esc(w === 0 ? b : a)}` : ""}` });
      continue;
    }
    const scored = (e.type === "shot" && e.made) || (e.type === "fta" && e.made);
    if (scored) {
      const p = e.type === "shot" ? e.pts : 1, o = e.team;
      if (!firstDone) { firstDone = true; const s = fbShare(e.player), f = fav();
        add(3, `First basket · ${lastName(e.player)}`, s !== null ? `<b>${(100 * s).toFixed(1)}%</b> of ${N} sims${f && f[0] !== nm(e.player) ? ` · sims' favorite ${esc(f[0].split(" ").slice(-1)[0])} ${(100 * f[1]).toFixed(1)}%` : " · the sims' favorite"}` : "first points of the game"); }
      run[o] += p; run[1 - o] = 0;
      if (run[o] >= 8 && run[o] - runMark >= 4 && run[1 - o] === 0) { runMark = run[o]; add(2, `${tShort(o)} on a ${run[o]}-0 run`, `${e.score[0]}-${e.score[1]} · Q${Math.min(e.period, 5)} ${e.clock}`); }
      if (run[o] === p) runMark = 0;
      const before = pts[e.player] || 0; pts[e.player] = before + p;
      for (const m of [20, 30, 40, 50]) if (before < m && pts[e.player] >= m) add(m >= 30 ? 3 : 2, `${lastName(e.player)} · ${pts[e.player]} points`, `${pts[e.player]} pts · ${reb[e.player] || 0} reb · ${ast[e.player] || 0} ast`);
      if (e.type === "shot" && e.assist) ast[e.assist] = (ast[e.assist] || 0) + 1;
      if (e.type === "shot" && e.pts === 3) add(1, `${lastName(e.player)} from three`, e.assist ? `assist ${esc(lastName(e.assist))}` : (PT[e.play_type] || ""));
      const nx = ev[i + 1];
      if (e.type === "shot" && nx && nx.type === "fta" && nx.n === 1 && nx.player === e.player && nx.gt === e.gt) add(2, `And one · ${lastName(e.player)}`, `${e.pts} + the free throw`);
      const L = lead(e.score);
      if (L !== 0 && L !== lastLead && lastLead !== 0 && e.period >= 4) add(2, `Lead change · ${tShort(o)}`, `${e.score[0]}-${e.score[1]} · ${qName(e.period)} ${e.clock}`);
      if (L !== 0) lastLead = L;
    }
    if (e.type === "rebound" && e.player) reb[e.player] = (reb[e.player] || 0) + 1;
    if (e.type === "shot" && !e.made && e.block) add(1, `Blocked · ${lastName(e.block)}`, `on ${esc(lastName(e.player))}`, 1 - e.team);
    if (e.type === "turnover" && e.steal) add(1, `Steal · ${lastName(e.steal)}`, `from ${esc(lastName(e.player))}`, 1 - e.team);
    for (const id of [e.player, e.assist].filter(Boolean)) {   // double- / triple-doubles
      const c = [pts[id] || 0, reb[id] || 0, ast[id] || 0].filter(x => x >= 10).length;
      if (c >= 2 && !ddDone.has(id)) { ddDone.add(id); const t = S.byId[id]?.team ?? e.team; M.push({ i, t: e.t, pr: 2, title: `Double-double · ${lastName(id)}`, sub: `${pts[id] || 0} pts · ${reb[id] || 0} reb · ${ast[id] || 0} ast`, team: t, q: e.period, clock: e.clock }); }
      if (c >= 3 && !tdDone.has(id)) { tdDone.add(id); const t = S.byId[id]?.team ?? e.team; M.push({ i, t: e.t, pr: 3, title: `Triple-double · ${lastName(id)}`, sub: `${pts[id] || 0} pts · ${reb[id] || 0} reb · ${ast[id] || 0} ast`, team: t, q: e.period, clock: e.clock }); }
    }
    if (e.type === "period_end") {
      const top = Object.entries(pts).sort((a, b) => b[1] - a[1])[0], fin = i === ev.length - 1, w = e.score[0] > e.score[1] ? 0 : 1;
      M.push({ i, t: e.t, pr: fin ? 3 : 2, title: fin ? `Final · ${tShort(w)} wins` : `End of the ${qName(e.period)}`, team: fin ? w : (e.score[0] >= e.score[1] ? 0 : 1),
        sub: `${esc(tShort(0))} ${e.score[0]} - ${e.score[1]} ${esc(tShort(1))}${top ? ` · ${esc(lastName(top[0]))} ${top[1]} pts` : ""}`, q: e.period, clock: "0:00" });
    }
  }
  return M;
}
// pop-outs: one at a time; while one shows, the next waits (a lower one is dropped when two more are waiting)
const POP = { q: [], until: 0, el: null, timer: 0 };
function popQueue(m) {
  if (reduce) return;
  POP.q.push(m); POP.q.sort((a, b) => b.pr - a.pr); if (POP.q.length > 2) POP.q.length = 2;
  if (!POP.timer) popNext();
}
function popNext() {
  const el = POP.el || (POP.el = (() => { const d = document.createElement("div"); d.className = "popout"; d.setAttribute("aria-live", "polite"); $("courtbox").appendChild(d); return d; })());
  const m = POP.q.shift(); if (!m) { el.classList.remove("on"); POP.timer = 0; return; }
  el.innerHTML = `<span class="stripe" style="background:${tColor(m.team)}"></span>${badge(m.team)}<div style="min-width:0;padding:8px 0"><div class="pt1">${esc(m.title)}</div><div class="pt2">${m.sub || ""}</div></div>`;
  el.classList.add("on");
  POP.timer = setTimeout(() => { el.classList.remove("on"); POP.timer = setTimeout(popNext, 240); }, m.pr >= 3 ? 2600 : 1900);
}
function popClear() { clearTimeout(POP.timer); POP.timer = 0; POP.q = []; POP.el?.classList.remove("on"); }
function renderMoments() {
  const box = $("feed").parentElement;
  if (S.feedMode === "pbp") return renderFeedPBP();
  const n = fit(box, mobile() ? 42 : 48), rows = [];
  for (let k = (S.moms || []).length - 1; k >= 0 && rows.length < n; k--) { const m = S.moms[k]; if (m.i > S.cur) continue;
    rows.push(`<li>${badge(m.team)}<div class="mt"><strong class="mtt">${esc(m.title)}</strong><span>${m.sub || ""}</span></div><span class="mc">${m.clock ? `${m.q > 4 ? "OT" : "Q" + m.q} ${esc(m.clock)}` : ""}</span></li>`); }
  $("feed").className = "moments";
  $("feed").innerHTML = rows.join("") || `<li><span></span><div class="mt"><strong class="mtt">Press Play</strong><span>Moments pop up here as the game goes</span></div><span></span></li>`;
  $("feedCt").textContent = "";
}

// ------------------------------------------------------------------ views
function showView() {
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === S.view)));
  document.querySelectorAll(".view").forEach(v => v.hidden = v.dataset.v !== S.view);

  if (!S.rp) return;
  ({ replay: () => { renderShots(); renderFeed(); renderFive(); drawDots(); }, box: renderBox, angles: renderAngles, edges: renderEdges, profiles: renderProfiles,

  $("ptChips").querySelectorAll("[data-pt]").forEach(x => x.setAttribute("aria-pressed", String((x.dataset.pt || null) === S.pt))); renderShots(); });
$("views").addEventListener("click", e => {
  const ts = e.target.closest(".team-seg button"); if (ts) { const key = ts.closest(".team-seg").dataset.key; S[key] = +ts.dataset.t;
    if (key === "outTeam") S.outSel = null; ts.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === ts))); renderView(); return; }
  const sg = e.target.closest(".seg button[data-v]"); if (sg) { const id = sg.parentElement.id;
    if (id === "boxMode") S.boxMode = sg.dataset.v; if (id === "feedMode") S.feedMode = sg.dataset.v; if (id === "angScope") { S.angScope = sg.dataset.v; S.angSel = null; } if (id === "profSide") S.profSide = sg.dataset.v;
    if (id === "betPart") S.betPart = sg.dataset.v; if (id === "propMode") S.propMode = sg.dataset.v; if (id === "propScope") S.propScope = sg.dataset.v; if (id === "propOnly") S.propOnly = sg.dataset.v;

    sg.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === sg))); renderView(); return; }
  const p = e.target.closest("[data-pg]"); if (p) { S.page[p.dataset.pg] = (S.page[p.dataset.pg] || 0) + +p.dataset.d; renderView(); return; }
  const a = e.target.closest("[data-ang]"); if (a) { S.angSel = a.dataset.ang; renderAngles(); return; }
  const o = e.target.closest("[data-out]"); if (o) { S.outSel = o.dataset.out; renderOut(); return; }

  const h = e.target.closest("[data-sort]"); if (h) { const k = h.dataset.sort; S.sortDir = S.sortKey === k ? -S.sortDir : -1; S.sortKey = k; renderPlayers(); }
});
const svg = $("court"), tip = $("tip"), cb = $("courtbox");
function showTip(ev) { const g = ev.target.closest(".mk, .dot"); if (!g) { tip.hidden = true; return; }
  const r = cb.getBoundingClientRect();
  if (g.classList.contains("dot")) tip.innerHTML = `<b>${esc(nm(g.dataset.id))}</b> · ${esc(tShort(+g.dataset.t))}`;
  else { const e = S.ev[+g.dataset.i];
    tip.innerHTML = `<b>${esc(nm(e.player))}</b> · ${esc(tShort(e.team))}<br>${e.made ? "Made" : "Missed"} ${shotPts(e)} ${esc(ZONE[e.zone] || e.zone)}<br>${esc(PT[e.play_type] || e.play_type)} · Q${e.period} ${esc(e.clock)}`; }
  tip.hidden = false; const x = ev.clientX - r.left, y = ev.clientY - r.top;
  tip.style.left = Math.max(0, Math.min(r.width - 235, x + 12)) + "px"; tip.style.top = Math.max(0, y - 64) + "px"; }

  if (e.code === "Space") { e.preventDefault(); S.playing ? stop() : play(); } else if (e.key === "ArrowRight") jumpShot(1); else if (e.key === "ArrowLeft") jumpShot(-1); });
