<style>
/* Prediction Pro NFL (Chris 2026-11-17): the PickLabs NFL play-by-play sims priced against the exchanges (Kalshi, Polymarket,
   Novig), fees in. Prediction Pro's purple and black (brand guide: Violet #9B5FFF, Deep Violet #8956E3, Midnight #090032,
   Lilac #D0BCFF, Ink #0B0C14, Paper #F3F4F9). One screen; long lists scroll inside their panel; name columns stay frozen. */
:root {
  --text: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --t0: #2a6fd6; --t1: #d4561f;
}
:root, :root[data-theme="light"] {
  --ground: #f3f4f9; --surface: #ffffff; --ink: #0b0c14; --muted: #5d5878; --faint: #8b86a3; --rule: #e2def0; --rule-strong: #c9c1e3;
  --panel2: #efeafc; --accent: #8956e3; --accent-soft: #efe7ff; --accent-ink: #ffffff;
  --good: #2f7d32; --good-soft: #dff2db; --bad: #c0392b; --bad-soft: #f8e1de;
  --board: linear-gradient(180deg, #1a0f4a, #090032); --board-ink: #ffffff; --board-muted: #d0bcff;
  --hdr: #090032; --hdr-ink: #ffffff; --sel: #8956e3; --sel-ink: #ffffff; --bar: #090032; --bar-ink: #ffffff; --bar-sub: #d0bcff;
  --bet: #8956e3; --bet-ink: #ffffff; --ctl-bg: #ffffff; --ctl-ink: #0b0c14; --ctl-rule: #ffffff;
  --turf: #2f7a3d; --turf2: #2a6f37; --turf-line: rgba(255, 255, 255, .78); --turf-num: rgba(255, 255, 255, .55);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --ground: #0b0c14; --surface: #12101f; --ink: #f3f0ff; --muted: #a99fc9; --faint: #6f6690; --rule: #251c3d; --rule-strong: #34295a;
  --panel2: #181028; --accent: #9b5fff; --accent-soft: rgba(155, 95, 255, .2); --accent-ink: #ffffff;
  --good: #3fcf7e; --good-soft: rgba(63, 207, 126, .14); --bad: #ff6f5e; --bad-soft: rgba(255, 111, 94, .14);
  --board: linear-gradient(180deg, #1a0f4a, #0a0912); --board-ink: #ffffff; --board-muted: #a99fc9;
  --hdr: #090032; --hdr-ink: #ffffff; --sel: #9b5fff; --sel-ink: #ffffff; --bar: #1d1340; --bar-ink: #ffffff; --bar-sub: #d0bcff;
  --bet: #8956e3; --bet-ink: #ffffff; --ctl-bg: #181028; --ctl-ink: #f3f0ff; --ctl-rule: #34295a;
  --turf: #1f5a2b; --turf2: #1b5026; --turf-line: rgba(255, 255, 255, .6); --turf-num: rgba(255, 255, 255, .4);
  color-scheme: dark;
}
* { box-sizing: border-box }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ground); color: var(--ink) }
body { font: 400 14px/1.4 var(--text); font-variant-numeric: tabular-nums }
button, select, input { font: inherit; color: inherit }
button { cursor: pointer }
a { color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
[hidden] { display: none !important }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }
.app { height: 100%; height: 100dvh; display: flex; flex-direction: column; gap: 8px; max-width: 1440px; margin: 0 auto;
  padding: max(10px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(10px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)) }
/* header: one navy bar, edge to edge */
.top { position: relative; z-index: 60; display: flex; align-items: center; gap: 10px; min-width: 0; color: var(--hdr-ink);
  margin-top: calc(-1 * max(10px, env(safe-area-inset-top, 0px))); padding: max(10px, env(safe-area-inset-top, 0px)) 0 10px }
.top::before { content: ""; position: absolute; top: 0; bottom: 0; left: -100vmax; right: -100vmax; z-index: -1; background: var(--hdr); border-bottom: 1px solid var(--rule) }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 18px; white-space: nowrap }
.brand .an { display: block; height: 26px }
.brand span { color: var(--hdr-ink) }
.top .grow { flex: 1; min-width: 0 }
.top select, .thm { background: var(--ctl-bg); color: var(--ctl-ink); border: 1px solid var(--ctl-rule); border-radius: 6px; padding: 5px 8px; min-height: 32px }
.top #gamePick { width: 100%; max-width: 100% }
.upd { color: #d0bcff; font-size: 12px; white-space: nowrap }
.ppnote { color: var(--muted); font-size: 12px }
.thm { flex: 0 0 auto; min-width: 34px; font-size: 15px; line-height: 1 }
@media (max-width: 760px) { .upd { display: none } .brand { font-size: 16px } }
@media (max-width: 520px) { .brand .an { height: 18px } .brand span { display: none } #bookPick { max-width: 110px } }
/* scoreboard */
.board { background: var(--board); color: var(--board-ink); border: 1px solid var(--rule); border-radius: 10px; padding: 8px 16px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px }
.side { display: flex; align-items: center; gap: 12px; min-width: 0 }
.side.r { justify-content: flex-end; text-align: right }
.tn { font-weight: 800; font-size: 20px; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.tn i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 7px; vertical-align: 1px }
.side.r .tn i { margin: 0 0 0 7px }
.tmeta { color: var(--board-muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.sc { font-weight: 800; font-size: 38px; line-height: 1; min-width: 2.1ch; text-align: center }
.clk { text-align: center; line-height: 1.15 }
.clk b { display: block; font-weight: 700; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--board-muted) }
.clk strong { font-weight: 700; font-size: 22px }
.clk small { display: block; color: var(--board-muted); font-size: 11px }
@media (max-width: 760px) { .board { padding: 6px 10px; gap: 6px } .tn { font-size: 15px } .sc { font-size: 28px } .clk strong { font-size: 17px } .tmeta { display: none } }
/* tabs */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--rule-strong); overflow-x: auto; scrollbar-width: none; flex: 0 0 auto }
.tabs::-webkit-scrollbar { display: none }
.tabs button { flex: 0 0 auto; background: none; border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px; padding: 6px 12px; font-weight: 700; color: var(--muted); border-radius: 6px 6px 0 0 }
.tabs button[aria-selected="true"] { background: var(--sel); color: var(--sel-ink); border-bottom-color: var(--sel) }
/* views */
.views { flex: 1; min-height: 0; position: relative }
.view { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 8px; min-height: 0 }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 6px }
.scroll { flex: 1; min-height: 0; overflow: auto }
.lbl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted) }
.row { display: flex; align-items: center; gap: 8px; min-width: 0 }
.row.wrap { flex-wrap: wrap }
.spacer { flex: 1 }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--sel); border-radius: 6px; overflow: hidden; flex: 0 0 auto }
.seg button { border: 0; background: none; padding: 4px 10px; font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap }
.seg button[aria-pressed="true"] { background: var(--sel); color: var(--sel-ink) }
.note { color: var(--muted); font-size: 12px }
.empty { color: var(--muted); font-size: 13px; padding: 12px 0 }
.tag { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; vertical-align: 1px }
.tag.ok { background: var(--good-soft); color: var(--good) }
.tag.un { background: var(--panel2); color: var(--muted) }
.ev { font-weight: 700 }
.ev.pos { color: var(--good) } .ev.neg { color: var(--bad) }
a.px { display: inline-flex; flex-direction: column; align-items: center; min-width: 58px; padding: 2px 8px; border-radius: 6px; background: var(--bet); color: var(--bet-ink); text-decoration: none; font-weight: 700; line-height: 1.15 }
a.px small, span.px small { font-weight: 500; font-size: 10px; opacity: .85 }
span.px { display: inline-flex; flex-direction: column; align-items: center; min-width: 58px; padding: 2px 8px; font-weight: 700; line-height: 1.15 }
/* tables: name column frozen on horizontal scroll (every table) */
.tbl { overflow: auto; flex: 1; min-height: 0 }
table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px }
th, td { padding: 5px 8px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--rule) }
th { position: sticky; top: 0; z-index: 2; background: var(--surface); color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em }
th:first-child, td:first-child { position: sticky; left: 0; z-index: 1; background: var(--surface); text-align: left; box-shadow: 1px 0 0 var(--rule) }
th:first-child { z-index: 3 }
td.l, th.l { text-align: left }
td small { color: var(--muted) }
/* replay (2026-11-18): the field fills the panel; 22 dots; results pop up by the ball, big moments as a banner */
.rp { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 8px; height: 100% }
.rp-left { display: flex; flex-direction: column; gap: 6px; min-height: 0; padding: 6px }
.fieldbox { position: relative; flex: 1; min-height: 200px; border-radius: 8px; overflow: hidden; background: var(--turf2); cursor: pointer }
#field { position: absolute; inset: 0; width: 100%; height: 100%; display: block }
#field .surround { fill: var(--turf2); filter: brightness(.82) }
#field .grass { fill: var(--turf) } #field .stripe { fill: var(--turf2) }
#field .yl { stroke: var(--turf-line); stroke-width: .2 } #field .hash { stroke: var(--turf-line); stroke-width: .16 }
#field .sideline { fill: none; stroke: #fff; stroke-width: .35 }
#field .num { fill: var(--turf-num); font: 700 3px var(--text); text-anchor: middle }
#field .eztxt { fill: rgba(255, 255, 255, .88); font: 800 4.2px var(--text); text-anchor: middle; letter-spacing: .3px }
#field .post { stroke: #ffd84a; stroke-width: .45; stroke-linecap: round }
#field .los { stroke: #5aa9ff; stroke-width: .35 } #field .fd { stroke: #ffd84a; stroke-width: .35 }
#field .flag { fill: #ffd400; stroke: #6b5a00; stroke-width: .08 }
#field .dot circle { stroke-width: .2 }
#field .dot text { font: 800 1.05px var(--text); text-anchor: middle; dominant-baseline: central; pointer-events: none }
#field .ball { fill: #8a4a1c; stroke: #fff; stroke-width: .12 }
#field .bsh { fill: #000 }
#field .tag { font: 700 1.3px var(--text); text-anchor: middle; fill: #fff; stroke: rgba(0, 0, 0, .7); stroke-width: .3; paint-order: stroke; pointer-events: none }
.call { position: absolute; z-index: 3; min-width: 150px; max-width: min(340px, 86%); background: rgba(9, 13, 20, .93); color: #fff; border-radius: 8px;
  padding: 6px 10px 6px 13px; box-shadow: 0 6px 18px rgba(0, 0, 0, .35); pointer-events: none; animation: callIn .22s ease-out }
.call::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; border-radius: 8px 0 0 8px; background: var(--cc) }
.call .h { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 14px; line-height: 1.2 }
.call .b { margin-left: auto; padding: 1px 7px; border-radius: 5px; font-size: 13px; font-weight: 800; white-space: nowrap }
.call .b.pos { background: #2fbf71; color: #052313 } .call .b.neg, .call .b.to { background: #e5484d; color: #fff }
.call .b.td { background: #f5c518; color: #1a1400 } .call .b.neu { background: #4a5563; color: #fff } .call .b.flag { background: #ffd400; color: #1a1400 }
.call .s { font-size: 12px; color: #c9d3df; margin-top: 2px }
.banner { position: absolute; left: 50%; top: 9%; z-index: 4; padding: 6px 20px 8px; border-radius: 9px; text-align: center; color: #fff; background: var(--bc);
  font-weight: 900; font-size: clamp(18px, 3vw, 32px); letter-spacing: .07em; box-shadow: 0 8px 26px rgba(0, 0, 0, .4); border: 2px solid rgba(255, 255, 255, .85);
  transform: translateX(-50%); animation: banIn .32s ease-out; pointer-events: none; white-space: nowrap }
.banner small { display: block; font-size: 12px; letter-spacing: .1em; font-weight: 700; opacity: .9 }
.sit { position: absolute; left: 8px; bottom: 8px; z-index: 2; background: rgba(9, 13, 20, .72); color: #fff; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 6px; pointer-events: none; max-width: calc(100% - 16px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
@keyframes callIn { from { opacity: 0; transform: translateY(6px) scale(.92) } to { opacity: 1; transform: none } }
@keyframes banIn { from { opacity: 0; transform: translateX(-50%) scale(.75) } to { opacity: 1; transform: translateX(-50%) scale(1) } }
.ctl { display: flex; align-items: center; gap: 6px; flex-wrap: wrap }
.btn { border: 1px solid var(--rule-strong); background: var(--surface); border-radius: 6px; padding: 4px 10px; font-weight: 600; min-height: 30px }
.btn.primary { background: var(--sel); border-color: var(--sel); color: var(--sel-ink); min-width: 64px }
.ctl select { background: var(--surface); border: 1px solid var(--rule-strong); border-radius: 6px; padding: 4px 6px; min-height: 30px }
.ctl input[type=range] { flex: 1; min-width: 110px; accent-color: var(--accent) }
.ctl .note { white-space: nowrap }
.bets { list-style: none; margin: 0; padding: 0 }
.bets li { padding: 7px 4px; border-bottom: 1px solid var(--rule); display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; border-radius: 6px }
.bets li.up { animation: flUp 1.4s ease-out } .bets li.dn { animation: flDn 1.4s ease-out }
@keyframes flUp { 0% { background: rgba(47, 191, 113, .38) } 100% { background: transparent } }
@keyframes flDn { 0% { background: rgba(229, 72, 77, .32) } 100% { background: transparent } }
.bets .st { font-size: 12px; color: var(--muted) }
.bets .hit { color: var(--good); font-weight: 700 } .bets .miss { color: var(--bad); font-weight: 700 }
.bar { height: 5px; border-radius: 3px; background: var(--panel2); grid-column: 1 / -1; overflow: hidden }
.bar i { display: block; height: 100%; background: var(--accent); transition: width .5s ease } .bar i.ok { background: var(--good) } .bar i.bad { background: var(--bad) }
@media (max-width: 900px) { .rp { grid-template-columns: 1fr; grid-template-rows: auto auto; overflow: auto; align-content: start }
  .rp > .panel { min-height: auto } .fieldbox { flex: 0 0 auto; height: 38vh; min-height: 220px } .rp-right .scroll { flex: 0 0 auto; max-height: 46vh }
  .call { min-width: 0; max-width: calc(100% - 12px); padding: 4px 8px 4px 11px } .call .h { font-size: 12px; gap: 8px } .call .b { font-size: 12px } .call .s { font-size: 11px } .sit { font-size: 11px } }
@media (max-width: 760px) { #dLbl { display: none } }
@media (max-width: 600px) { .banner { top: auto; bottom: 34px; padding: 4px 14px 5px } }
/* cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; align-content: start }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column }
.card h3 { margin: 0; padding: 8px 12px; background: var(--bar); color: var(--bar-ink); font-size: 13px; font-weight: 800; display: flex; justify-content: space-between; gap: 8px }
.card h3 small { color: var(--bar-sub); font-weight: 600 }
.card .bd { padding: 8px 12px; display: flex; flex-direction: column; gap: 8px }
.pick { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; padding-bottom: 8px; border-bottom: 1px solid var(--rule) }
.pick:last-child { border-bottom: 0; padding-bottom: 0 }
.pick .g { color: var(--muted); font-size: 12px; grid-column: 1 }
.cdown { display: flex; gap: 10px; align-items: baseline; padding: 10px 12px; background: var(--board); color: var(--board-ink); border-radius: 10px }
.cdown .t { font-weight: 800; font-size: 20px } .cdown .w { color: var(--board-muted); font-size: 12px }
.kpis { display: flex; gap: 8px; flex-wrap: wrap }
.kpi { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 8px 12px; min-width: 150px }
.kpi b { display: block; font-size: 22px } .kpi span { color: var(--muted); font-size: 12px }
.stk { color: var(--muted); font-weight: 600; font-size: 11px }
</style>

<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (x, d = 0) => x === null || x === undefined ? "–" : (100 * x).toFixed(d) + "%";
const odds = a => { if (a === null || a === undefined || !+a) return "–"; const d = +a > 0 ? 1 + a / 100 : 1 + 100 / Math.abs(a); return (100 / d).toFixed(1) + "¢"; };
const dec1 = a => a > 0 ? 1 + a / 100 : 1 + 100 / Math.abs(a);
const DATA = "https://raw.githubusercontent.com/chrisgimino/jabroni/nfl-data/";
const DLURL = id => /^https?:/.test(id) ? id : `https://switchboard.actionnetwork.com/v2/deeplink?deeplinkId[0]=${encodeURIComponent(id)}&context=predictionpro`;
const DLMULTI = ids => `https://switchboard.actionnetwork.com/v2/deeplink?${ids.map((d, i) => `deeplinkId[${i}]=${encodeURIComponent(d)}`).join("&")}&context=predictionpro`;
const isTest = id => !id || String(id).includes("TEST-");
const oneLink = ids => ids.length && ids.every(d => !/^https?:/.test(d));   // one link for every leg: Novig ids only
const S = { slate: null, prices: null, gid: null, i: 0, playing: false, timer: null, view: "replay", book: null, scope: "game", tested: true, per: "game", tdKind: "anytime_td" };
S.book = (() => { try { const v = localStorage.getItem("ppNflBook"); return v === null ? "Kalshi" : v || null; } catch (e) { return "Kalshi"; } })();   // Kalshi unless picked

// ---------------------------------------------------------------- data (nfl-data branch; prices re-read every 5 minutes)
async function getJSON(u) { const r = await fetch(u, { cache: "no-store" }); if (!r.ok) throw new Error(r.status); return r.json(); }
async function load(first) {
  const p = await getJSON(DATA + "nfl_prediction_prices.json");
  if (!first && S.prices && p.created_utc === S.prices.created_utc) return false;
  if (first || !S.slate || p.slate !== S.slate.id) S.slate = await getJSON(DATA + "nfl_picklabs_replay_data.json");
  S.prices = p; return true;
}
const stamp = s => { const d = new Date(s); return isNaN(d) ? "" : d.toLocaleString("en-US", { timeZone: "America/New_York", weekday: "short", hour: "numeric", minute: "2-digit" }) + " ET"; };
const games = () => S.slate?.index?.games || [];
const G = gid => S.slate?.games?.[gid];
const INS = gid => S.prices?.games?.[gid]?.pp;
function fillPicker() {
  $("gamePick").innerHTML = games().map(g => `<option value="${g.schedule_id}">${esc(g.away)} at ${esc(g.home)}${g.kick ? " · " + esc(stamp(g.kick)) : ""}</option>`).join("");
  $("gamePick").value = S.gid;
}

    seen.add(p.key); seen.add(`${p.g.player}|${p.g.stat}`); out.push({ text: p.text, rg: core2rg[p.g.player], stat: p.g.stat, side: p.g.side, line: p.g.line, price: p.price, book: p.book, dl: p.dl, sim: p.sim, ev: p.ev, best: true });
  }
  const props = (INS(S.gid)?.props || []).filter(r => r.tested);
  const lanes = [];
  for (const r of props) for (const sd of ["over", "under"]) { const o = r[sd]; if (o && o.ev !== null) lanes.push({ r, sd, o }); }
  lanes.sort((x, y) => y.o.ev - x.o.ev);
  for (const { r, sd, o } of lanes) {   // one side per player and stat (the better EV), ten at most
    if (out.length >= 10) break;
    const k = `${r.core_id}|${r.stat_key}`; if (seen.has(k)) continue; seen.add(k);
    const p = sd === "over" ? r.sim_over : 1 - r.sim_over;
    out.push({ text: `${r.name} ${sd === "over" ? "Over" : "Under"} ${r.line} ${r.stat}`, rg: core2rg[r.core_id], stat: r.stat_key, side: sd, line: r.line, price: o.price, book: o.book, dl: o.dl, sim: p, ev: o.ev, bp: o.bp });
  }
  return out;
}

// ---------------------------------------------------------------- best bets (Wed-Sat 5 PM ET: a slot shows from its release time on)
const BOOKS_WORD = "exchanges";
const BY = s => S.book && s.by_book?.[S.book] ? s.by_book[S.book] : null;
const slotPicks = s => (BY(s) || s).picks || [];
const slotPar = s => BY(s) ? BY(s).parlay : s.parlay;
const DROPS = [3, 4, 5, 6];   // JS getDay(): Wed, Thu, Fri, Sat
function etParts(d = new Date()) {
  return Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit", hour: "numeric", minute: "numeric", second: "numeric", hourCycle: "h23", weekday: "short" })
    .formatToParts(d).filter(x => x.type !== "literal").map(x => [x.type, x.value]));
}
function slotLive(lab) {   // "YYYY-MM-DD 17:00" (ET) is at or before now (ET)
  const p = etParts(), now = `${p.year}-${p.month}-${p.day} ${String(p.hour).padStart(2, "0")}:${String(p.minute).padStart(2, "0")}`;
  return lab <= now;
}
function nextDrop() {
  const p = etParts(), wd = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].indexOf(p.weekday), secs = (+p.hour) * 3600 + (+p.minute) * 60 + (+p.second);
  for (let k = 0; k < 8; k++) {
    const d = (wd + k) % 7; if (!DROPS.includes(d)) continue;
    const left = k * 86400 + 17 * 3600 - secs; if (left > 0) return { left, label: `${["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][d]} 5:00 PM ET` };
  }
  return null;
}
const hms = x => { const d = Math.floor(x / 86400), h = Math.floor(x % 86400 / 3600), m = Math.floor(x % 3600 / 60), s = x % 60; return (d ? d + "d " : "") + (d || h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0"); };
function cdHTML() { const n = nextDrop(); return n ? `<div class="cdown" data-cd="1"><span>Next picks</span><span class="t">${hms(n.left)}</span><span class="w">${esc(n.label)}</span></div>` : ""; }
setInterval(() => { document.querySelectorAll("[data-cd]").forEach(el => { el.outerHTML = cdHTML(); }); }, 1000);
function pickHTML(p) {   // the size at the price shown (the book picker can move it)
  const at = atBook(p.price, p.book, p.dl, p.bp, p.sim);
  return `<div class="pick"><div><b>${esc(p.text)}</b></div><div style="text-align:right">${at ? px(at.price, at.book, at.dl) : "<span class='note'>not at this book</span>"}</div>
    <div class="g">${esc(p.game)} · sim ${pct(p.sim)} · EV ${at ? evs(at.ev, at.price) : evh(p.ev)}${p.books ? ` · ${p.books} ${BOOKS_WORD}` : ""}</div></div>`;
}
function renderBest() {
  const sl = (S.prices?.best_bets?.slots || []).filter(s => slotLive(s.slot)).slice().reverse();
  $("bestBoard").innerHTML = `${cdHTML()}<p class="ppnote">Kalshi, Polymarket and Novig. Price = cost of a $1 contract, the exchange's fee included. Bet size = quarter-Kelly on a 40-unit bankroll.</p><p class="note">${esc(S.prices?.tested?.props || "")}</p><div class="cards">` + (sl.length ? sl.map(s =>
    `<div class="card"><h3>${esc(new Date(s.slot.replace(" ", "T") + ":00-05:00").toLocaleDateString("en-US", { weekday: "long", month: "short", day: "numeric", timeZone: "America/New_York" }))} · 5 PM ET<small>${S.book && s.by_book ? esc(S.book) + " · " : ""}${slotPicks(s).length} picks</small></h3>
      <div class="bd">${slotPicks(s).map(pickHTML).join("") || `<div class='empty'>No bet cleared the bar${S.book && s.by_book ? " at " + esc(S.book) : ""}</div>`}</div></div>`).join("") : `<div class="empty">This week's picks go up Wednesday-Saturday at 5 PM ET.</div>`) + `</div>`;
}
// ---------------------------------------------------------------- parlays
function renderParlay() {
  const sl = (S.prices?.best_bets?.slots || []).filter(s => slotLive(s.slot) && slotPar(s)).slice().reverse();
  const sb = INS(S.gid)?.sgp_books, sgp = S.book && sb && S.book in sb ? sb[S.book] : INS(S.gid)?.sgp; let h = `${cdHTML()}<div class="cards">`;
  h += sl.map(s => { const p = slotPar(s), ids = p.legs.map(l => l.dl).filter(d => !isTest(d)), all = ids.length === p.legs.length && oneLink(ids);
    return `<div class="card"><h3>Parlay of the day · ${esc(s.slot.slice(5, 10))}<small>${esc(p.book)} est. ${odds(p.odds)} · bet ${uTxt(p.stake ?? stakeU(p.ev, p.odds))}</small></h3><div class="bd">
      ${p.legs.map(l => `<div class="pick"><div>${esc(l.text)}</div><div>${px(l.odds, null, l.dl)}</div><div class="g">${esc(l.game)} · sim ${pct(l.p)}</div></div>`).join("")}
      <div class="row"><span class="note">All legs hit in ${pct(p.p, 1)} of the sims (different games: chances multiplied). Est. = the legs' prices multiplied; the exchange quotes the combo itself.${all ? "" : " Trade each leg from its own link."}</span><span class="spacer"></span>${all ? `<a class="px" href="${DLMULTI(ids)}" target="_blank" rel="noopener">${odds(p.odds)}<small>${esc(p.book)} · all legs</small></a>` : ""}</div></div></div>`; }).join("");

// ---------------------------------------------------------------- betting (game lines: untested)
const PER = { game: "Game", h1: "1st half", h2: "2nd half", q1: "1st qtr", q2: "2nd qtr", q3: "3rd qtr", q4: "4th qtr" };
function line2(label, sim, price, book, dl, bp, extra = "") {
  const at = atBook(price, book, dl, bp, sim); if (!at) return "";
  return `<tr><td class="l">${esc(label)}${extra}</td><td>${pct(sim, 1)}</td><td>${px(at.price, at.book, at.dl)}</td><td>${evs(at.ev, at.price)}</td></tr>`;

function renderBet() {

  for (const [k, lab] of [["overtime", "Overtime"], ["no_td", "No touchdown in the game"]]) { const o = g[k]; if (o) for (const sd of ["yes", "no"]) if (o[sd]) r += line2(`${lab}: ${sd}`, sd === "yes" ? o.sim : 1 - o.sim, o[sd].best_price, o[sd].best_book, o[sd].dl, null); }
  const tt = (g.team_totals?.teams || []).map(t => `<tr><td class="l">${esc(t.team)} team total ${t.line}</td><td>${pct(t.sim_over, 1)} over</td><td>${t.market_over !== null ? pct(t.market_over, 1) + " market" : ""}</td><td></td></tr>`).join("");
  $("betBoard").innerHTML = `<div class="panel"><div class="tbl"><table><thead><tr><th>Bet</th><th>Sim</th><th>Best price</th><th>EV</th></tr></thead><tbody>${r}${tt}</tbody></table></div></div>`;
}
// ---------------------------------------------------------------- props
function scopeSeg(id, rerender) {
  return `<div class="seg" id="${id}"><button data-s="game" aria-pressed="${S.scope === "game"}">This game</button><button data-s="slate" aria-pressed="${S.scope === "slate"}">Whole slate</button></div>`;
}
function wire(id, rerender) { document.querySelectorAll(`#${id} [data-s]`).forEach(b => b.onclick = () => { S.scope = b.dataset.s; rerender(); }); }
const scopeGames = () => S.scope === "game" ? [S.gid] : games().map(g => g.schedule_id);
function renderProps() {
